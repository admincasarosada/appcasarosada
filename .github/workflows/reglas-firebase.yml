# Publica automáticamente las reglas de seguridad en Firebase
# cada vez que cambia el archivo firestore.rules en el repositorio.
# Requiere el secreto FIREBASE_SERVICE_ACCOUNT (llave JSON de la cuenta de servicio de Firebase).
name: Publicar reglas de Firebase

on:
  push:
    branches: [main]
    paths: [firestore.rules, scripts/publicar-reglas.js, .github/workflows/reglas-firebase.yml]
  workflow_dispatch:

jobs:
  reglas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Llave de Firebase
        env:
          LLAVE: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$LLAVE" ]; then echo "Falta el secreto FIREBASE_SERVICE_ACCOUNT"; exit 1; fi
          printf '%s' "$LLAVE" > "$RUNNER_TEMP/llave.json"
      - name: Publicar reglas
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/llave.json
        run: |
          npm install --no-save --no-audit --no-fund firebase-admin@13
          node scripts/publicar-reglas.js
      - name: Borrar llave
        if: always()
        run: rm -f "$RUNNER_TEMP/llave.json"
