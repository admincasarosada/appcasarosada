<style>
/* Paleta del logo oficial: fucsia, rosa hoja, negro y blanco */
:root{--st-pago:#e53935;--st-ocup:#ff6b6b;--st-cocina:#ffb74d;--st-listo:#fff176;--st-camino:#64b5f6;--st-serv:#c9efcf;--rosa:#e5168d;--rosa-h:#c80f78;--rosa2:#e58fbf;--rosa3:#fbe3ef;--negro:#1d1d1b;

body,header,nav,.card,.mesa,input,select,textarea,button{transition:background-color .2s,color .2s,border-color .2s}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tx);font-size:15px}
/* Modo claro: fondo blanco en Cocina y En curso para que resalten las tarjetas rosadas */

button{font:inherit;cursor:pointer;border:0;border-radius:8px;padding:10px 14px;background:var(--btn);color:var(--tx)}
button.pri:hover{background:var(--rosa-h)}

label{font-size:13px;color:var(--mu);display:block;margin:8px 0 4px}

main{padding:16px;max-width:1200px;margin:0 auto}
.card{background:var(--card);border-radius:12px;padding:14px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sp{flex:1}.mu{color:var(--mu);font-size:13px}.b{font-weight:700}.r{text-align:right}
.grid{display:grid;gap:12px}

.mesa .n{font-size:24px;font-weight:800}.mesa.ocup{background:var(--ocup);color:var(--ocup-tx);border-color:var(--rosa)}.mesa.cuenta{background:var(--cuenta);color:#fff;border-color:var(--rosa-h)}

.kcard li{font-size:17px;margin:4px 0}.kcard li.nw{font-weight:800}.kcard .nota{color:var(--rojo);font-size:14px}

.login{max-width:380px;margin:8vh auto}
.login h1{color:var(--rosa);margin:0 0 4px}

#app > .tema{position:fixed;top:14px;right:14px}
.banner{background:var(--banner);border:1px solid var(--banner-b);padding:10px 14px;border-radius:10px;font-size:13px;margin-bottom:14px}

.ver{font-size:11px;font-weight:700;color:var(--rosa);background:var(--rosa3);border-radius:20px;padding:2px 8px;white-space:nowrap;line-height:1.4}
.nueva-ver{background:var(--azul);color:#fff;text-align:center;padding:9px 12px;font-size:14px;cursor:pointer}
.nueva-ver b{text-decoration:underline}
.barra-movil{display:none}
nav .badge{display:inline-block;min-width:22px;padding:1px 7px;border-radius:20px;background:var(--rojo);color:#fff;font-size:12px;font-weight:800;margin-left:2px}

.est{display:inline-block;padding:3px 10px;border-radius:20px;font-weight:800;font-size:13px}
.est.cocina{background:var(--st-cocina);color:#5a2d00}.est.listo{background:var(--st-listo);color:#4a4000;animation:latido 1.6s infinite}.est.camino{background:var(--st-camino);color:#0d2b52}.est.serv{background:var(--st-serv);color:#1b5e20}

.planos-vivo{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:12px;align-items:start}

.tablero{display:grid;grid-template-columns:repeat(7,minmax(210px,1fr));gap:10px;overflow-x:auto;padding-bottom:6px}
.tablero .col{background:var(--card);border-radius:12px;padding:8px;border-top:5px solid var(--ln);min-height:120px}
.tablero .col h4{margin:2px 2px 8px;display:flex;justify-content:space-between;align-items:center;font-size:14px}
.tcard{border:1px solid var(--ln);border-radius:10px;padding:8px;margin-bottom:8px;background:var(--bg);cursor:pointer;font-size:13px}
/* Tarjetas de pedidos (cocina, En curso y tablero): rosado tenue igual en modo claro y oscuro, con texto oscuro legible */
.pz,.tcard{--tx:#2b1822;--mu:#7d5c6b;--bg:#fff6fa;--ln:#f1c9da;--card:#fde6f0;--rosa3:#ffffff;--btn:#ffffff;--st-cocina:#ffb74d;--st-listo:#fff176;--st-camino:#64b5f6;background:#fde6f0!important;color:#2b1822}
.tcard{background:#fde6f0!important}
.pz .k-sin{color:#d32f2f!important}.pz .k-cambio{color:#1e5bd8!important}.pz .k-pos{background:#1b1b1b!important;color:#fff!important}
.tcard:hover{border-color:var(--rosa)}.tcard b{font-size:14px}
.matriz td,.matriz th{text-align:center}.matriz td:first-child,.matriz th:first-child{text-align:left}
.matriz td.n{cursor:pointer;font-weight:800}.matriz td.n.cero{color:var(--mu);font-weight:400}.matriz td.sel{outline:2px solid var(--rosa);border-radius:6px}
@media(max-width:640px){.tablero{grid-template-columns:repeat(7,82vw);scroll-snap-type:x mandatory}.tablero .col{scroll-snap-align:start}}

.modulo{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;padding:16px;border:2px solid var(--ln);background:var(--card);border-radius:14px;color:var(--tx);min-height:104px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.modulo .si{font-size:30px;line-height:1}.modulo b{font-size:17px}.modulo .mu{font-size:12px}

.plano .fondo{position:absolute;inset:0;width:100%;height:100%;display:block;border-radius:12px;user-select:none;pointer-events:none}
[data-tema="oscuro"] .plano .fondo{filter:invert(.88) hue-rotate(180deg) brightness(.9)}
.plano{position:relative;width:100%;max-width:780px;margin:0 auto;background:var(--card);border-radius:12px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.plano .zona{position:absolute;border:1.5px dashed #b9a9b2;border-radius:6px;display:flex;align-items:center;justify-content:center;pointer-events:none;opacity:.85}

.pmesa{position:absolute;padding:2px 4px;border:2.5px solid #b87a50;box-shadow:0 1px 3px rgba(0,0,0,.15);background:var(--libre);color:var(--tx);border-radius:8px;display:flex;align-items:center;justify-content:center;overflow:hidden;line-height:1.08;container-type:size}

.pmesa .pin{font-size:min(20cqh,13cqw);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3cqh;max-width:100%;max-height:100%;overflow:hidden}
.pmesa .pn{font-weight:900;font-size:min(28cqh,19cqw);white-space:nowrap;line-height:1.05}
.pmesa .pw{font-size:min(21cqh,14cqw);font-weight:700;white-space:nowrap;max-width:96cqw;overflow:hidden;text-overflow:ellipsis}
.pmesa .pc{display:flex;line-height:1}.pmesa .pw{line-height:1.1}.pmesa .pc .crono{font-size:min(19cqh,13cqw);padding:.1em .45em;line-height:1.1}
.pmesa.vert .pin{font-size:min(20cqw,13cqh);writing-mode:vertical-rl;transform:rotate(180deg);gap:3cqw}
.pmesa.vert .pn{font-size:min(30cqw,19cqh)}.pmesa.vert .pw{font-size:min(21cqw,14cqh);max-width:none;max-height:96cqh}.pmesa.vert .pc .crono{font-size:min(19cqw,13cqh);padding:.45em .1em}

.pmesa.serv{border-color:var(--listo)}
.crono{font-variant-numeric:tabular-nums;font-weight:800;background:var(--btn);color:var(--tx);border-radius:20px;padding:2px 9px;font-size:13px;white-space:nowrap;display:inline-block}
.crono.naranja{background:#ffb74d;color:#3a2200}.crono.rojo{background:var(--rojo);color:#fff}.crono.fijo{background:var(--rosa3);color:var(--tx)}

.kcard .nota{color:var(--rojo);font-size:16px;font-weight:700}

}

}

function temaActual(){ let t=null; try{ t=localStorage.getItem("crx_tema"); }catch(e){}
  return t||(window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches?"oscuro":"claro"); }
function aplicarTema(t){ document.documentElement.setAttribute("data-tema",t);
  const m=document.querySelector('meta[name="theme-color"]'); if(m) m.content=t==="oscuro"?"#1a1719":"#e5168d"; }
function cambiarTema(){ const t=temaActual()==="oscuro"?"claro":"oscuro"; try{ localStorage.setItem("crx_tema",t); }catch(e){} aplicarTema(t); render(); }
function botonTema(){ const o=temaActual()==="oscuro"; return `<button class="tema" onclick="cambiarTema()" title="${o?"Cambiar a modo claro":"Cambiar a modo oscuro"}" aria-label="${o?"Modo claro":"Modo oscuro"}">${o?"☀️":"🌙"}</button>`; }
aplicarTema(temaActual());

/* ===================== Capa de datos: MODO DEMO ===================== */
class DemoStore{
  constructor(key="crx_pos_demo_v1",sem=semilla){ this.key=key; this.sem=sem; this.ls={}; this.mem=null; this.cargar();
    window.addEventListener("storage",e=>{ if(e.key===this.key){ this.cargar(); this.emitirTodo(); } }); }
  get demo(){ return true; }
  cargar(){ let d=null; try{ d=JSON.parse(localStorage.getItem(this.key)); }catch(e){} this.db=d||this.mem||this.sem(); if(!d) this.guardar(); }
  guardar(){ this.mem=this.db; try{ localStorage.setItem(this.key,JSON.stringify(this.db)); }catch(e){} }
  lista(c,f=[]){ return Object.entries(this.db[c]||{}).map(([id,v])=>({id,...v})).filter(d=>f.every(([k,op,v])=>{
      const x=k.split(".").reduce((o,p)=>o?.[p],d); return op==="=="?x===v:op===">="?x>=v:op==="<="?x<=v:op==="<"?x<v:true; })); }
  emitir(c){ (this.ls[c]||[]).forEach(l=>l.cb(this.lista(c,l.f))); }
  emitirTodo(){ Object.keys(this.ls).forEach(c=>this.emitir(c)); }
  suscribir(c,cb,f=[]){ const l={cb,f}; (this.ls[c]=this.ls[c]||[]).push(l); cb(this.lista(c,f)); return ()=>{ this.ls[c]=this.ls[c].filter(x=>x!==l); }; }
  suscribirDoc(c,id,cb){ return this.suscribir(c,d=>cb(d.find(x=>x.id===id)||null)); }
  async consultar(c,f=[]){ return this.lista(c,f); }
  async agregar(c,d){ const id=rid(); (this.db[c]=this.db[c]||{})[id]=d; this.guardar(); this.emitir(c); return id; }
  async poner(c,id,d){ (this.db[c]=this.db[c]||{})[id]=d; this.guardar(); this.emitir(c); }
  async actualizar(c,id,p){ Object.assign(this.db[c][id],p); this.guardar(); this.emitir(c); }
  async borrar(c,id){ delete this.db[c][id]; this.guardar(); this.emitir(c); }
  async siguienteNumero(){ this.db._contador=(this.db._contador||0)+1; this.guardar(); return this.db._contador; }
  async necesitaConfigurar(){ return false; }
  async ingresar(u,p){ const x=this.lista("users").find(x=>x.usuario===u.toLowerCase().trim()&&x.pass===p);
    if(!x) throw new Error("Usuario o contraseña incorrectos"); if(x.activo===false) throw new Error("Usuario desactivado");
    try{ sessionStorage.setItem("crx_uid",x.id); }catch(e){} this._uid=x.id; return x; }
  async restaurar(){ let id=this._uid; try{ id=sessionStorage.getItem("crx_uid")||id; }catch(e){} const x=id&&this.db.users[id]; return x&&x.activo!==false?{id,...x}:null; }
  async salir(){ this._uid=null; try{ sessionStorage.removeItem("crx_uid"); }catch(e){} }
  async crearUsuario({usuario,pass,nombre,rol}){ usuario=usuario.toLowerCase().trim();
    if(this.lista("users").some(x=>x.usuario===usuario)) throw new Error("Ese usuario ya existe");
    return this.agregar("users",{usuario,pass,nombre,rol,activo:true}); }
  async cambiarClave(id,pass){ return this.actualizar("users",id,{pass}); }
  async eliminarUsuario(id){ return this.borrar("users",id); }
  async reiniciarDemo(){ this.db=this.sem(); this.guardar(); this.emitirTodo(); }
}

function cargarScript(src){ return new Promise((ok,err)=>{ const s=document.createElement("script"); s.src=src; s.onload=ok; s.onerror=()=>err(new Error("No se pudo cargar "+src)); document.head.appendChild(s); }); }

class FireStore{

  async iniciar(){
    const v="10.12.2", b=`https://www.gstatic.com/firebasejs/${v}/`;
    await cargarScript(b+"firebase-app-compat.js"); await cargarScript(b+"firebase-auth-compat.js"); await cargarScript(b+"firebase-firestore-compat.js");
    this.app=firebase.initializeApp(FIREBASE_CONFIG); this.auth=firebase.auth(); this.fs=firebase.firestore();
    try{ await Promise.race([this.fs.enablePersistence({synchronizeTabs:true}),new Promise(r=>setTimeout(r,3000))]); }catch(e){}
  }
  // Firebase exige mínimo 6 caracteres: las claves cortas (3 a 5) se completan internamente con un sufijo fijo.
  // Las claves de 6 o más se usan tal cual (así siguen funcionando los usuarios ya creados).
  clave(p){ p=String(p||""); return p.length<6 ? p+"·CR-pos" : p; }
  correo(u){ return u.toLowerCase().trim().replace(/[^a-z0-9._-]/g,"")+"@"+DOMINIO_USUARIOS; }
  // Modo «No guardar datos»: la operación del día va a colecciones de ensayo, separadas de los registros reales
  col(c){ return this.ensayo&&ENSAYO_COLS.includes(c)?"ensayo_"+c:c; }
  q(c,f){ let r=this.fs.collection(this.col(c)); f.forEach(([k,op,v])=>r=r.where(k,op,v)); return r; }
  suscribir(c,cb,f=[]){ return this.q(c,f).onSnapshot(s=>cb(s.docs.map(d=>({id:d.id,...d.data()}))),e=>console.error(c,e)); }
  suscribirDoc(c,id,cb){ return this.fs.collection(this.col(c)).doc(id).onSnapshot(d=>cb(d.exists?{id:d.id,...d.data()}:null),e=>console.error(c+"/"+id,e)); }
  async consultar(c,f=[]){ const s=await this.q(c,f).get(); return s.docs.map(d=>({id:d.id,...d.data()})); }
  async agregar(c,d){ const r=await this.fs.collection(this.col(c)).add(d); if(c==="vales") pushCambio(null,{id:r.id,...d}); return r.id; }
  async poner(c,id,d){ await this.fs.collection(this.col(c)).doc(id).set(d); }
  async actualizar(c,id,p){ const antes=c==="vales"?buscarVale(id):null; await this.fs.collection(this.col(c)).doc(id).update(p); if(antes) pushCambio({...antes},{...antes,...p}); }
  async borrar(c,id){ await this.fs.collection(this.col(c)).doc(id).delete(); }
  async siguienteNumero(){ const ref=this.ensayo?this.fs.collection("ensayo_config").doc("contador"):this.fs.collection("config").doc("contador");
    return this.fs.runTransaction(async t=>{ const s=await t.get(ref); const n=(s.exists?s.data().n:0)+1; t.set(ref,{n}); return n; }); }
  async necesitaConfigurar(){ const s=await this.fs.collection("config").doc("setup").get(); return !s.exists; }
  async configurarPrimerAdmin({usuario,pass,nombre}){
    const cred=await this.auth.createUserWithEmailAndPassword(this.correo(usuario),this.clave(pass)); const uid=cred.user.uid;
    const b=this.fs.batch();
    b.set(this.fs.collection("users").doc(uid),{usuario:usuario.toLowerCase().trim(),nombre,rol:"admin",activo:true});
    b.set(this.fs.collection("config").doc("setup"),{fecha:Date.now()});
    b.set(this.fs.collection("config").doc("negocio"),{nombre:"Casa Rosada Xuacha",nit:"",direccion:"",telefono:"",pie:"Gracias por su visita"});
    await b.commit(); return {id:uid,usuario,nombre,rol:"admin",activo:true};
  }
  async perfil(uid){ const s=await this.fs.collection("users").doc(uid).get(); return s.exists?{id:uid,...s.data()}:null; }
  /* Cada usuario tiene una "cuenta de acceso" en Firebase. Para que el administrador pueda cambiar claves y eliminar
     usuarios sin conocer la clave anterior, al cambiar la clave se crea una cuenta de acceso nueva y la anterior queda
     sin perfil (no puede hacer nada). La colección logins guarda qué cuenta usa cada nombre de usuario. */
  base(u){ return String(u).toLowerCase().trim().replace(/[^a-z0-9._-]/g,""); }
  async emailDe(u){ try{ const s=await this.fs.collection("logins").doc(this.base(u)).get(); if(s.exists&&s.data().email) return s.data().email; }catch(e){} return this.correo(u); }
  async nuevaCuenta(usuario,pass){
    const sec=firebase.apps.find(a=>a.name==="sec")||firebase.initializeApp(FIREBASE_CONFIG,"sec");
    let email=this.correo(usuario), cred;
    try{ cred=await sec.auth().createUserWithEmailAndPassword(email,this.clave(pass)); }
    catch(e){ if(!String(e.code).includes("email-already-in-use")) throw e;
      email=this.base(usuario)+"."+Date.now().toString(36)+"@"+DOMINIO_USUARIOS; cred=await sec.auth().createUserWithEmailAndPassword(email,this.clave(pass)); }
    await sec.auth().signOut(); return {uid:cred.user.uid,email};
  }
  async ingresar(u,p){
    let cred; try{ cred=await this.auth.signInWithEmailAndPassword(await this.emailDe(u),this.clave(p)); }
    catch(e){ throw new Error("Usuario o contraseña incorrectos"); }
    const x=await this.perfil(cred.user.uid); if(!x||x.activo===false){ await this.auth.signOut(); throw new Error("Usuario sin acceso o desactivado"); } return x;
  }
  restaurar(){ return new Promise(res=>{ const un=this.auth.onAuthStateChanged(async u=>{ un(); if(!u) return res(null); const x=await this.perfil(u.uid).catch(()=>null); res(x&&x.activo!==false?x:null); }); }); }
  async salir(){ await this.auth.signOut(); }
  async crearUsuario({usuario,pass,nombre,rol}){
    const b=this.base(usuario);
    if(S.usuarios.some(x=>x.usuario===b)) throw new Error("Ese usuario ya existe");
    const {uid,email}=await this.nuevaCuenta(usuario,pass);
    const w=this.fs.batch();
    w.set(this.fs.collection("users").doc(uid),{usuario:b,nombre,rol,activo:true});
    w.set(this.fs.collection("logins").doc(b),{email,uid});
    await w.commit(); return uid;
  }
  // El administrador cambia la clave de cualquier usuario sin conocer la anterior
  async cambiarClave(id,pass){
    if(S.yo?.rol!=="admin") throw new Error("Solo el administrador puede cambiar contraseñas");
    const x=S.usuarios.find(u=>u.id===id); if(!x) throw new Error("Usuario no encontrado");
    if(id===this.auth.currentUser?.uid){
      try{ await this.auth.currentUser.updatePassword(this.clave(pass)); return; }
      catch(e){ if(String(e.code).includes("recent-login")) throw new Error("Por seguridad, salga y vuelva a ingresar, y cambie su contraseña enseguida."); throw e; }
    }
    const {uid,email}=await this.nuevaCuenta(x.usuario,pass);
    const {id:_viejo,...datos}=x;
    const w=this.fs.batch();
    w.set(this.fs.collection("users").doc(uid),{...datos,claveCambiada:Date.now(),claveCambiadaPor:S.yo.nombre});
    w.set(this.fs.collection("logins").doc(this.base(x.usuario)),{email,uid});
    w.delete(this.fs.collection("users").doc(id));
    await w.commit();
  }
  async eliminarUsuario(id){
    const x=S.usuarios.find(u=>u.id===id); if(!x) return;
    const w=this.fs.batch();
    w.delete(this.fs.collection("users").doc(id));
    w.delete(this.fs.collection("logins").doc(this.base(x.usuario)));
    await w.commit();
  }
}

  return {vistas:v.length?v:["mesas"],cobrar:perm("cobrar"),anular:perm("anular"),quitarEnviado:perm("quitarEnviado"),modoMesero:usaModoMesero()}; };
// Tickets en curso para meseros: los "enviados a caja" ya no ocupan la mesa

const pendienteCocina = v => v.items.some(i=>i.cocina && i.ronda > rondaDesp(v));

/* ===================== Avisos (notificaciones) =====================
   Quedan en pantalla hasta que la persona toca ✅ (así queda claro que alguien lo leyó).
   · Mesero (o quien recibe): cuando cocina le despacha un pedido a su nombre.

   · Caja y administración: ticket nuevo para cobrar.
   Además suena, vibra y, si el celular lo permite, sale como notificación del sistema. */
const claveAvisos = () => "crx_avisos_"+(S.modoPruebas?"p_":"")+(S.yo?.id||"");
function cargarAvisos(){ try{ S.avisos=JSON.parse(localStorage.getItem(claveAvisos())||"[]"); }catch(e){ S.avisos=[]; } pintarAvisos(); }
function guardarAvisos(){ try{ localStorage.setItem(claveAvisos(),JSON.stringify(S.avisos.slice(0,40))); }catch(e){} }
const mismoNombre=(a,b)=>!!a&&!!b&&String(a).replace(/ \(pruebas\)$/,"").trim().toLowerCase()===String(b).replace(/ \(pruebas\)$/,"").trim().toLowerCase();
const lugarDe = v => servicioDe(v)==="mesa"?"Mesa "+v.mesaNombre:etiquetaVale(v).replace(/<[^>]+>/g,"").trim();
function avisar(a,u=S.yo){
  if(u&&S.yo&&u.id!==S.yo.id){ // otro perfil del modo de pruebas: queda guardado para cuando entre como ese usuario
    const key="crx_avisos_p_"+u.id; let xs=[]; try{ xs=JSON.parse(localStorage.getItem(key)||"[]"); }catch(e){}
    if(!xs.some(x=>x.k===a.k)){ xs.unshift({...a,ts:Date.now()}); try{ localStorage.setItem(key,JSON.stringify(xs.slice(0,40))); }catch(e){} } return; }
  S.avisos=S.avisos||[]; if(S.avisos.some(x=>x.k===a.k)) return;
  S.avisos.unshift({...a,ts:Date.now()}); guardarAvisos(); pintarAvisos();
  beep(); setTimeout(beep,320); try{ navigator.vibrate&&navigator.vibrate([300,120,300]); }catch(e){}
  try{ if("Notification" in window&&Notification.permission==="granted"&&navigator.serviceWorker)
    navigator.serviceWorker.ready.then(r=>r.showNotification("Casa Rosada · "+a.t.replace(/^\S+\s/,""),{body:a.d||"",icon:"icon-192.png",badge:"icon-192.png",tag:a.k,renotify:true,requireInteraction:true,vibrate:[300,120,300]})); }catch(e){}
}
function pintarAvisos(){ const c=$("#avisos"); if(!c) return; const xs=(S.yo&&S.avisos)||[];
  c.innerHTML=xs.length?`${xs.slice(0,4).map(a=>`<div class="aviso ${a.tipo}"><div class="av-txt"><b>${a.t}</b>${a.d?`<div>${a.d}</div>`:""}<span class="mu">${hora(a.ts)}</span></div>
    <button class="av-ok" title="Leído" onclick="accion.avisoLeido('${a.k}')">✅</button></div>`).join("")}
    ${xs.length>1?`<button class="av-todos" onclick="accion.avisosLeidos()">✅ Marcar ${xs.length} como leídos</button>`:""}`:""; }
function revisarAvisos(prev,d){
  if(!S.yo) return;
  // Los avisos de cobro desaparecen solos cuando el ticket ya se cobró, se anuló o volvió a estar en curso
  if(S.avisos?.length){ const pend=new Set(d.filter(v=>!enCurso(v)).map(v=>v.id)), n=S.avisos.length;
    S.avisos=S.avisos.filter(a=>!/^caja-/.test(a.k)||(a.vid&&pend.has(a.vid))); if(S.avisos.length!==n){ guardarAvisos(); pintarAvisos(); } }
  // En modo de pruebas todos los perfiles están en este mismo celular: se calcula el aviso de cada uno
  const perfiles=S.modoPruebas?S.db.lista("users").filter(u=>u.activo!==false):[S.yo];
  for(const u of perfiles) revisarAvisosDe(prev,d,u);
}
function revisarAvisosDe(prev,d,u,out){
  const avisar_=a=>out?out.push(a):avisar(a,u);
  const yo=u.nombre, rol=u.rol, esCocina=rol==="cocina"||(u.id===S.yo.id&&S.vista==="cocina");
  for(const v of d){ const p=prev.find(x=>x.id===v.id);
    // 1) Cocina despachó: avisa a quien recibe (si no es un usuario, a quien tomó el pedido)
    const nd=(v.despachos||[]).length, pd=(p?.despachos||[]).length;
    if(p&&nd>pd){ const des=v.despachos[nd-1]; const dest=S.usuarios.some(u=>mismoNombre(u.nombre,des.quien))?des.quien:nombreMesero(v);
      if(!des.directo&&mismoNombre(dest,yo)&&rol!=="cocina") avisar_({k:`desp-${v.id}-${nd}`,tipo:"listo",t:`🍽 ${lugarDe(v)}: listo para entregar`,d:`Cocina te lo entregó · ticket ${pad(v.numero)}`}); }
    // 2) Cocina: pedido nuevo, editado o con productos agregados (no se avisa a quien lo hizo)
    if(esCocina&&pendienteCocina(v)){
      const pend=v.items.filter(i=>i.cocina&&i.ronda>rondaDesp(v)), autor=(pend.slice(-1)[0]?.por)||nombreMesero(v);
      if(!mismoNombre(autor,yo)){
        if(!p) avisar_({k:`coc-${v.id}-${v.enviado||v.creado}`,tipo:"nuevo",t:`🆕 Nuevo pedido · ${lugarDe(v)}`,d:`${pend.reduce((t,i)=>t+i.cant,0)} plato(s) · tomó ${esc(nombreMesero(v))}`});
        else if(v.enviado&&v.enviado!==p.enviado){ const ed=pend.some(i=>i.editado);
          avisar_({k:`coc-${v.id}-${v.enviado}`,tipo:ed?"cambio":"nuevo",t:ed?`✏️ Pedido editado · ${lugarDe(v)}`:`➕ Agregaron al pedido · ${lugarDe(v)}`,d:`Por ${esc(autor)} · ticket ${pad(v.numero)}`}); } } }
    // 3) Caja y administración: ticket nuevo para cobrar
    // Solo cuando el ticket realmente pasa a cobro (enviado a caja por el mesero/domiciliario o entregado por cocina)
    if(perm("cobrar",rol)&&!enCurso(v)&&(v.enCaja||v.pidioCuenta)&&(!p||enCurso(p))&&!mismoNombre(v.enCajaPor,yo))
      avisar_({k:`caja-${v.id}-${v.enCajaEn||v.actualizado||""}`,vid:v.id,tipo:"cobro",t:`💵 Ticket para cobrar · ${lugarDe(v)}`,d:`Ticket ${pad(v.numero)} · ${money(v.total)}${v.pagoReportado?` · reportó ${esc(v.pagoReportado.medio)}`:""}`});
  }
}

// Desglose completo del plato: proteína, sopa, acompañamientos (SIN en rojo, cambios y adicionales en azul) y precio
// Bebidas especiales, postres y demás productos de cocina: en el mismo formato de dos columnas, sin precio (el total va abajo)
function extrasCocina(xs){ if(!xs.length) return "";
  const chip=i=>i.editado?' <span class="k-chip cambio">✏️ CAMBIO</span>':(i.ronda||1)>1?' <span class="k-chip adic">➕ NUEVO</span>':"";
  const lin=i=>`<div><b>${i.cant} × ${esc(i.nombre)}</b>${chip(i)}${i.nota?`<div class="k-cambio" style="font-weight:800">📝 ${esc(i.nota)}</div>`:""}</div>`;
  const grupos=[["🍹","Bebidas esp.",xs.filter(i=>String(i.pid).startsWith("beb-"))],["🍰","Postres",xs.filter(i=>String(i.pid).startsWith("pos-"))],["🍽","Otros",xs.filter(i=>!/^(beb|pos)-/.test(String(i.pid)))]].filter(g=>g[2].length);
  return `<div class="it-k"><div class="k-grid">${grupos.map(([ic,t,g])=>`<div class="kg-l">${ic} ${t}</div><div class="kg-v">${g.map(lin).join("")}</div>`).join("")}</div></div>`; }
function platoCocina(i,v,adicional,n){
  const rojo=t=>`<b class="k-sin">${t}</b>`, azul=t=>`<b class="k-cambio">${t}</b>`;
  const precio=`<div class="k-precio"><span>${i.cant>1?`${i.cant} × ${money(i.precio)}`:"Precio"}${i.modo?` · ${esc(NOMBRE_MODO[i.modo]||i.modo)}`:""}</span><b>${money(i.precio*i.cant)}</b></div>`;
  const nota=i.nota?`<div class="k-linea">${azul("📝 "+esc(i.nota))}</div>`:"";
  const ad=i.editado?` <span class="k-chip cambio">✏️ CAMBIO</span>`:(i.ronda||1)>1?` <span class="k-chip adic">➕ NUEVO</span>`:"";
  if(!String(i.pid).startsWith("alm-")) return `<div class="it-k"><b>${i.cant} ×</b> ${esc(i.nombre)}${ad}${i.detalle?`<div class="det">${esc(i.detalle)}</div>`:""}${nota}${precio}</div>`;
  const m=S.menus.find(x=>x.id===i.menu), partes=String(i.detalle||"").split(" · ");
  const prot=i.proteina||String(i.nombre).replace(/^Almuerzo – /,"").replace(/ \(para llevar\)$/,"");
  let sopa=i.sopa; if(sopa==null&&m&&opcionesSopa(m).length) sopa=/^SIN (sopa|entrada)/.test(partes[0])?"SIN":partes[0];
  let acomp=i.acomp; if(!acomp&&m) acomp=m.acompanamientos.map(ac=>({n:ac,e:i.detalle.includes("SIN "+ac.toLowerCase())?"sin":i.detalle.includes(ac+" → HUEVO")?"huevo":"ok"}));
  // Dos columnas: a la izquierda qué es, a la derecha lo que lleva (un acompañamiento por línea)
  const lAc=(acomp||[]).map(a=>`<div>${a.e==="sin"?rojo("SIN "+esc(a.n.toLowerCase())):a.e==="huevo"?azul(esc(a.n)+" → HUEVO"):esc(a.n)}</div>`).join("");
  const ps=(i.proteinas&&i.proteinas.length?i.proteinas:String(prot).split(" + "));
  const beb=i.bebida?(i.bebida==="SIN"?rojo("SIN bebida"):`<b>${esc(i.bebida)}</b>`):(m?.bebidaIncluida&&i.bebida!==""?`<b>${esc(m.bebidaIncluida)}</b>`:"");
  const fila=(ic,t,val)=>`<div class="kg-l">${ic} ${t}</div><div class="kg-v">${val}</div>`;
  return `<div class="it-k"><div class="k-tit"><b>${i.cant} × Almuerzo${n?` ${n}`:""}</b>${ad}${i.llevar&&!esLlevarMesa(v.mesaId)?' <span class="dot" style="background:var(--azul)"><i class=ic-caja></i> PARA LLEVAR</span>':""}</div>
    <div class="k-grid">
      ${sopa?fila("🥣","Entrada",sopa==="SIN"?rojo("SIN entrada"):`<b>${esc(sopa)}</b>`):""}
      ${fila("🍗",ps.length>1?"Proteínas":"Proteína",ps.map(x=>`<div><b>${esc(x)}</b></div>`).join(""))}
      ${acomp?fila("🍚","Acomp.",lAc||"—"):fila("📋","Detalle",esc(i.detalle||""))}
      ${beb?fila("🥤","Bebida",beb):""}
      ${i.nota?fila("📝","Nota",azul(esc(i.nota))):""}
    </div>${precio}</div>`;
}

  <div class="ped"><div>

        <button class="${tab==="cobrar"?"on":""}" onclick="S.caja.tab='cobrar';render()">💵 Tickets por cobrar <span class="mt-n ${porCobrar.length?"hay":""}">${porCobrar.length}</span></button>
        <button class="${tab==="proceso"?"on":""}" onclick="S.caja.tab='proceso';render()">⏳ Tickets en proceso <span class="mt-n">${enProceso.length}</span></button></div>
      ${tab==="cobrar"?`<p class="mu" style="margin:6px 0">Enviados a caja por quien atendió o entregó, o entregados directamente por cocina.</p>
      <table><tr><th>Ticket</th><th>Servicio</th><th>Atendió</th><th class="r">Total</th><th></th></tr>
      ${porCobrar.map(x=>`<tr style="background:var(--rosa3)"><td><b>${pad(x.numero)}</b></td><td>${etiquetaVale(x)}<br>${x.pagoReportado?`<span class="dot" style="background:var(--azul)">${esc(x.pagoReportado.medio)}</span> `:""}<span class="mu">enviado ${x.enCajaEn?hora(x.enCajaEn):""}${x.enCajaPor?" · "+esc(x.enCajaPor):""}</span></td><td>${esc(nombreMesero(x))}${quienesAtendieron(x).length?`<br><span class="mu">Atendió: ${quienesAtendieron(x).map(esc).join(", ")}</span>`:""}</td><td class="r">${money(x.total)}</td><td><button class="sm ok" onclick="accion.selVale('${x.id}')">Cobrar</button></td></tr>`).join("")||`<tr><td colspan="5" class="mu">No hay tickets por cobrar</td></tr>`}</table>`
      :`<p class="mu" style="margin:6px 0">En cocina, servidos sin enviar a caja o domicilios en camino. Toque uno para ver la trazabilidad y, si hace falta, editarlo.</p>
      <table><tr><th>Ticket</th><th>Servicio</th><th>Estado</th><th class="r">Total</th><th></th></tr>
      ${enProceso.map(x=>`<tr><td><b>${pad(x.numero)}</b></td><td>${etiquetaVale(x)}<br><span class="mu">tomó ${esc(nombreMesero(x))}</span></td><td><span class="dot" style="font-size:12px;color:#fff;background:${pendienteCocina(x)?"#ef6c00":!esServido(x)?(x.mesaId==="domicilio"&&x.salidaEn?"#1e63c6":"#e0a800"):"#7b7b7b"}">${estadoTexto(x)}</span><br><span class="mu">${hora(x.creado)}</span></td><td class="r">${money(x.total)}</td><td><button class="sm" onclick="resumenTicket('${x.id}')">📋 Ver</button></td></tr>`).join("")||`<tr><td colspan="5" class="mu">No hay tickets en proceso</td></tr>`}</table>`}</div>
    <div class="card" style="margin-top:12px"><h3 style="margin-top:0">Tickets de hoy cerrados</h3>
      <table><tr><th>Ticket</th><th>Estado</th><th>Servicio · atendió</th><th>Medio</th><th class="r">Total</th><th></th></tr>
      ${pag.map(x=>`<tr><td>${pad(x.numero)}</td><td>${x.estado==="pagado"?"✅ Pagado":"❌ Anulado"}</td><td>${etiquetaVale(x)}<br><span class="mu">${quienesAtendieron(x).map(esc).join(", ")||"—"}${x.servidoEn?" · espera "+durTxt(x.servidoEn-x.creado):""}</span></td><td>${esc(x.pago?.medio||"—")}</td><td class="r">${money(x.total)}</td><td><button class="sm" onclick="accion.selVale('${x.id}')">Ver</button></td></tr>`).join("")||`<tr><td colspan="6" class="mu">Aún no hay</td></tr>`}</table></div>
  </div>
  <div class="card" id="caja-det">${v?detalleCaja(v):`<p class="mu">Toque «Ver» en un ticket para cobrarlo o revisar si ya fue pagado.</p>`}</div></div>`;
}
function detalleCaja(v){
  const c=S.caja, rec=Number(String(c.recibido).replace(/\D/g,""))||0, cambio=rec-v.total;
  const sello=v.estado==="pagado"?`<span class="sello">PAGADO</span>`:v.estado==="anulado"?`<span class="sello an">ANULADO</span>`:`<span class="sello ab">POR COBRAR</span>`;
  return `<div class="row"><h3 style="margin:0">Ticket ${pad(v.numero)}</h3><span class="sp"></span>${sello}</div>
  <div class="mu">${etiquetaVale(v)} · ${esc(nombreMesero(v))} · ${fecha(v.creado)}</div>${v.cliente?`<div class="mu">📞 ${esc(v.cliente.tel)} · 📍 ${esc(v.cliente.dir)}${v.cliente.ref?" · "+esc(v.cliente.ref):""}</div>`:""}
  <div class="row" style="align-items:flex-start;margin-top:8px"><div class="sp">
  ${v.items.map(i=>`<div class="it"><span class="sp">${i.cant} × ${esc(i.nombre)}${detalleItem(i)}</span><span>${money(i.precio*i.cant)}</span></div>`).join("")}</div><div id="qr-caja"></div></div>
  <div class="tot"><span>Total</span><span>${money(v.total)}</span></div>
  ${v.pagoReportado?`<div class="banner" style="margin:6px 0">${servicioDe(v)==="domicilio"?"🛵 El domiciliario":"🙋 Quien entregó"} (${esc(v.pagoReportado.por)}) reporta pago en <b>${esc(v.pagoReportado.medio)}</b>${v.pagoReportado.recibido?` · recibió ${money(v.pagoReportado.recibido)}`:""}${v.pagoReportado.medio==="QR"?" · elija la cuenta donde llegó":v.pagoReportado.medio==="Crédito"?" · crédito pendiente":""}${v.soporte?` <button class="sm" onclick="accion.verSoporte('${v.id}')">📎 Ver soporte</button>`:""}</div>`:""}
  ${historialAtencion(v)}
  ${v.estado==="abierto"&&P().cobrar&&(v.pagoReportado?.medio==="Crédito"||c.medio==="Crédito")?`
    ${creditoDe(v)?`<div class="banner" style="margin:8px 0;border-color:#2e7d32">💳 Se carga a la cuenta de crédito de <b>${esc(creditoDe(v).nombre)}</b>${creditoDe(v).cupo?` · cupo ${money(creditoDe(v).cupo)}`:""} <button class="sm" onclick="accion.cajaCredito('${v.id}')">Cambiar</button></div>
    <button class="ok" style="width:100%;margin-top:6px;font-size:17px" onclick="accion.cobrarCredito('${v.id}')">💳 Confirmar abono a crédito ${money(v.total)}</button>`
    :`<button style="width:100%;margin-top:8px;padding:14px;border:2px solid #2e7d32" onclick="accion.cajaCredito('${v.id}')">💳 Elegir cliente con crédito</button>`}
    ${v.pagoReportado?.medio!=="Crédito"?`<button class="sm" style="margin-top:8px" onclick="S.caja.medio='Efectivo';render()">← Otro medio de pago</button>`:""}
    ${P().anular?`<div class="row" style="margin-top:10px"><span class="sp"></span><button class="dan sm" onclick="accion.anular('${v.id}')">Anular ticket</button></div>`:""}`
  :v.estado==="abierto"?(P().cobrar?`
    <label>Medio de pago</label><div class="row">${MEDIOS.concat(["Crédito"]).map(m=>`<button class="${c.medio===m?"pri":""}" style="flex:1;padding:12px" onclick="S.caja.medio='${m}';render()">${m==="Efectivo"?"💵 Efectivo":m==="Crédito"?"💳 Crédito":"📱 Davivienda QR"}</button>`).join("")}</div>
    ${c.medio==="Efectivo"?`<label>Recibido</label><input id="caja-rec" inputmode="numeric" value="${esc(c.recibido)}" oninput="S.caja.recibido=this.value;document.getElementById('cambio').textContent=accion.txtCambio(${v.total})">
      <div class="row" style="margin-top:6px">${[v.total,20000,50000,100000].filter((x,i,a)=>x>=v.total&&a.indexOf(x)===i).map(x=>`<button class="sm" onclick="S.caja.recibido='${x}';render()">${money(x)}</button>`).join("")}</div>
      <p>Cambio: <b id="cambio">${accion.txtCambio(v.total)}</b></p>`:`<label class="btn-foto" style="text-align:center">📷 ${c.foto?"Tomar otra foto":"Tomar foto al soporte"} <span style="font-weight:400;opacity:.85">(opcional)</span><input type="file" accept="image/*" capture="environment" hidden onchange="accion.fotoCaja(this)"></label>
      ${c.foto?`<div style="text-align:center"><img src="${c.foto}" style="max-width:160px;max-height:200px;object-fit:contain;border-radius:8px;border:2px solid #2e9e5b"><div class="mu">✅ Soporte listo: se guarda al confirmar el pago · <a href="#" onclick="S.caja.foto=null;render();return false">quitar</a></div></div>`:""}`}
    <button class="ok" style="width:100%;margin-top:10px;font-size:17px" ${c.medio==="Efectivo"&&rec&&cambio<0?"disabled":""} onclick="accion.cobrar('${v.id}')">Confirmar pago ${money(v.total)}</button>
    ${P().anular?`<div class="row" style="margin-top:10px"><span class="sp"></span><button class="dan sm" onclick="accion.anular('${v.id}')">Anular ticket</button></div>`:""}`
    :`<p class="mu">Su rol no permite cobrar.</p>`)
  :v.estado==="pagado"?`<p>${v.pago.medio==="Crédito"?"Cargado a crédito":"Pagado"} el <b>${fecha(v.pago.fecha)}</b> con <b>${esc(v.pago.medio)}${v.pago.credito?" · "+esc(v.pago.credito.nombre):""}</b>${v.pago.recibido?` · recibido ${money(v.pago.recibido)} · cambio ${money(v.pago.cambio)}`:""}${v.pago.ref?` · ref. ${esc(v.pago.ref)}`:""}<br>Cobró: ${esc(v.pago.cajero)}</p>`
  :`<p>Anulado por <b>${esc(v.anulacion?.por)}</b> el ${fecha(v.anulacion?.fecha)}.<br>Motivo: ${esc(v.anulacion?.motivo)}</p>`}`;
}

/* ---------- REPORTES ---------- */
function vistaReportes(){
  const r=S.rep, hoy=hoyISO();
  if(!r.desde){ r.desde=hoy; r.hasta=hoy; }
  if(!perm("reportesAnt")){ r.desde=hoy; r.hasta=hoy; }
  if(!r.datos&&!r.cargando) accion.cargarReporte();
  const d=r.datos;
  return `<div class="row"><h2 style="margin:0">Reportes ${!perm("reportesAnt")?"— cierre del día":""}</h2><span class="sp"></span>
    ${perm("reportesAnt")?`<input type="date" id="r-d" style="width:auto" value="${r.desde}"> a <input type="date" id="r-h" style="width:auto" value="${r.hasta}"><button class="pri" onclick="S.rep.desde=$('#r-d').value;S.rep.hasta=$('#r-h').value;accion.cargarReporte()">Ver</button>`:""}
    <button onclick="accion.cargarReporte()">↻</button></div>
  ${!d?`<p class="mu">Cargando…</p>`:`
  <div class="grid kpis" style="margin:12px 0">
    <div class="card kpi"><div class="mu">Ventas cobradas</div><div class="v">${money(d.total)}</div></div>
    <div class="card kpi"><div class="mu">Tickets pagados</div><div class="v">${d.pagados.length}</div></div>
    <div class="card kpi"><div class="mu">Ticket promedio</div><div class="v">${money(d.pagados.length?d.total/d.pagados.length:0)}</div></div>
    <div class="card kpi"><div class="mu">Abiertos sin cobrar</div><div class="v" style="color:var(--cuenta)">${S.valesAbiertos.length} · ${money(totalItems(S.valesAbiertos.map(v=>({precio:v.total,cant:1}))))}</div></div>
    <div class="card kpi"><div class="mu">Espera promedio hasta servir</div><div class="v">${d.espera?durTxt(d.espera):"—"}</div></div>
    <div class="card kpi"><div class="mu">Anulados</div><div class="v" style="color:var(--rojo)">${d.anulados.length}</div></div></div>
  <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(300px,1fr))">
    <div class="card" style="grid-column:1/-1"><h3 style="margin-top:0">Ventas por tipo de servicio</h3>
      <table><tr><th>Servicio</th><th class="r">Tickets</th><th class="r">Ventas</th><th class="r">Ticket promedio</th><th class="r">% de las ventas</th></tr>
      ${Object.keys(SERVICIOS).map(k=>{ const x=d.porServicio[k]||{c:0,v:0}; return `<tr><td><b>${SERVICIOS[k]}</b></td><td class="r">${x.c}</td><td class="r">${money(x.v)}</td><td class="r">${money(x.c?x.v/x.c:0)}</td><td class="r">${d.total?Math.round(x.v*100/d.total):0}%</td></tr>`; }).join("")}
      <tr style="background:var(--rosa3)"><td><b>Total</b></td><td class="r"><b>${d.pagados.length}</b></td><td class="r"><b>${money(d.total)}</b></td><td class="r"><b>${money(d.pagados.length?d.total/d.pagados.length:0)}</b></td><td class="r"><b>100%</b></td></tr></table>
      ${d.envios?`<p class="mu" style="margin-bottom:0">De las ventas de domicilios, ${money(d.envios)} corresponden a cobros de servicio a domicilio (envío).</p>`:""}</div>
    <div class="card"><h3 style="margin-top:0">Por medio de pago</h3>${tabla(d.porMedio,"Medio")}</div>
    <div class="card"><h3 style="margin-top:0">Por quién tomó el pedido</h3>${tabla(d.porMesero,"Tomó")}</div>
    <div class="card"><h3 style="margin-top:0">Por quién atendió (recibió de cocina)</h3>${tabla(d.porAtencion,"Atendió")}</div>
    <div class="card"><h3 style="margin-top:0">Por quién cobró</h3>${tabla(d.porCobro||{},"Cobró")}</div>
    <div class="card"><h3 style="margin-top:0">Productos más vendidos</h3><table><tr><th>Producto</th><th class="r">Cant.</th><th class="r">Valor</th></tr>
      ${d.prods.slice(0,15).map(p=>`<tr><td>${esc(p.n)}</td><td class="r">${p.c}</td><td class="r">${money(p.v)}</td></tr>`).join("")}</table></div>
    <div class="card"><h3 style="margin-top:0">Tickets anulados</h3><table><tr><th>Ticket</th><th>Por</th><th>Motivo</th><th class="r">Valor</th></tr>
      ${d.anulados.map(v=>`<tr><td>${pad(v.numero)}</td><td>${esc(v.anulacion?.por)}</td><td>${esc(v.anulacion?.motivo)}</td><td class="r">${money(v.total)}</td></tr>`).join("")||`<tr><td colspan="4" class="mu">Ninguno</td></tr>`}</table></div>
    ${S.yo.rol==="admin"?`<div class="card" style="grid-column:1/-1"><h3 style="margin-top:0">🔎 Trazabilidad de servicios</h3>
      <div class="mu" style="margin-bottom:6px">Cada ticket del periodo: quién lo pidió, quién lo recibió de cocina, quién lo entregó, quién lo envió a caja y quién cobró. Toque «Ver» para el detalle paso a paso.</div>
      <div style="overflow-x:auto"><table style="min-width:900px"><tr><th>Ticket</th><th>Servicio</th><th>Tomó</th><th>Recibió de cocina</th><th>Entregó / sirvió</th><th>Envió a caja</th><th>Cobró</th><th class="r">Total</th><th></th></tr>
      ${[...d.pagados,...d.anulados].sort((a,b)=>a.numero-b.numero).map(v=>`<tr style="${v.estado==="anulado"?"opacity:.6":""}"><td><b>${pad(v.numero)}</b><br><span class="mu">${hora(v.creado)}</span></td><td>${etiquetaVale(v)}</td><td>${esc(nombreMesero(v))}</td>
        <td>${quienesAtendieron(v).map(esc).join(", ")||"—"}</td><td>${esc(v.pagoReportado?.por||v.servidoPor||"—")}</td><td>${esc(v.enCajaPor||"—")}</td>
        <td>${v.estado==="anulado"?`❌ Anuló ${esc(v.anulacion?.por||"")}`:`${esc(v.pago?.cajero||"—")}${v.pago?.cajeroRol?` <span class="mu">(${v.pago.cajeroRol==="admin"?"Admin":"Caja"})</span>`:""}<br><span class="mu">${esc(v.pago?.medio||"")}</span>`}</td>
        <td class="r">${money(v.total)}</td><td><button class="sm" onclick="accion.verTraza('${v.id}')">Ver</button></td></tr>`).join("")||`<tr><td colspan="9" class="mu">Sin tickets en el periodo</td></tr>`}</table></div></div>`:""}
  </div>`}`;
}
function tabla(obj,t){ const e=Object.entries(obj).sort((a,b)=>b[1].v-a[1].v);
  return `<table><tr><th>${t}</th><th class="r">Tickets</th><th class="r">Total</th></tr>${e.map(([k,x])=>`<tr><td>${esc(k)}</td><td class="r">${x.c}</td><td class="r">${money(x.v)}</td></tr>`).join("")||`<tr><td colspan="3" class="mu">Sin datos</td></tr>`}</table>`; }

  <div class="card" style="margin-top:12px"><div class="row"><h3 style="margin:0">Permisos por rol</h3><span class="sp"></span><button class="sm" onclick="accion.permReset()">Restablecer</button></div>

  async cargarReporte(){

    const d0=new Date(r.desde+"T00:00:00").getTime(), d1=new Date(r.hasta+"T00:00:00").getTime()+86400000;
    try{

/* ===================== MÓDULO: INGRESOS Y EGRESOS ===================== */
const hoyISO = () => { const d=new Date(); d.setMinutes(d.getMinutes()-d.getTimezoneOffset()); return d.toISOString().slice(0,10); };
const fechaCorta = iso => { const [y,m,d]=String(iso).split("-"); return `${d}/${m}/${y}`; };
const BANCOS = CUENTAS.filter(c=>c!=="Efectivo");
const CONCEPTOS = {
  ingreso:["Saldo inicial","Ventas del día","Venta de tiquetera","Abono de crédito de cliente","Evento","Arriendo espacio de la entrada","Venta de velitas","Aporte de socios","Otro ingreso"],
  egreso:["Compra de plaza (verduras y frutas)","Carnes y pollo","Abarrotes","Gas","Bebidas","Desechables","Aseo","Pago de turnos / nómina","Arriendo","Servicios públicos","Mantenimiento","Publicidad","Transporte","Otro gasto"]
};
const ORIGENES = ["Saldo inicial de la cuenta","Ventas del restaurante","Cliente","Socio / propietario","Arrendatario","Entidad / empresa","Otro"];
S.mov = { desde:null, hasta:null, datos:[], sub:null, tipo:"todos", medio:"todos", ejec:"todos", form:{tipo:"egreso", fecha:null, medio:"Efectivo", ejec:"ejecutado"}, edit:null };

// Un registro sin estado de ejecución (anteriores a este cambio) cuenta como ejecutado
const esProv = x => x.ejec==="por_ejecutar";
const vigente = x => x.estado!=="anulado";
function movSuscribir(){
  const m=S.mov; if(!m.desde){ m.desde=hoyISO(); m.hasta=hoyISO(); }
  if(m.sub) m.sub();
  // Se cargan todos los registros: el saldo de las cuentas es acumulado desde el inicio
  m.sub=S.db.suscribir("movimientos",d=>{ m.datos=d.sort((a,b)=>b.fecha.localeCompare(a.fecha)||b.creado-a.creado); if(S.vista==="movimientos") render(); });
}
function puedeEditarMov(x){ if(S.yo.rol==="admin") return true;
  return x.registradoUid===S.yo.id && (esProv(x) || new Date(x.creado).toDateString()===new Date().toDateString()); }

/* Saldos por cuenta: real (solo ejecutado) y proyectado (real + provisiones pendientes) */
function saldos(lista){
  const r={}; CUENTAS.forEach(c=>r[c]={real:0,porRecibir:0,porPagar:0});
  lista.filter(vigente).forEach(x=>{ const c=r[x.medio]; if(!c) return; const s=x.tipo==="ingreso"?1:-1;
    if(esProv(x)){ if(s>0) c.porRecibir+=x.valor; else c.porPagar+=x.valor; } else c.real+=s*x.valor; });
  CUENTAS.forEach(c=>r[c].proy=r[c].real+r[c].porRecibir-r[c].porPagar);
  const suma=(cs,k)=>cs.reduce((a,c)=>a+r[c][k],0);
  const grupo=cs=>({real:suma(cs,"real"),porRecibir:suma(cs,"porRecibir"),porPagar:suma(cs,"porPagar"),proy:suma(cs,"proy")});
  return {cta:r, bancos:grupo(BANCOS), total:grupo(CUENTAS)};
}
const neg = v => v<0?"color:var(--rojo)":"";

function vistaMovimientos(){
  const m=S.mov, f=m.form; if(!f.fecha) f.fecha=hoyISO(); if(!f.ejec) f.ejec="ejecutado";
  const hoy=hoyISO();
  const sal=saldos(m.datos);
  const enRango=m.datos.filter(x=>x.fecha>=m.desde&&x.fecha<=m.hasta);
  const lista=enRango.filter(x=>(m.tipo==="todos"||x.tipo===m.tipo)&&(m.medio==="todos"||x.medio===m.medio)&&(m.ejec==="todos"||(m.ejec==="prov")===esProv(x)));
  // El "Saldo inicial" cuenta en el saldo de las cuentas, pero no es un ingreso del período
  const vig=enRango.filter(x=>vigente(x)&&x.concepto!=="Saldo inicial"), sum=(arr,t)=>arr.filter(x=>x.tipo===t).reduce((a,x)=>a+x.valor,0);
  const ingR=sum(vig.filter(x=>!esProv(x)),"ingreso"), egrR=sum(vig.filter(x=>!esProv(x)),"egreso");
  const ingP=sum(vig.filter(esProv),"ingreso"), egrP=sum(vig.filter(esProv),"egreso");
  const pendientes=m.datos.filter(x=>vigente(x)&&esProv(x)), vencidas=pendientes.filter(x=>x.fecha<hoy);
  const nombres=[...new Set(S.usuarios.map(u=>u.nombre).concat(m.datos.map(x=>x.responsable).filter(Boolean)))];
  const conceptosUsados=[...new Set(CONCEPTOS[f.tipo].concat(m.datos.filter(x=>x.tipo===f.tipo).map(x=>x.concepto)))];

    <td class="r" style="font-weight:700;${neg(x.proy)}">${money(x.proy)}</td></tr>`;
  return `<div class="row"><h2 style="margin:0">Ingresos y egresos</h2></div>

  <div class="grid kpis" style="margin:12px 0">

    <div class="card kpi" style="border-left:6px solid var(--azul)"><div class="mu">Saldo proyectado <b>(con provisiones)</b></div><div class="v" style="${neg(sal.total.proy)}">${money(sal.total.proy)}</div><div class="mu">Real + por recibir − por pagar</div></div>
  </div>
  ${vencidas.length?`<div class="banner" style="border-color:var(--cuenta)">⚠️ Hay <b>${vencidas.length}</b> provisión(es) con fecha vencida sin ejecutar por ${money(vencidas.reduce((a,x)=>a+x.valor,0))}. Revíselas en la lista con el filtro "Por ejecutar".</div>`:""}

    <div style="overflow-x:auto"><table style="min-width:560px"><tr><th>Cuenta</th><th class="r">Saldo real<br><span class="mu">sin provisiones</span></th><th class="r">Por recibir<br><span class="mu">ingresos provisionados</span></th><th class="r">Por pagar<br><span class="mu">gastos provisionados</span></th><th class="r">Saldo proyectado<br><span class="mu">con provisiones</span></th></tr>
    ${filaSaldo("Efectivo",sal.cta.Efectivo)}
    ${BANCOS.map(b=>filaSaldo(b,sal.cta[b])).join("")}
    ${filaSaldo("Total bancos",sal.bancos,true)}
    ${filaSaldo("TOTAL (efectivo + bancos)",sal.total,true)}</table></div>
    <p class="mu" style="margin-bottom:0">El saldo es acumulado con todos los registros desde el inicio. Para arrancar, registre un ingreso "Saldo inicial" en cada cuenta con lo que hay hoy.</p></div>

  <div class="card" style="margin-bottom:12px"><div class="row"><h3 style="margin:0">Movimiento del período</h3><span class="sp"></span>
    <label style="margin:0">Desde</label><input type="date" id="mv-d" style="width:auto" value="${m.desde}">
    <label style="margin:0">Hasta</label><input type="date" id="mv-h" style="width:auto" value="${m.hasta}">
    <button class="pri" onclick="accion.movRango()">Ver</button><button onclick="accion.movHoy()">Hoy</button><button onclick="accion.movMes()">Este mes</button></div>
    <table style="margin-top:8px"><tr><th></th><th class="r">Ingresos</th><th class="r">Egresos</th><th class="r">Saldo</th></tr>
    <tr><td><b>Real</b> (ejecutado)</td><td class="r" style="color:var(--listo)">${money(ingR)}</td><td class="r" style="color:var(--rojo)">${money(egrR)}</td><td class="r b" style="${neg(ingR-egrR)}">${money(ingR-egrR)}</td></tr>
    <tr><td><b>Provisionado</b> (por ejecutar)</td><td class="r" style="color:var(--listo)">${money(ingP)}</td><td class="r" style="color:var(--rojo)">${money(egrP)}</td><td class="r b" style="${neg(ingP-egrP)}">${money(ingP-egrP)}</td></tr>

        <select style="width:auto" onchange="S.mov.medio=this.value;render()"><option value="todos">Todas las cuentas</option>${CUENTAS.map(c=>`<option ${m.medio===c?"selected":""}>${c}</option>`).join("")}</select>

      <div style="overflow-x:auto"><table style="margin-top:8px;min-width:700px"><tr><th>Fecha</th><th>Tipo</th><th>Concepto</th><th>De dónde / Responsable</th><th>Cuenta</th><th class="r">Valor</th><th></th></tr>
      ${lista.map(x=>{ const prov=esProv(x), venc=prov&&vigente(x)&&x.fecha<hoy;
        return `<tr style="${!vigente(x)?"opacity:.5":prov?"background:var(--amar)":""}">

  movMes(){ const h=hoyISO(); S.mov.desde=h.slice(0,8)+"01"; const d=new Date(+h.slice(0,4),+h.slice(5,7),0); S.mov.hasta=h.slice(0,8)+String(d.getDate()).padStart(2,"0"); render(); },

    const d={tipo:f.tipo,fecha:f.fecha,valor,concepto:f.concepto.trim(),medio:f.medio,soporte:(f.soporte||"").trim(),obs:(f.obs||"").trim(),ejec:f.ejec,

  },
  async movAnular(id){ const x=S.mov.datos.find(y=>y.id===id);
    const mot=await pedirTexto(`Anular ${x.tipo} "${x.concepto}" por ${money(x.valor)}. Motivo:`); if(!mot) return;
    await S.db.actualizar("movimientos",id,{estado:"anulado",anulacion:{motivo:mot,por:S.yo.nombre,fecha:Date.now()}}); toast("Registro anulado"); },
  async movTraerVentas(){
    // Cada cobro ya crea su ingreso. Esto solo completa los tickets pagados ese día que no lo tengan (por ejemplo, si falló internet).
    const fe=S.mov.form.fecha; const d0=new Date(fe+"T00:00:00").getTime(), d1=d0+86400000;
    const vales=(await S.db.consultar("vales",[["pagoFecha",">=",d0],["pagoFecha","<",d1]])).filter(v=>v.estado==="pagado");
    if(!vales.length) return toast("No hay tickets pagados el "+fechaCorta(fe));
    const movs=S.mov.datos.filter(m=>vigente(m));
    const legado=new Set(movs.filter(m=>m.fecha===fe&&String(m.clave||"").startsWith("ventas-")).map(m=>m.medio)); // registros agrupados de versiones anteriores
    let n=0;
    for(const v of vales){
      if(movs.some(m=>m.clave===`vale-${v.id}`)||v.pago?.medio==="Crédito") continue; // el crédito no es ingreso: entra cuando el cliente abona
      const cta=CUENTAS.includes(v.pago.medio)?v.pago.medio:"Efectivo"; if(legado.has(cta)) continue;
      await S.db.agregar("movimientos",ingresoDeVale(v)); n++;
    }
    if(fe<S.mov.desde) S.mov.desde=fe; if(fe>S.mov.hasta) S.mov.hasta=fe;
    toast(n?`${n} venta(s) del ${fechaCorta(fe)} registradas como ingreso`:"Todas las ventas de ese día ya estaban registradas"); render();
  },
  movCSV(){
    const sel=S.mov.datos.filter(x=>x.fecha>=S.mov.desde&&x.fecha<=S.mov.hasta);
    const filas=[["Fecha","Tipo","Estado","Concepto","De dónde viene","Responsable","Cuenta","Valor","Soporte","Observaciones","Registro","Registró"]]
      .concat(sel.map(x=>[x.fecha,x.tipo,esProv(x)?"Por ejecutar":"Ejecutado",x.concepto,x.origen||"",x.responsable||"",x.medio,x.tipo==="egreso"?-x.valor:x.valor,x.soporte||"",x.obs||"",x.estado,x.registradoPor]));
    const csv="﻿"+filas.map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(";")).join("\r\n");
    try{ const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));
      a.download=`ingresos_egresos_${S.mov.desde}_a_${S.mov.hasta}.csv`; document.body.appendChild(a); a.click(); a.remove(); }catch(e){}
    if(S.db.demo) toast("Si no se descargó, es por el modo demo: en la versión instalada sí descarga.");
  },
});

/* ===================== MÓDULO: MENÚ DEL DÍA ===================== */
// Estructura: proteínas (cada una con su precio), acompañamientos (cada uno se puede pedir normal, sin, o cambiado por huevo)
// y sopa/postre del día (varias opciones, con fruta como reemplazo).
const sumarDias = (iso,n) => { const d=new Date(iso+"T12:00:00"); d.setDate(d.getDate()+n); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); };
const diaSemana = iso => new Date(iso+"T12:00:00").getDay(); // 0 = domingo
const lunesDe = iso => sumarDias(iso, -((diaSemana(iso)+6)%7));
const siguienteLaboral = iso => { let f=sumarDias(iso,1); if(diaSemana(f)===0) f=sumarDias(f,1); return f; };
const mananaISO = () => { const d=new Date(); d.setDate(d.getDate()+1); d.setMinutes(d.getMinutes()-d.getTimezoneOffset()); return d.toISOString().slice(0,10); };
const DIAS = ["domingo","lunes","martes","miércoles","jueves","viernes","sábado"];
const fechaLarga = iso => { const d=new Date(iso+"T12:00:00"); const t=`${DIAS[d.getDay()]} ${d.getDate()} de ${d.toLocaleString("es-CO",{month:"long"})}`; return t[0].toUpperCase()+t.slice(1); };
const menuDe = f => S.menus.find(m=>m.id===f);
const menuActivo = m => m && m.publicado!==false && !m.anulado;
const menuHoy = () => { const m=menuDe(hoyISO()); return menuActivo(m)?m:null; };
S.menus=[]; S.mdia={fecha:null, borrador:null}; S.alm=null;

const SIN_SOPA = "Sin";

// Bebidas incluidas en el almuerzo (antes era un solo texto)
const bebidasInc = m => m ? (m.bebidasInc||(m.bebidaIncluida?[m.bebidaIncluida]:[])).filter(Boolean) : [];
const SIN_BEB = "Sin bebida";
// «Se acabó»: cocina marca opciones del menú de hoy como agotadas (se guarda en el mismo menú y se ve en todo el sistema)
const agotado = (m,cat,nombre) => !!m?.agotados?.[cat+"|"+nombre];
const tachar = (m,cat,nombre,html) => agotado(m,cat,nombre)?`<s class="agot">${html}</s> <span class="agot-tag">SE ACABÓ</span>`:html;

  </details>`

// Cupos del menú del día (espacios que llena el administrador)
const CUPOS = {"sopas":3,"proteinas":3,"acompanamientos":4,"bebidasInc":2,"bebidas":3,"postres":3};
const rellenar = (arr,n) => { const a=[...(arr||[])]; while(a.length<n) a.push(""); return a; };
function borradorDe(m,fecha){
  const nom=x=>typeof x==="string"?x:(x?.nombre||"");
  const b={_fecha:fecha,existe:!!m,anulado:m?(!!m.anulado||m.publicado===false):false,
    sopas:rellenar((m?.sopas||[]).concat(m?.fruta&&!m?.precios?["Fruta"]:[]),CUPOS.sopas),
    proteinas:rellenar((m?.proteinas||[]).map(nom),CUPOS.proteinas),
    acompanamientos:rellenar(m?.acompanamientos,CUPOS.acompanamientos),
    bebidasInc:rellenar(bebidasInc(m),CUPOS.bebidasInc),
    bebidas:rellenar((m?.bebidas||[]).map(nom),CUPOS.bebidas),
    postres:rellenar((m?.postres||[]).map(nom),CUPOS.postres), precios:{}, on:{}};
  // ✓ = se incluye (se va a escribir), ✗ = no se incluye. Menú nuevo: todo marcado; menú existente: marcado lo que tiene texto
  for(const k of Object.keys(CUPOS)) b.on[k]=b[k].map(x=>m?!!String(x).trim():true);
  for(const [md] of MODOS_PRECIO){ const t=m?.precios?.[md]||{};
    b.precios[md]={p1:t.p1??"",p2:t.p2??"",p3:t.p3??"",bebidas:rellenar(t.bebidas,3),postres:rellenar(t.postres,3)};
    if(m&&!m.precios){ // menú anterior: proponer precios con la regla vieja
      [1,2,3].forEach(n=>{ if(m.proteinas.length>=n) b.precios[md]["p"+n]=precioAlm(m,md,[...Array(n).keys()]); });
      ["bebidas","postres"].forEach(k=>(m[k]||[]).forEach((x,ix)=>{ if(ix<3) b.precios[md][k][ix]=x.precio||""; })); } }
  return b;
}

  if(!d.borrador||d.borrador._fecha!==d.fecha) d.borrador=borradorDe(menuDe(d.fecha),d.fecha);

    <div class="mu" style="margin:4px 0 8px">${fechaLarga(d.fecha)} ${b.existe?(b.anulado?'· <b style="color:var(--rojo)">ANULADO</b> (al publicar se reactiva)':"· <b>ya definido</b> (está editando)"):"· nuevo"}${diaSemana(d.fecha)===0?' · <b style="color:var(--azul)">domingo: solo eventos</b>':""}</div>
    ${S.db.ensayo&&!S.modoPruebas?`<div class="banner" style="border-color:#1565c0;margin-bottom:8px">🧯 Está en <b>«No guardar datos»</b>: este menú es de ensayo y se borra al terminar. El menú real se carga cuando termine el ensayo.</div>`:""}
    ${d.fecha===hoyISO()?`<div class="banner" style="background:#e8f5e9;border-color:#2e9e5b;color:#1b5e20">✅ Está editando el <b>menú de HOY</b>: al guardar, los meseros lo ven de inmediato.</div>`
      :`<div class="banner">⚠️ Está editando el menú del <b>${fechaLarga(d.fecha)}</b>, no el de hoy. Los meseros siguen viendo el menú de hoy. <button class="sm pri" onclick="S.mdia.fecha=hoyISO();S.mdia.semana=lunesDe(hoyISO());S.mdia.borrador=null;render()">Ir al menú de hoy</button></div>`}
    ${campos("sopas","🥣 1. Entradas",["Ej: Sopa de plátano","Ej: Crema de ahuyama","Ej: Fruta"],"(el mesero también puede marcar «Sin entrada»)")}
    ${campos("proteinas","🍗 2. Proteínas",["Ej: Pechuga a la plancha","Ej: Lomo de cerdo","Ej: Carne asada"],"(el cliente puede pedir 1, 2 o 3)")}
    ${campos("acompanamientos","🍚 3. Acompañamientos",["Ej: Arroz","Ej: Papa","Ej: Plátano","Ej: Ensalada"],"(se pueden pedir sin o cambiar por huevo)")}
    ${campos("bebidasInc","🥤 4. Bebidas del día",["Ej: Limonada","Ej: Aguapanela"],"(incluidas en el almuerzo)")}

    ${campos("postres","🍰 6. Postres",["Ej: Tres leches","Ej: Flan","Ej: Torta de chocolate"],"(se cobran aparte y van a cocina)")}
    <h3 style="margin:18px 0 4px">💲 Precios</h3>
    <div class="mu" style="font-size:13px;margin-bottom:6px">El almuerzo se cobra según la cantidad de proteínas, con o sin entrada y acompañamientos.</div>
    ${MODOS_PRECIO.map(([md,t],mi)=>`<div class="md-bloque md-precio-modo"><div class="row"><h4 style="margin:0">${({mesa:"🍽 Precios para la mesa",icopor:"Precios para llevar en icopor",plato:"🍛 Precios para llevar en plato",domicilio:"🛵 Precios para domicilio"})[md]}</h4><span class="sp"></span>${mi?`<button class="sm" onclick="accion.mdCopiarPrecios('${md}')">Copiar de la mesa</button>`:""}</div>
      <div class="md-precios-grid">
        ${[1,2,3].filter(n=>n<=Math.max(ps,1)).map(n=>precioIn(md,"p"+n,null,`Almuerzo ${n} proteína${n>1?"s":""}`)).join("")}
        ${b.bebidas.map((x,j)=>nomB("bebidas",j)?precioIn(md,"bebidas",j,"🍹 "+esc(nomB("bebidas",j))):"").join("")}
        ${b.postres.map((x,j)=>nomB("postres",j)?precioIn(md,"postres",j,"🍰 "+esc(nomB("postres",j))):"").join("")}
      </div></div>`).join("")}
    <div id="md-err" style="color:var(--rojo);font-size:13px;margin-top:6px"></div>
    <div class="row" style="margin-top:12px"><button onclick="accion.mdCopiar()">Copiar el último menú</button><span class="sp"></span>
      <button class="pri" onclick="accion.mdGuardar()">${b.existe?(b.anulado?"Reactivar y publicar":"Guardar cambios"):"Publicar menú"}</button></div>
  </div>
  ${semanaMenus()}</div>`;
}

Object.assign(accion,{

    const cambios=m.acompanamientos.map((ac,k)=>a.acomp[k]==="sin"?`SIN ${ac.toLowerCase()}`:a.acomp[k]==="huevo"?`${ac} → HUEVO`:null).filter(Boolean);
    const ent=a.sopa===SIN_SOPA?"SIN entrada":a.sopa, beb=a.beb?(a.beb===SIN_BEB?"SIN bebida":"Bebida: "+a.beb):"";
    const detalle=[ent, cambios.length?cambios.join(", "):"Acompañamientos completos", beb].filter(Boolean).join(" · ");
    const rec=m.precios?0:recargoModo(modo);
    const nuevoAlm={pid:"alm-"+rid(),nombre:"Almuerzo – "+nomP+(mesaFija&&a.llevar?" (para llevar)":""),precio:precioA,precioBase:precioA-rec,recargo:rec,nProt:ps.length,modo,
      proteina:nomP,proteinas:ps.map(p=>p.nombre),sopa:a.sopa===SIN_SOPA?"SIN":(a.sopa||""),bebida:a.beb===SIN_BEB?"SIN":(a.beb||""),

      return accion.guardarEdicion(ed.ix,nuevoAlm); }
    S.ped.nuevos.push(nuevoAlm);
    const n=S.ped.nuevos.filter(i=>String(i.pid).startsWith("alm-")).reduce((s,i)=>s+i.cant,0);
    if(otro){ S.alm={prots:m.proteinas.length===1?[0]:[],sopa:null,beb:null,acomp:{},cant:1,nota:"",llevar:a.llevar,mesaSel:a.mesaSel}; render(); modalAlmuerzo(); toast(`Almuerzo agregado (${n} en el ticket). Arme el siguiente.`); return; }

  mdCopiar(){ const ult=[...S.menus].filter(m=>m.id!==S.mdia.fecha&&menuActivo(m)&&m.id<S.mdia.fecha).sort((x,y)=>y.id.localeCompare(x.id))[0]||[...S.menus].filter(m=>m.id!==S.mdia.fecha&&menuActivo(m)).sort((x,y)=>y.id.localeCompare(x.id))[0];

  async mdGuardar(){
    const b=S.mdia.borrador, err=$("#md-err");
    const num=v=>Number(String(v??"").replace(/\D/g,""))||0;
    const nombresCat={sopas:"Entradas",proteinas:"Proteínas",acompanamientos:"Acompañamientos",bebidasInc:"Bebidas del día",bebidas:"Bebidas especiales",postres:"Postres"};
    for(const k of Object.keys(CUPOS)){ const j=b[k].findIndex((x,j)=>b.on[k][j]&&!String(x).trim()); if(j>=0) return err.textContent=`${nombresCat[k]}: escriba la opción ${j+1} o márquela con ✕ para no incluirla`; }

      if(precios[md].bebidas.some(v=>!v)||precios[md].postres.some(v=>!v)) return err.textContent=`Faltan precios de bebidas especiales o postres · ${t.replace(/^[^A-Za-zÁÉÍÓÚ]+/,"")}`; }
    const prev=menuDe(S.mdia.fecha);

      publicado:true,anulado:null,actualizadoPor:S.yo.nombre,actualizado:Date.now()};
    try{ await S.db.poner("menus",S.mdia.fecha,d); S.mdia.borrador=null; S.mdia.semana=lunesDe(S.mdia.fecha); toast(`Menú del ${fechaLarga(d.fecha)} publicado`); render(); }
    catch(e){ err.textContent="Error: "+e.message; }
  },
});

/* ===================== ATENCIÓN: despacho, servido y envío a caja ===================== */
function estadoTexto(v){
  if(pendienteCocina(v)) return (v.rondaDespachada?"🔥 Adicional en cocina":"🔥 En cocina");
  if(!esServido(v)){ const d=(v.despachos||[]).slice(-1)[0];
    if(v.mesaId==="domicilio") return v.salidaEn?`🛵 En camino con <b>${esc(v.salidaPor||d?.quien||"")}</b>`:d?`⏳ Listo, falta que lo acepte <b>${esc(d.quien)}</b>`:"Sin platos de cocina";
    return d?`⏳ Pendiente servir · lo lleva <b>${esc(d.quien)}</b>`:"Pendiente servir"; }
  return `✓ ${verboServir(v)}${v.servidoEn?" en "+durTxt(v.servidoEn-v.creado):""}`;
}
function estadoCrono(v){
  // Corre desde que se cargó el pedido hasta que se marca servido/entregado; un adicional corre desde que se envió
  if(!v.servidoEn) return crono(v.creado);
  if(!esServido(v)) return crono(v.enviado||v.creado);
  return crono(v.creado, v.servidoEn);
}
// Trazabilidad completa de un ticket: quién lo pidió, qué se agregó, cocina, entrega, caja y pago
function trazaTicket(v){
  const rolTxt=r=>r==="admin"?"Administrador":r==="cajero"?"Caja":r?ROLES[r]||r:"";
  const rolDe=n=>{ const u=S.usuarios.find(x=>x.nombre===n||x.nombre+" (pruebas)"===n||n===x.nombre.replace(/ \(pruebas\)$/,"")); return u?rolTxt(u.rol):""; };
  const its=a=>a.map(i=>`${i.cant}× ${esc(i.nombre)}`).join(", ");
  // [hora, ícono, qué se hizo, quién, rol, detalle]
  const pasos=[[v.creado,"📝","Pedido tomado",nombreMesero(v),rolDe(nombreMesero(v)),`${etiquetaVale(v)} · ${its((v.items||[]).filter(i=>(i.ronda||1)===1))}`]];
  const rondas={}; (v.items||[]).filter(i=>(i.ronda||1)>1&&!i.editado).forEach(i=>{ (rondas[i.ronda]=rondas[i.ronda]||[]).push(i); });
  Object.values(rondas).forEach(a=>pasos.push([a[0].en||v.creado,"➕","Agregó al pedido",a[0].por||"—",rolDe(a[0].por),its(a)]));
  // Cada despacho cubre las rondas desde el despacho anterior hasta la suya: se muestra qué salió realmente
  let rPrev=0; [...(v.despachos||[])].sort((a,b)=>a.fecha-b.fecha).forEach(d=>{
    const sal=(v.items||[]).filter(i=>i.cocina&&(i.ronda||1)>rPrev&&(i.ronda||1)<=d.ronda);
    const titulo=rPrev===0?(sal.some(i=>(i.ronda||1)>1)?"Cocina despachó el pedido completo (con lo agregado)":"Cocina despachó el pedido")
      :sal.length&&sal.every(i=>i.editado)?"Cocina despachó el cambio":"Cocina despachó lo agregado";
    pasos.push([d.fecha,"🍳",d.directo?titulo+" y lo entregó directamente":`${titulo} → entregó a ${esc(d.quien)}`,d.por||"Cocina","Cocina",`${sal.length?its(sal)+"<br>":""}${d.directo?"Pasó solo a caja para el cobro":`Responsable de servir o entregar: <b>${esc(d.quien)}</b>`}`]);
    rPrev=Math.max(rPrev,d.ronda||1); });
  (v.cambios||[]).forEach(c=>pasos.push(c.edito?[c.fecha,"✏️","Cambió un plato",c.quien,rolDe(c.quien),`Antes: ${esc(c.edito)}<br>Ahora: <b>${esc(c.ahora)}</b>`]:[c.fecha,"✂️","Quitó un producto",c.quien,rolDe(c.quien),`${esc(c.quito)} · motivo: ${esc(c.motivo)}`]));
  if(v.salidaEn) pasos.push([v.salidaEn,"🛵","Aceptó el domicilio y salió",v.salidaPor||"—",rolDe(v.salidaPor),`Hora de salida: ${hora(v.salidaEn)}${v.servidoEn?` · tiempo en camino: ${durTxt(v.servidoEn-v.salidaEn)}`:""}`]);
  if(v.servidoEn) pasos.push([v.servidoEn,"🍽",`Marcó como ${verboServir(v).toLowerCase()}`,v.servidoPor||"—",rolDe(v.servidoPor),`Espera desde que se pidió: ${durTxt(v.servidoEn-v.creado)}`]);
  if(v.pagoReportado) pasos.push([v.pagoReportado.fecha||v.enCajaEn,servicioDe(v)==="domicilio"?"🛵":"🙋",servicioDe(v)==="domicilio"?"Reportó el pago del domicilio":"Entregó y reportó el pago",v.pagoReportado.por,rolDe(v.pagoReportado.por),`Medio: ${esc(v.pagoReportado.medio)}${v.pagoReportado.credito?" · "+esc(v.pagoReportado.credito.nombre):""}${v.pagoReportado.recibido?` · recibió ${money(v.pagoReportado.recibido)}`:""}${v.soporte?" · tomó foto del soporte":""}`]);
  if(v.enCajaEn) pasos.push([v.enCajaEn,"💵","Envió el ticket a caja",v.enCajaPor||"—",rolDe(v.enCajaPor),`Total a cobrar: ${money(v.total)}`]);
  if(v.pago?.fecha) pasos.push([v.pago.fecha,"✅","Confirmó el pago",v.pago.cajero,v.pago.cajeroRol?rolTxt(v.pago.cajeroRol):rolDe(v.pago.cajero),
    `${esc(medioTxt(v.pago.medio))} · ${money(v.total)}${v.pago.recibido?` · recibió ${money(v.pago.recibido)}, cambio ${money(v.pago.cambio)}`:""}${v.pago.ref?` · ref. ${esc(v.pago.ref)}`:""}${v.soporte||v.pago.soporte?` <button class="sm" onclick="accion.verSoporte('${v.id}')">📎 Ver soporte</button>`:""}`]);
  if(v.anulacion) pasos.push([v.anulacion.fecha,"❌","Anuló el ticket",v.anulacion.por,rolDe(v.anulacion.por),`Motivo: ${esc(v.anulacion.motivo)}`]);
  pasos.sort((a,b)=>(a[0]||0)-(b[0]||0));
  return `<div class="traza">${pasos.map(([t,ic,que,quien,rol,det])=>`<div class="tz-paso">
    <div class="tz-hora">${t?hora(t):""}</div>
    <div class="tz-cuerpo"><div class="tz-que">${ic} ${que}</div>
      <div class="tz-quien">👤 <b>${esc(quien||"—")}</b>${rol?` <span class="tz-rol">${esc(rol)}</span>`:""}</div>
      ${det?`<div class="tz-det">${det}</div>`:""}</div></div>`).join("")}</div>`;
}

    <input id="pr-busca" placeholder="Buscar producto…" value="${esc(S.prodBusca||"")}" style="margin:10px 0 8px" oninput="S.prodBusca=this.value;modalProductos();setTimeout(()=>{const e=document.getElementById('pr-busca');if(e){e.focus();e.setSelectionRange(e.value.length,e.value.length)}},0)">
    ${q?"":`<div class="cats" style="position:static;margin:0 0 6px;padding:0">${cats.map(c=>`<button class="${c===S.cat?"on":""}" onclick="S.cat=${JSON.stringify(c).replace(/"/g,"&quot;")};modalProductos()">${esc(c)}</button>`).join("")}</div>`}
    <div style="max-height:46vh;overflow:auto">${lista.map(x=>{ const n=cantDe(x.id);
      return `<div class="it" style="${n?"background:var(--rosa3);border-radius:8px;padding:8px":""}"><span class="sp">${esc(x.nombre)}<br><b style="color:var(--rosa)">${money(precioProducto(x,llevar))}</b></span>
        <span class="q">${n?`<button onclick="accion.prodCant('${x.id}',-1)">−</button><b style="min-width:22px;text-align:center">${n}</b>`:""}<button class="${n?"":"pri"}" onclick="accion.prodCant('${x.id}',1)">${n?"+":"Agregar"}</button></span></div>`; }).join("")||`<p class="mu">No se encontraron productos.</p>`}</div>`}
    <div class="row" style="margin-top:12px"><span class="mu">${total?`${total} producto(s) en el pedido`:""}</span><span class="sp"></span><button class="pri" onclick="cerrarModal();render()">Listo</button></div>`);
}
Object.assign(accion,{
  prodCant(pid,d){
    if(d>0) accion.agregarItem(pid);
    else { const ix=S.ped.nuevos.findIndex(i=>i.pid===pid&&!i.nota); if(ix>=0){ const i=S.ped.nuevos[ix]; i.cant--; if(i.cant<=0) S.ped.nuevos.splice(ix,1); } render(); }
    modalProductos();
  },
});

function planoSalon(salon,ms,soloVer){
  const pl=PLANOS[salon]; if(!pl) return "";
  const pct=(v,t)=>(v/t*100).toFixed(3)+"%";
  // Los botones se agrandan un poco alrededor del recuadro del croquis para que sea fácil tocarlos
  const box=([x,y,w,h])=>{ const ex=Math.max(4,w*.06), ey=Math.max(5,h*.18); return `left:${pct(x-ex,pl.w)};top:${pct(y-ey,pl.h)};width:${pct(w+2*ex,pl.w)};height:${pct(h+2*ey,pl.h)}`; };
  return `<div style="margin:4px 0 12px"><div class="plano" style="aspect-ratio:${pl.w}/${pl.h};max-width:${pl.w>pl.h?900:620}px">
    <img class="fondo" src="${pl.img}" alt="Plano ${esc(salon)}">
    ${ms.map(m=>{ const pos=pl.mesas[String(m.nombre).trim()]; if(!pos) return ""; const v=valeDeMesa(m.id), vp=!v&&valePagoMesa(m.id);
      if(vp) return `<button class="pmesa st-pago ${pos[4]?"vert":""}" style="${box(pos)}" onclick="${soloVer?`resumenTicket('${vp.id}')`:`accion.abrirMesa('${m.id}')`}" title="Mesa ${esc(m.nombre)}">
        <span class="pin"><span class="pn">Mesa ${esc(m.nombre)}</span><span class="pw">💵 Pendiente pago</span><span class="pc"><span class="crono fijo">👤 ${esc(String(responsable(vp)).split(" ")[0])}</span></span></span></button>`;
      const est="";
      return `<button class="pmesa ${claseEstado(v)} ${pos[4]?"vert":""}" style="${box(pos)}" onclick="${soloVer?(v?`resumenTicket('${v.id}')`:""):`accion.abrirMesa('${m.id}')`}" title="Mesa ${esc(m.nombre)}">
        <span class="pin"><span class="pn">Mesa ${esc(m.nombre)}</span>${v?`<span class="pw">👤 ${esc(String(responsable(v)).split(" ")[0])}</span><span class="pc">${estadoCrono(v)}</span>`:""}</span></button>`; }).join("")}
  </div></div>`;
}
Object.assign(accion,{
  async cargarPlano(salon){
    const pl=PLANOS[salon]; if(!pl) return;
    const nums=Object.keys(pl.mesas);
    const existentes=S.mesas.filter(m=>nums.includes(String(m.nombre).trim()));
    if(!(await confirmar(`Se ubicarán ${nums.length} mesas (${nums.sort((a,b)=>a-b).join(", ")}) en el plano de «${salon}». ${existentes.length} ya existen y solo se reubicarán; las demás se crean. Las otras mesas no se tocan.`,"Cargar plano"))) return;
    let creadas=0, movidas=0;
    for(const n of nums){ const [x,y,w,h]=pl.mesas[n], d={salon,x,y,w,h,orden:Number(n)};
      const m=S.mesas.find(k=>String(k.nombre).trim()===n);
      if(m){ await S.db.actualizar("mesas",m.id,d); movidas++; } else { await S.db.agregar("mesas",{nombre:n,...d}); creadas++; } }
    S.salon=salon; S.vistaMesas="plano"; toast(`Plano cargado: ${creadas} mesas creadas, ${movidas} reubicadas`); render();
  },
});

const ETAPAS = [

];
const etapaDe = v => v.estado==="pagado"?"pagado":v.creado<inicioDia()?"pend":!enCurso(v)?"caja":estadoCurso(v).k;
function vistaEstado(){
  const fc=S.estCat||"todos", fe=S.estEtapa||"todas";
  const vistos=new Set(), todos=[];
  for(const v of [...S.valesAbiertos, ...(S.valesCobHoy||[]), ...S.valesHoy.filter(x=>x.estado==="pagado")]) if(!vistos.has(v.id)&&v.estado!=="anulado"){ vistos.add(v.id); todos.push(v); }
  const cats=Object.keys(CATEG);
  const n=(c,e)=>todos.filter(v=>(c==="todos"||servicioDe(v)===c)&&(e==="todas"||etapaDe(v)===e)).length;
  const celda=(c,e)=>{ const k=n(c,e); return `<td class="n ${k?"":"cero"} ${fc===c&&fe===e?"sel":""}" onclick="S.estCat='${c}';S.estEtapa='${e}';render()">${k}</td>`; };
  const lista=todos.filter(v=>fc==="todos"||servicioDe(v)===fc);
  const tarjeta=v=>{ const sv=servicioDe(v), et=etapaDe(v), d=(v.despachos||[]).slice(-1)[0];
    const abrir=`resumenTicket('${v.id}')`;
    return `<div class="tcard" onclick="${abrir}">
      <div class="row" style="gap:6px"><b>${CATEG[sv]}${sv==="mesa"?" "+esc(v.mesaNombre):v.cliente?" · "+esc(v.cliente.nombre):""}</b><span class="sp"></span>${et==="pagado"?"":estadoCrono(v)}</div>
      ${et==="pend"?`<div style="color:#c62828;font-weight:700">📅 Solicitado el ${fecha(v.creado)}</div>`:""}
      <div class="mu">#${pad(v.numero)} · ${hora(v.creado)} · tomó ${esc(String(nombreMesero(v)).split(" ")[0])}${d&&!d.directo&&et!=="cocina"?` · <b>👤 lo tiene ${esc(d.quien)}</b>`:""}</div>
      <div style="margin:4px 0">${v.items.map(i=>`${i.cant}× ${esc(i.nombre)}`).join(" · ")||'<span class="mu">Sin productos</span>'}</div>
      <div class="row"><b>${money(v.total)}</b><span class="sp"></span>${et==="pagado"?`<span class="mu">${esc(v.pago?.medio||"")}</span>`:v.pagoReportado?`<span class="dot" style="background:var(--azul)">${esc(v.pagoReportado.medio)}</span>`:""}</div></div>`; };
  const etapas=ETAPAS.filter(e=>fe==="todas"||e.k===fe);
  return `<div class="row"><h2 style="margin:0">Estado de solicitudes</h2><span class="sp"></span><span class="mu">en tiempo real · ${todos.filter(v=>v.estado==="abierto").length} abiertos</span></div>
  <div class="card" style="overflow-x:auto;margin:12px 0"><table class="matriz" style="min-width:720px">
    <tr><th>Categoría</th>${ETAPAS.map(e=>`<th style="color:${e.c}">${e.t}</th>`).join("")}<th>Total</th></tr>
    ${cats.map(c=>`<tr><td>${CATEG[c]}</td>${ETAPAS.map(e=>celda(c,e.k)).join("")}${celda(c,"todas")}</tr>`).join("")}
    <tr style="border-top:2px solid var(--ln)"><td><b>Todas</b></td>${ETAPAS.map(e=>celda("todos",e.k)).join("")}${celda("todos","todas")}</tr></table>
    <div class="mu" style="margin-top:6px">Toque un número para filtrar el tablero.${fc!=="todos"||fe!=="todas"?` <button class="sm" onclick="S.estCat='todos';S.estEtapa='todas';render()">Quitar filtro</button>`:""}</div></div>
  <div class="tablero" style="${etapas.length<7?`grid-template-columns:repeat(${etapas.length},minmax(220px,1fr))`:""}">${etapas.map(e=>{ const vs=lista.filter(v=>etapaDe(v)===e.k).sort((a,b)=>e.k==="pagado"?(b.pagoFecha||b.creado)-(a.pagoFecha||a.creado):a.creado-b.creado);

const PAGOS_DOMI = [["Efectivo","💵 Efectivo"],["QR","📱 QR / llave"],["Crédito","💳 Crédito"]];
const CATEG = {mesa:"🍽 Mesa", domicilio:"🛵 Domicilio", llevar:"<i class=ic-caja></i> Icopor", plato:"🍛 Plato", varios:"<i class=ic-beb></i> Productos varios", bebidas:"🍹 Bebidas especiales", postres:"🍰 Postres"};
// Estado del pedido para quien atiende: en cocina → listo (servir / llevar / entregar) → servido o entregado
function estadoCurso(v){
  if(pendienteCocina(v)) return {k:"cocina",t:"🔥 En cocina",o:1};
  const sv=servicioDe(v);
  // Domicilio: despachado → el domiciliario lo acepta (sale) → en camino → entregado y enviado a caja
  if(sv==="domicilio"&&!v.servidoEn) return v.salidaEn?{k:"camino",t:`🛵 En camino · salió ${hora(v.salidaEn)}`,o:0}:{k:"listo",t:"⏳ Listo · falta que el domiciliario lo acepte",o:0};
  if(!esServido(v)){
    return {k:"listo",t:sv==="mesa"?"⏳ Pendiente servir a la mesa":"⏳ Pendiente entregar al cliente",o:0}; }
  return {k:"serv",t:`✓ ${verboServir(v)} · falta enviar a caja`,o:2};
}

// Reduce una foto de la cámara a JPEG liviano (para guardarla como soporte)
function comprimirFoto(file,max=1100,cal=.6){ return new Promise((ok,mal)=>{ const fr=new FileReader(); fr.onerror=mal;
  fr.onload=()=>{ const im=new Image(); im.onerror=mal; im.onload=()=>{ const k=Math.min(1,max/Math.max(im.width,im.height)), c=document.createElement("canvas");
    c.width=Math.round(im.width*k); c.height=Math.round(im.height*k); c.getContext("2d").drawImage(im,0,0,c.width,c.height); ok(c.toDataURL("image/jpeg",cal)); }; im.src=fr.result; };
  fr.readAsDataURL(file); }); }

/* ===================== NOTIFICACIONES PUSH (llegan aunque la app esté cerrada) =====================
   Cada celular con notificaciones permitidas se suscribe (Web Push) y queda en la colección pushSubs.
   Quien hace un cambio en un ticket calcula a quién le toca enterarse (las mismas reglas de los avisos en pantalla)
   y le pide al servidor de notificaciones (Cloudflare Worker, ver push/) que se los envíe. */
const PUSH={url:"",clave:null,listo:false};
async function pushIniciar(){ if(PUSH.listo) return PUSH.url; PUSH.listo=true;
  try{ const r=await fetch("push-config.json?t="+Date.now(),{cache:"no-store"}); if(r.ok) PUSH.url=((await r.json()).url||"").replace(/\/$/,""); }catch(e){}
  return PUSH.url; }
const idSub = ep => { let h=0; for(const ch of ep){ h=(h*31+ch.charCodeAt(0))|0; } return "s"+(h>>>0).toString(36)+ep.length.toString(36)+ep.slice(-24).replace(/[^a-zA-Z0-9]/g,""); };
async function pushSuscribir(){
  try{ if(!S.yo||S.db.demo||S.modoPruebas||!("serviceWorker" in navigator)||!("PushManager" in window)||Notification.permission!=="granted") return;
    if(!(await pushIniciar())) return;
    if(!PUSH.clave){ const r=await fetch(PUSH.url+"/vapid"); PUSH.clave=(await r.json()).publicKey; } if(!PUSH.clave) return;
    const reg=await navigator.serviceWorker.ready; let sub=await reg.pushManager.getSubscription();
    if(!sub) sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:Uint8Array.from(atob(PUSH.clave.replace(/-/g,"+").replace(/_/g,"/")),c=>c.charCodeAt(0))});
    const j=sub.toJSON(); PUSH.miSub=idSub(j.endpoint);
    await S.db.fs.collection("pushSubs").doc(PUSH.miSub).set({uid:S.yo.id,nombre:S.yo.nombre,rol:S.yo.rol,endpoint:j.endpoint,keys:j.keys,ua:navigator.userAgent.slice(0,120),actualizado:Date.now()});
  }catch(e){ console.warn("push",e); } }

async function pushCambio(antes,despues){
  try{ if(!S.yo||S.db.demo||S.modoPruebas||!(await pushIniciar())) return;
    const destino={};
    for(const u of (S.usuarios||[]).filter(u=>u.activo!==false&&u.id!==S.yo.id)){ const out=[]; revisarAvisosDe(antes?[antes]:[],[despues],u,out); if(out.length) destino[u.id]=out; }
    const uids=Object.keys(destino); if(!uids.length) return;
    const subs=(await S.db.fs.collection("pushSubs").where("uid","in",uids.slice(0,30)).get()).docs.map(d=>({id:d.id,...d.data()}));
    const msgs=[]; for(const uid of uids){ const ss=subs.filter(x=>x.uid===uid).map(x=>({id:x.id,endpoint:x.endpoint,keys:x.keys})); if(!ss.length) continue;
      for(const a of destino[uid]) msgs.push({subs:ss,payload:{t:a.t,d:String(a.d||"").replace(/<[^>]+>/g,""),k:a.k}}); }
    if(!msgs.length) return;
    const token=await S.db.auth.currentUser.getIdToken();
    const r=await fetch(PUSH.url+"/notify",{method:"POST",headers:{"Content-Type":"application/json",Authorization:"Bearer "+token},body:JSON.stringify({msgs})});
    const j=await r.json().catch(()=>({})); for(const id of (j.gone||[])) S.db.fs.collection("pushSubs").doc(id).delete().catch(()=>{});
  }catch(e){ console.warn("push",e); } }

    if(FIREBASE_CONFIG){ S.db=new FireStore(); await S.db.iniciar(); S.setup=await tope(S.db.necesitaConfigurar().catch(()=>false),8000,false); }
    else S.db=new DemoStore();
    S.yo=await (FIREBASE_CONFIG?tope(S.db.restaurar(),8000,null):S.db.restaurar()); if(S.yo){ S.vista=P().vistas[0]; suscribirTodo(); setTimeout(pushSuscribir,2500); }
  }catch(e){ $("#app").innerHTML=`<div class="login card"><h2>No se pudo conectar</h2><p>${esc(e.message)}</p><p class="mu">Revise la conexión a internet y la configuración de Firebase.</p></div>`; return; }
  render();
  setInterval(()=>{ if(S.yo&&["mesas","cocina","estado","domicilios"].includes(S.vista)&&!S.ped&&$("#modal").style.display!=="flex") render(); },30000);
})();
</script>
