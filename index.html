<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Casa Rosada POS</title>
<meta name="theme-color" content="#e5168d">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Casa Rosada">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
/* Paleta del logo oficial: fucsia, rosa hoja, negro y blanco */
:root{--rosa:#e5168d;--rosa-h:#c80f78;--rosa2:#e58fbf;--rosa3:#fbe3ef;--negro:#1d1d1b;
--bg:#fcebf3;--card:#fff;--tx:#1d1d1b;--mu:#7a6f75;--ln:#efdce7;--hd:#fff7fb;--btn:#f3e8ee;--inp:#fff;
--libre:#ffffff;--libre-b:#1d1d1b;--ocup:#f6c4de;--ocup-tx:#1d1d1b;--cuenta:#e5168d;--listo:#2e9e5b;--rojo:#d32f2f;--azul:#3d5afe;--amar:#fff4e5;--banner:#fdeef6;--banner-b:#f3bfdc}
[data-tema="oscuro"]{--rosa:#ff3fa4;--rosa-h:#ff5fb4;--rosa2:#f29ccb;--rosa3:#3a1f2e;
--bg:#141214;--card:#1f1b1e;--tx:#f3eef1;--mu:#a7999f;--ln:#3a3036;--hd:#1a1719;--btn:#2d262b;--inp:#2a2328;
--libre:#262024;--libre-b:#8a7a83;--ocup:#7a2a55;--ocup-tx:#fff;--cuenta:#ff3fa4;--listo:#3fbf73;--rojo:#ef5350;--azul:#7c8cff;--amar:#3a2f20;--banner:#2c1d26;--banner-b:#5a3049}
body,header,nav,.card,.mesa,input,select,textarea,button{transition:background-color .2s,color .2s,border-color .2s}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tx);font-size:15px}
button{font:inherit;cursor:pointer;border:0;border-radius:8px;padding:10px 14px;background:var(--btn);color:var(--tx)}
button.pri:hover{background:var(--rosa-h)}
button.pri{background:var(--rosa);color:#fff}button.ok{background:var(--listo);color:#fff}
button.warn{background:var(--cuenta);color:#fff}button.dan{background:var(--rojo);color:#fff}
button.az{background:var(--azul);color:#fff}button:disabled{opacity:.45;cursor:not-allowed}
button.sm{padding:6px 10px;font-size:13px}
input,select,textarea{font:inherit;padding:10px;border:1px solid var(--ln);border-radius:8px;width:100%;background:var(--inp);color:var(--tx)}
input:focus,select:focus{outline:2px solid var(--rosa2);border-color:var(--rosa)}
label{font-size:13px;color:var(--mu);display:block;margin:8px 0 4px}
.top{position:sticky;top:0;z-index:5;box-shadow:0 2px 6px rgba(0,0,0,.06)}
header{background:var(--hd);color:var(--tx);display:flex;align-items:center;gap:10px;padding:6px 14px;border-bottom:3px solid var(--rosa);min-height:58px}
header .logoimg{height:46px;width:auto;display:block}
header .logo{font-weight:700;font-size:17px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--rosa);display:flex;align-items:center;gap:10px}
header .who{font-size:13px;text-align:right;line-height:1.2}
header button{background:var(--btn);color:var(--tx)}
.tema{font-size:18px;padding:6px 10px;line-height:1}
nav{background:var(--card);display:flex;gap:2px;overflow-x:auto;border-bottom:1px solid var(--ln);scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{background:none;border-radius:0;padding:13px 16px;font-weight:600;color:var(--mu);border-bottom:3px solid transparent;white-space:nowrap}
nav button.on{color:var(--rosa);border-bottom-color:var(--rosa)}
main{padding:16px;max-width:1200px;margin:0 auto}
.card{background:var(--card);border-radius:12px;padding:14px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sp{flex:1}.mu{color:var(--mu);font-size:13px}.b{font-weight:700}.r{text-align:right}
.grid{display:grid;gap:12px}
.mesas{grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}
.mesa{color:var(--tx);border:3px solid var(--libre-b);border-radius:12px;padding:12px;min-height:110px;cursor:pointer;display:flex;flex-direction:column;background:var(--libre);text-align:left}
.mesa .n{font-size:24px;font-weight:800}.mesa.ocup{background:var(--ocup);color:var(--ocup-tx);border-color:var(--rosa)}.mesa.cuenta{background:var(--cuenta);color:#fff;border-color:var(--rosa-h)}
.mesa .tag{font-size:12px;margin-top:auto}
.dot{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:700;background:var(--listo);color:#fff}
.leg{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;margin:6px 0 14px}
.leg i{display:inline-block;width:14px;height:14px;border:2px solid var(--libre-b);border-radius:3px;vertical-align:-2px;margin-right:4px}
.ped{display:grid;grid-template-columns:1fr 380px;gap:14px}
@media(max-width:860px){.ped{grid-template-columns:1fr}}
.cats{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px}
.cats button.on{background:var(--rosa);color:#fff}
.prods{grid-template-columns:repeat(auto-fill,minmax(130px,1fr));margin-top:10px}
.prod{background:var(--card);color:var(--tx);border:1px solid var(--ln);text-align:left;min-height:74px;display:flex;flex-direction:column}
.prod .p{color:var(--rosa);font-weight:700;margin-top:auto}
.it{display:flex;gap:8px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--ln)}
.it .q{display:flex;align-items:center;gap:4px}
.it .q button{padding:4px 10px}
.it.nuevo{background:var(--rosa3)}
.tot{font-size:22px;font-weight:800;display:flex;justify-content:space-between;margin:12px 0}
.kgrid{grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.kcard{border-top:8px solid var(--cuenta)}.kcard.preparando{border-top-color:var(--azul)}.kcard.listo{border-top-color:var(--listo)}
.kcard li{font-size:17px;margin:4px 0}.kcard li.nw{font-weight:800}.kcard .nota{color:var(--rojo);font-size:14px}
table{width:100%;border-collapse:collapse}td,th{padding:8px;border-bottom:1px solid var(--ln);text-align:left;font-size:14px}
th{color:var(--mu);font-weight:600}
.kpis{grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}
.kpi .v{font-size:22px;font-weight:800}
.sello{display:inline-block;border:3px solid var(--listo);color:var(--listo);font-weight:900;padding:4px 12px;border-radius:6px;transform:rotate(-4deg);font-size:20px}
.sello.an{border-color:var(--rojo);color:var(--rojo)}.sello.ab{border-color:var(--cuenta);color:var(--cuenta)}
.login{max-width:380px;margin:8vh auto}
.login h1{color:var(--rosa);margin:0 0 4px}
.login .logo-big{display:block;margin:0 auto 10px;max-width:260px;width:80%}
#app > .tema{position:fixed;top:14px;right:14px}
.banner{background:var(--banner);border:1px solid var(--banner-b);padding:10px 14px;border-radius:10px;font-size:13px;margin-bottom:14px}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
#modal .card{color:var(--tx);max-width:440px;width:100%;max-height:90vh;overflow:auto}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--negro);border:1px solid var(--rosa);color:#fff;padding:10px 18px;border-radius:30px;display:none;z-index:60;font-size:14px}
.ver{font-size:11px;font-weight:700;color:var(--rosa);background:var(--rosa3);border-radius:20px;padding:2px 8px;white-space:nowrap;line-height:1.4}
.nueva-ver{background:var(--azul);color:#fff;text-align:center;padding:9px 12px;font-size:14px;cursor:pointer}
.nueva-ver b{text-decoration:underline}
.barra-movil{display:none}
.crono{font-variant-numeric:tabular-nums;font-weight:800;background:var(--btn);color:var(--tx);border-radius:20px;padding:2px 9px;font-size:13px;white-space:nowrap;display:inline-block}
.crono.naranja{background:#ffb74d;color:#3a2200}.crono.rojo{background:var(--rojo);color:#fff}.crono.fijo{background:var(--rosa3);color:var(--tx)}
.kcard .serv{font-size:22px;font-weight:900;letter-spacing:.3px}
.kcard .it-k{font-size:18px;margin:6px 0;padding-bottom:6px;border-bottom:1px dashed var(--ln)}
.kcard .det{font-size:16px;font-weight:700;color:var(--tx)}
.kcard .nota{color:var(--rojo);font-size:16px;font-weight:700}
.ped>*,.grid>*{min-width:0}
.login .pie{text-align:center;font-size:12px;color:var(--mu);margin-top:12px}
/* ===== Celulares ===== */
@media(max-width:640px){
  body{font-size:14px}
  header{padding:5px 10px;gap:8px;min-height:50px}
  header .logoimg{height:38px}
  header .logo{font-size:14px;gap:6px}
  header .logo span{display:none}
  header .who{font-size:11px}
  header .who .rol{display:none}
  header button.sm{padding:6px 9px}
  .tema{font-size:16px;padding:5px 8px}
  nav button{padding:10px 12px;font-size:14px}
  main{padding:10px}
  h2{font-size:19px} h3{font-size:16px}
  .card{padding:11px;border-radius:10px}
  button{padding:9px 12px}
  input,select,textarea{font-size:16px;padding:9px}
  .grid{gap:8px}
  .mesas{grid-template-columns:repeat(auto-fill,minmax(96px,1fr))}
  .mesa{min-height:84px;padding:9px;border-width:2px}
  .mesa .n{font-size:20px}
  .mesa .mu,.mesa b{font-size:12px}
  .leg{gap:8px;font-size:12px;margin:4px 0 10px}
  .ped{gap:10px}
  .prods{grid-template-columns:repeat(auto-fill,minmax(104px,1fr));margin-top:8px}
  .prod{min-height:62px;padding:8px;font-size:13px}
  .cats{position:sticky;top:96px;background:var(--card);z-index:2;margin:-4px -11px 0;padding:6px 11px}
  .cats button{padding:7px 11px;font-size:13px;white-space:nowrap}
  .tot{font-size:19px;margin:8px 0}
  .kgrid{grid-template-columns:1fr}
  .kpis{grid-template-columns:repeat(2,1fr)}
  .kpi .v{font-size:18px}
  td,th{padding:6px 5px;font-size:13px}
  .row{gap:6px}
  #modal{padding:10px;align-items:flex-end}
  #modal .card{max-height:85vh;border-radius:14px 14px 10px 10px}
  .login{margin:4vh auto}
  .con-barra{padding-bottom:84px}
  .barra-movil{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:6;gap:8px;align-items:center;padding:10px 12px calc(10px + env(safe-area-inset-bottom));
    background:var(--card);border-top:2px solid var(--rosa);box-shadow:0 -3px 10px rgba(0,0,0,.12)}
  .con-barra ~ #toast, body:has(.con-barra) #toast{bottom:96px}
  #toast{max-width:92vw;text-align:center}
  .barra-movil .t{flex:1;line-height:1.15}.barra-movil .t b{font-size:18px}
}
#print-area{display:none}
.ticket{width:72mm;font-family:"Courier New",monospace;font-size:12px;color:#000;padding:2mm}
.ticket h2{font-size:15px;text-align:center;margin:2px 0}.ticket .c{text-align:center}
.ticket hr{border:0;border-top:1px dashed #000}.ticket .big{font-size:16px;font-weight:700}
.ticket table td{border:0;padding:1px 0;font-size:12px}.ticket .qr{display:flex;justify-content:center;margin:6px 0}
@media print{body>*:not(#print-area){display:none!important}#print-area{display:block}@page{margin:0;size:80mm auto}}
</style>
</head>

function toast(m){ const t=$("#toast"); t.textContent=m; t.style.display="block"; clearTimeout(t._h); t._h=setTimeout(()=>t.style.display="none",2600); }

  });
}

}

function temaActual(){ let t=null; try{ t=localStorage.getItem("crx_tema"); }catch(e){}

function aplicarTema(t){ document.documentElement.setAttribute("data-tema",t);
  const m=document.querySelector('meta[name="theme-color"]'); if(m) m.content=t==="oscuro"?"#1a1719":"#e5168d"; }
function cambiarTema(){ const t=temaActual()==="oscuro"?"claro":"oscuro"; try{ localStorage.setItem("crx_tema",t); }catch(e){} aplicarTema(t); render(); }
function botonTema(){ const o=temaActual()==="oscuro"; return `<button class="tema" onclick="cambiarTema()" title="${o?"Cambiar a modo claro":"Cambiar a modo oscuro"}" aria-label="${o?"Modo claro":"Modo oscuro"}">${o?"☀️":"🌙"}</button>`; }
aplicarTema(temaActual());

class DemoStore{
  constructor(){ this.key="crx_pos_demo_v1"; this.ls={}; this.mem=null; this.cargar();
    window.addEventListener("storage",e=>{ if(e.key===this.key){ this.cargar(); this.emitirTodo(); } }); }
  get demo(){ return true; }
  cargar(){ let d=null; try{ d=JSON.parse(localStorage.getItem(this.key)); }catch(e){} this.db=d||this.mem||semilla(); if(!d) this.guardar(); }
  guardar(){ this.mem=this.db; try{ localStorage.setItem(this.key,JSON.stringify(this.db)); }catch(e){} }
  lista(c,f=[]){ return Object.entries(this.db[c]||{}).map(([id,v])=>({id,...v})).filter(d=>f.every(([k,op,v])=>{
      const x=k.split(".").reduce((o,p)=>o?.[p],d); return op==="=="?x===v:op===">="?x>=v:op==="<="?x<=v:op==="<"?x<v:true; })); }
  emitir(c){ (this.ls[c]||[]).forEach(l=>l.cb(this.lista(c,l.f))); }
  emitirTodo(){ Object.keys(this.ls).forEach(c=>this.emitir(c)); }
  suscribir(c,cb,f=[]){ const l={cb,f}; (this.ls[c]=this.ls[c]||[]).push(l); cb(this.lista(c,f)); return ()=>{ this.ls[c]=this.ls[c].filter(x=>x!==l); }; }
  async consultar(c,f=[]){ return this.lista(c,f); }
  async agregar(c,d){ const id=rid(); (this.db[c]=this.db[c]||{})[id]=d; this.guardar(); this.emitir(c); return id; }
  async poner(c,id,d){ (this.db[c]=this.db[c]||{})[id]=d; this.guardar(); this.emitir(c); }
  async actualizar(c,id,p){ Object.assign(this.db[c][id],p); this.guardar(); this.emitir(c); }
  async borrar(c,id){ delete this.db[c][id]; this.guardar(); this.emitir(c); }
  async siguienteNumero(){ this.db._contador=(this.db._contador||0)+1; this.guardar(); return this.db._contador; }
  async necesitaConfigurar(){ return false; }
  async ingresar(u,p){ const x=this.lista("users").find(x=>x.usuario===u.toLowerCase().trim()&&x.pass===p);
    if(!x) throw new Error("Usuario o contraseña incorrectos"); if(x.activo===false) throw new Error("Usuario desactivado");
    try{ sessionStorage.setItem("crx_uid",x.id); }catch(e){} this._uid=x.id; return x; }
  async restaurar(){ let id=this._uid; try{ id=sessionStorage.getItem("crx_uid")||id; }catch(e){} const x=id&&this.db.users[id]; return x&&x.activo!==false?{id,...x}:null; }
  async salir(){ this._uid=null; try{ sessionStorage.removeItem("crx_uid"); }catch(e){} }
  async crearUsuario({usuario,pass,nombre,rol}){ usuario=usuario.toLowerCase().trim();
    if(this.lista("users").some(x=>x.usuario===usuario)) throw new Error("Ese usuario ya existe");
    return this.agregar("users",{usuario,pass,nombre,rol,activo:true}); }
  async cambiarClave(id,pass){ return this.actualizar("users",id,{pass}); }
  async reiniciarDemo(){ this.db=semilla(); this.guardar(); this.emitirTodo(); }
}

/* ===================== Capa de datos: FIREBASE (en línea) ===================== */
function cargarScript(src){ return new Promise((ok,err)=>{ const s=document.createElement("script"); s.src=src; s.onload=ok; s.onerror=()=>err(new Error("No se pudo cargar "+src)); document.head.appendChild(s); }); }
class FireStore{
  get demo(){ return false; }
  async iniciar(){
    const v="10.12.2", b=`https://www.gstatic.com/firebasejs/${v}/`;
    await cargarScript(b+"firebase-app-compat.js"); await cargarScript(b+"firebase-auth-compat.js"); await cargarScript(b+"firebase-firestore-compat.js");
    this.app=firebase.initializeApp(FIREBASE_CONFIG); this.auth=firebase.auth(); this.fs=firebase.firestore();
    try{ await this.fs.enablePersistence({synchronizeTabs:true}); }catch(e){}
  }
  // Firebase exige mínimo 6 caracteres: las claves cortas (3 a 5) se completan internamente con un sufijo fijo.
  // Las claves de 6 o más se usan tal cual (así siguen funcionando los usuarios ya creados).
  clave(p){ p=String(p||""); return p.length<6 ? p+"·CR-pos" : p; }
  correo(u){ return u.toLowerCase().trim().replace(/[^a-z0-9._-]/g,"")+"@"+DOMINIO_USUARIOS; }
  q(c,f){ let r=this.fs.collection(c); f.forEach(([k,op,v])=>r=r.where(k,op,v)); return r; }
  suscribir(c,cb,f=[]){ return this.q(c,f).onSnapshot(s=>cb(s.docs.map(d=>({id:d.id,...d.data()}))),e=>console.error(c,e)); }
  async consultar(c,f=[]){ const s=await this.q(c,f).get(); return s.docs.map(d=>({id:d.id,...d.data()})); }
  async agregar(c,d){ const r=await this.fs.collection(c).add(d); return r.id; }
  async poner(c,id,d){ await this.fs.collection(c).doc(id).set(d); }
  async actualizar(c,id,p){ await this.fs.collection(c).doc(id).update(p); }
  async borrar(c,id){ await this.fs.collection(c).doc(id).delete(); }
  async siguienteNumero(){ const ref=this.fs.collection("config").doc("contador");
    return this.fs.runTransaction(async t=>{ const s=await t.get(ref); const n=(s.exists?s.data().n:0)+1; t.set(ref,{n}); return n; }); }
  async necesitaConfigurar(){ const s=await this.fs.collection("config").doc("setup").get(); return !s.exists; }
  async configurarPrimerAdmin({usuario,pass,nombre}){
    const cred=await this.auth.createUserWithEmailAndPassword(this.correo(usuario),this.clave(pass)); const uid=cred.user.uid;
    const b=this.fs.batch();
    b.set(this.fs.collection("users").doc(uid),{usuario:usuario.toLowerCase().trim(),nombre,rol:"admin",activo:true});
    b.set(this.fs.collection("config").doc("setup"),{fecha:Date.now()});
    b.set(this.fs.collection("config").doc("negocio"),{nombre:"Casa Rosada Xuacha",nit:"",direccion:"",telefono:"",pie:"Gracias por su visita"});
    await b.commit(); return {id:uid,usuario,nombre,rol:"admin",activo:true};
  }
  async perfil(uid){ const s=await this.fs.collection("users").doc(uid).get(); return s.exists?{id:uid,...s.data()}:null; }
  async ingresar(u,p){
    let cred; try{ cred=await this.auth.signInWithEmailAndPassword(this.correo(u),this.clave(p)); }
    catch(e){ throw new Error("Usuario o contraseña incorrectos"); }
    const x=await this.perfil(cred.user.uid); if(!x||x.activo===false){ await this.auth.signOut(); throw new Error("Usuario sin acceso o desactivado"); } return x;
  }
  restaurar(){ return new Promise(res=>{ const un=this.auth.onAuthStateChanged(async u=>{ un(); if(!u) return res(null); const x=await this.perfil(u.uid); res(x&&x.activo!==false?x:null); }); }); }
  async salir(){ await this.auth.signOut(); }
  async crearUsuario({usuario,pass,nombre,rol}){
    // Se usa una segunda instancia para no cerrar la sesión del administrador
    const sec=firebase.apps.find(a=>a.name==="sec")||firebase.initializeApp(FIREBASE_CONFIG,"sec");
    const cred=await sec.auth().createUserWithEmailAndPassword(this.correo(usuario),this.clave(pass)); await sec.auth().signOut();
    await this.poner("users",cred.user.uid,{usuario:usuario.toLowerCase().trim(),nombre,rol,activo:true}); return cred.user.uid;
  }
  // Solo el administrador cambia contraseñas (la pestaña Usuarios es exclusiva del administrador).
  // Firebase no deja cambiar la clave de otro usuario desde la página sin conocer la actual,
  // por eso se pide la contraseña actual de ese usuario.
  async cambiarClave(id,pass,actual){
    if(S.yo?.rol!=="admin") throw new Error("Solo el administrador puede cambiar contraseñas");
    const x=S.usuarios.find(u=>u.id===id); if(!x) throw new Error("Usuario no encontrado");
    const sec=firebase.apps.find(a=>a.name==="sec")||firebase.initializeApp(FIREBASE_CONFIG,"sec");
    try{ const cred=await sec.auth().signInWithEmailAndPassword(this.correo(x.usuario),this.clave(actual)); await cred.user.updatePassword(this.clave(pass)); }
    catch(e){ if(String(e.code).includes("wrong-password")||String(e.code).includes("invalid-credential")||String(e.code).includes("invalid-login")) throw new Error("La contraseña actual no es correcta");
      if(String(e.code).includes("weak-password")) throw new Error("La nueva contraseña debe tener mínimo 3 caracteres"); throw e; }
    finally{ try{ await sec.auth().signOut(); }catch(e){} }
  }
}

/* ===================== Estado de la app ===================== */
const S = { db:null, yo:null, vista:null, mesas:[], productos:[], usuarios:[], negocio:{}, valesAbiertos:[], valesHoy:[],
  salon:null, ped:null, cat:null, caja:{sel:null,medio:"Efectivo",recibido:"",busca:""}, rep:{desde:null,hasta:null,datos:null},
  adm:"menudia", subs:[] };
const P = () => PERMISOS[S.yo?.rol]||{vistas:[]};
// Tickets en curso para meseros: los "enviados a caja" ya no ocupan la mesa
const enCurso = v => !v.enCaja && !v.pidioCuenta;
const valeDeMesa = mid => S.valesAbiertos.find(v=>v.mesaId===mid && enCurso(v));
const esServido = v => (v.rondaServida||0) >= (v.ronda||1);
// Tickets de versiones anteriores marcados como entregados cuentan como despachados
const rondaDesp = v => v.rondaDespachada ?? ((v.cocinaEstado==="entregado"||v.cocinaEstado==="listo")?(v.ronda||1):0);
const pendienteCocina = v => v.items.some(i=>i.cocina && i.ronda > rondaDesp(v));
const quienesAtendieron = v => [...new Set((v.despachos||[]).map(d=>d.quien))];
const verboServir = v => v.mesaId==="domicilio"||v.mesaId==="mostrador" ? "Entregado" : "Servido";
/* Cronómetro: <span class="crono" data-desde=…> se actualiza cada segundo; con data-hasta queda fijo */
function durTxt(ms){ const s=Math.max(0,Math.floor(ms/1000)), h=Math.floor(s/3600), m=Math.floor(s%3600/60), x=s%60;
  return (h?h+":"+String(m).padStart(2,"0"):m)+":"+String(x).padStart(2,"0"); }
function crono(desde,hasta){ const ms=(hasta||Date.now())-desde, min=ms/60000;
  return `<span class="crono ${hasta?"fijo":""} ${min>=25?"rojo":min>=15?"naranja":""}" data-desde="${desde}"${hasta?` data-hasta="${hasta}"`:""}>⏱ ${durTxt(ms)}</span>`; }
setInterval(()=>{ document.querySelectorAll(".crono:not(.fijo)").forEach(el=>{ const ms=Date.now()-Number(el.dataset.desde), min=ms/60000;
  el.textContent="⏱ "+durTxt(ms); el.classList.toggle("naranja",min>=15&&min<25); el.classList.toggle("rojo",min>=25); }); },1000);
const buscarVale = id => S.valesAbiertos.find(v=>v.id===id)||S.valesHoy.find(v=>v.id===id);
function ingresoDeVale(v){
  const d=new Date(v.pagoFecha||Date.now()); d.setMinutes(d.getMinutes()-d.getTimezoneOffset());
  return {tipo:"ingreso",fecha:d.toISOString().slice(0,10),valor:v.total,concepto:"Venta del restaurante",
    origen:`Ticket ${pad(v.numero)} · ${etiquetaVale(v).replace("🛵 ","")}`,responsable:"",servicio:servicioDe(v),
    medio:CUENTAS.includes(v.pago.medio)?v.pago.medio:"Efectivo",soporte:`Ticket ${pad(v.numero)}`,obs:v.pago.ref?`Ref. ${v.pago.ref}`:"",
    ejec:"ejecutado",estado:"activo",clave:`vale-${v.id}`,valeId:v.id,automatico:true,
    registradoPor:S.yo.nombre,registradoUid:S.yo.id,creado:Date.now()};
}
/* Tipo de servicio: mesa, para llevar (mostrador) o domicilio */
const SERVICIOS = {mesa:"Mesas", llevar:"Para llevar (mostrador)", domicilio:"Domicilios"};
const esLlevarMesa = mid => mid==="mostrador"||mid==="domicilio";
const servicioDeMesa = mid => mid==="domicilio"?"domicilio":mid==="mostrador"?"llevar":"mesa";
const servicioDe = v => v.servicio||servicioDeMesa(v.mesaId);
function etiquetaVale(v){
  if(v.mesaId==="domicilio") return "🛵 Domicilio"+(v.cliente?.nombre?" · "+esc(v.cliente.nombre):"");
  if(v.mesaId==="mostrador") return "Mostrador";
  return "Mesa "+esc(v.mesaNombre);
}
const precioProducto = (x,llevar) => llevar&&x.precioLlevar?x.precioLlevar:x.precio;
const totalItems = its => its.reduce((s,i)=>s+i.precio*i.cant,0);

function suscribirTodo(){
  S.subs.forEach(u=>u()); S.subs=[];
  const r=()=>render();
  S.subs.push(S.db.suscribir("mesas",d=>{S.mesas=d.sort((a,b)=>(a.orden||0)-(b.orden||0)||a.nombre.localeCompare(b.nombre,"es",{numeric:true}));r();}));
  S.subs.push(S.db.suscribir("productos",d=>{S.productos=d.sort((a,b)=>(a.orden||0)-(b.orden||0));r();}));
  S.subs.push(S.db.suscribir("users",d=>{S.usuarios=d;r();}));
  S.subs.push(S.db.suscribir("config",d=>{S.negocio=d.find(x=>x.id==="negocio")||{};r();}));
  S.subs.push(S.db.suscribir("menus",d=>{S.menus=d;r();}));
  if(S.yo.rol!=="cocina") S.subs.push(S.db.suscribir("clientes",d=>{S.clientes=d.sort((a,b)=>(b.actualizado||0)-(a.actualizado||0));}));
  let prev=null;
  S.subs.push(S.db.suscribir("vales",d=>{
    S.valesAbiertos=d;
    // aviso sonoro en cocina cuando entra un pedido nuevo
    if(S.vista==="cocina"&&prev){ const n=d.filter(v=>v.cocinaEstado==="pendiente"&&!prev.some(p=>p.id===v.id&&p.cocinaEstado==="pendiente")); if(n.length) beep(); }
    prev=d; r();
  },[["estado","==","abierto"]]));
  S.subs.push(S.db.suscribir("vales",d=>{S.valesHoy=d;r();},[["creado",">=",inicioDia()]]));
}
function beep(){ try{ const a=new (window.AudioContext||window.webkitAudioContext)(); const o=a.createOscillator(); o.connect(a.destination); o.frequency.value=880; o.start(); setTimeout(()=>{o.stop();a.close();},250); }catch(e){} }

function detalleCaja(v){

  const sello=v.estado==="pagado"?`<span class="sello">PAGADO</span>`:v.estado==="anulado"?`<span class="sello an">ANULADO</span>`:`<span class="sello ab">POR COBRAR</span>`;
  return `<div class="row"><h3 style="margin:0">Ticket ${pad(v.numero)}</h3><span class="sp"></span>${sello}</div>
  <div class="mu">${etiquetaVale(v)} · ${esc(v.meseroNombre)} · ${fecha(v.creado)}</div>${v.cliente?`<div class="mu">📞 ${esc(v.cliente.tel)} · 📍 ${esc(v.cliente.dir)}${v.cliente.ref?" · "+esc(v.cliente.ref):""}</div>`:""}
  <div class="row" style="align-items:flex-start;margin-top:8px"><div class="sp">
  ${v.items.map(i=>`<div class="it"><span class="sp">${i.cant} × ${esc(i.nombre)}${detalleItem(i)}</span><span>${money(i.precio*i.cant)}</span></div>`).join("")}</div><div id="qr-caja"></div></div>
  <div class="tot"><span>Total</span><span>${money(v.total)}</span></div>
  ${historialAtencion(v)}
  ${v.estado==="abierto"?(P().cobrar?`
    <label>Medio de pago</label><div class="row">${MEDIOS.map(m=>`<button class="sm ${c.medio===m?"pri":""}" onclick="S.caja.medio='${m}';render()">${m}</button>`).join("")}</div>
    ${c.medio==="Efectivo"?`<label>Recibido</label><input id="caja-rec" inputmode="numeric" value="${esc(c.recibido)}" oninput="S.caja.recibido=this.value;document.getElementById('cambio').textContent=accion.txtCambio(${v.total})">
      <div class="row" style="margin-top:6px">${[v.total,20000,50000,100000].filter((x,i,a)=>x>=v.total&&a.indexOf(x)===i).map(x=>`<button class="sm" onclick="S.caja.recibido='${x}';render()">${money(x)}</button>`).join("")}</div>
      <p>Cambio: <b id="cambio">${accion.txtCambio(v.total)}</b></p>`:`<label>Referencia / aprobación (opcional)</label><input id="caja-ref" placeholder="N° de aprobación o comprobante">`}
    <button class="ok" style="width:100%;margin-top:10px;font-size:17px" ${c.medio==="Efectivo"&&rec&&cambio<0?"disabled":""} onclick="accion.cobrar('${v.id}')">Confirmar pago ${money(v.total)}</button>
    <div class="row" style="margin-top:10px"><button onclick="accion.imprimir('${v.id}','vale')">🧾 Reimprimir ticket</button>${P().anular?`<span class="sp"></span><button class="dan sm" onclick="accion.anular('${v.id}')">Anular ticket</button>`:""}</div>`
    :`<p class="mu">Su rol no permite cobrar.</p>`)
  :v.estado==="pagado"?`<p>Pagado el <b>${fecha(v.pago.fecha)}</b> con <b>${esc(v.pago.medio)}</b>${v.pago.recibido?` · recibido ${money(v.pago.recibido)} · cambio ${money(v.pago.cambio)}`:""}${v.pago.ref?` · ref. ${esc(v.pago.ref)}`:""}<br>Cobró: ${esc(v.pago.cajero)}</p>
    <button onclick="accion.imprimir('${v.id}','vale')">🧾 Imprimir comprobante</button>`
  :`<p>Anulado por <b>${esc(v.anulacion?.por)}</b> el ${fecha(v.anulacion?.fecha)}.<br>Motivo: ${esc(v.anulacion?.motivo)}</p>`}`;
}

    <div class="card"><h3 style="margin-top:0">Tickets anulados</h3><table><tr><th>Ticket</th><th>Por</th><th>Motivo</th><th class="r">Valor</th></tr>

function tabla(obj,t){ const e=Object.entries(obj).sort((a,b)=>b[1].v-a[1].v);

/* ===================== MÓDULO: INGRESOS Y EGRESOS ===================== */
const hoyISO = () => { const d=new Date(); d.setMinutes(d.getMinutes()-d.getTimezoneOffset()); return d.toISOString().slice(0,10); };
const fechaCorta = iso => { const [y,m,d]=String(iso).split("-"); return `${d}/${m}/${y}`; };
const BANCOS = CUENTAS.filter(c=>c!=="Efectivo");
const CONCEPTOS = {
  ingreso:["Saldo inicial","Ventas del día","Venta de tiquetera","Abono de crédito de cliente","Evento","Arriendo espacio de la entrada","Venta de velitas","Aporte de socios","Otro ingreso"],
  egreso:["Compra de plaza (verduras y frutas)","Carnes y pollo","Abarrotes","Gas","Bebidas","Desechables","Aseo","Pago de turnos / nómina","Arriendo","Servicios públicos","Mantenimiento","Publicidad","Transporte","Otro gasto"]
};
const ORIGENES = ["Saldo inicial de la cuenta","Ventas del restaurante","Cliente","Socio / propietario","Arrendatario","Entidad / empresa","Otro"];
S.mov = { desde:null, hasta:null, datos:[], sub:null, tipo:"todos", medio:"todos", ejec:"todos", form:{tipo:"egreso", fecha:null, medio:"Efectivo", ejec:"ejecutado"}, edit:null };

// Un registro sin estado de ejecución (anteriores a este cambio) cuenta como ejecutado
const esProv = x => x.ejec==="por_ejecutar";
const vigente = x => x.estado!=="anulado";
function movSuscribir(){
  const m=S.mov; if(!m.desde){ m.desde=hoyISO(); m.hasta=hoyISO(); }
  if(m.sub) m.sub();
  // Se cargan todos los registros: el saldo de las cuentas es acumulado desde el inicio
  m.sub=S.db.suscribir("movimientos",d=>{ m.datos=d.sort((a,b)=>b.fecha.localeCompare(a.fecha)||b.creado-a.creado); if(S.vista==="movimientos") render(); });
}
function puedeEditarMov(x){ if(S.yo.rol==="admin") return true;
  return x.registradoUid===S.yo.id && (esProv(x) || new Date(x.creado).toDateString()===new Date().toDateString()); }

/* Saldos por cuenta: real (solo ejecutado) y proyectado (real + provisiones pendientes) */
function saldos(lista){
  const r={}; CUENTAS.forEach(c=>r[c]={real:0,porRecibir:0,porPagar:0});
  lista.filter(vigente).forEach(x=>{ const c=r[x.medio]; if(!c) return; const s=x.tipo==="ingreso"?1:-1;
    if(esProv(x)){ if(s>0) c.porRecibir+=x.valor; else c.porPagar+=x.valor; } else c.real+=s*x.valor; });
  CUENTAS.forEach(c=>r[c].proy=r[c].real+r[c].porRecibir-r[c].porPagar);
  const suma=(cs,k)=>cs.reduce((a,c)=>a+r[c][k],0);
  const grupo=cs=>({real:suma(cs,"real"),porRecibir:suma(cs,"porRecibir"),porPagar:suma(cs,"porPagar"),proy:suma(cs,"proy")});
  return {cta:r, bancos:grupo(BANCOS), total:grupo(CUENTAS)};
}
const neg = v => v<0?"color:var(--rojo)":"";

function vistaMovimientos(){
  const m=S.mov, f=m.form; if(!f.fecha) f.fecha=hoyISO(); if(!f.ejec) f.ejec="ejecutado";
  const hoy=hoyISO();
  const sal=saldos(m.datos);
  const enRango=m.datos.filter(x=>x.fecha>=m.desde&&x.fecha<=m.hasta);
  const lista=enRango.filter(x=>(m.tipo==="todos"||x.tipo===m.tipo)&&(m.medio==="todos"||x.medio===m.medio)&&(m.ejec==="todos"||(m.ejec==="prov")===esProv(x)));
  // El "Saldo inicial" cuenta en el saldo de las cuentas, pero no es un ingreso del período
  const vig=enRango.filter(x=>vigente(x)&&x.concepto!=="Saldo inicial"), sum=(arr,t)=>arr.filter(x=>x.tipo===t).reduce((a,x)=>a+x.valor,0);
  const ingR=sum(vig.filter(x=>!esProv(x)),"ingreso"), egrR=sum(vig.filter(x=>!esProv(x)),"egreso");
  const ingP=sum(vig.filter(esProv),"ingreso"), egrP=sum(vig.filter(esProv),"egreso");
  const pendientes=m.datos.filter(x=>vigente(x)&&esProv(x)), vencidas=pendientes.filter(x=>x.fecha<hoy);
  const nombres=[...new Set(S.usuarios.map(u=>u.nombre).concat(m.datos.map(x=>x.responsable).filter(Boolean)))];

    <td class="r" style="font-weight:700;${neg(x.proy)}">${money(x.proy)}</td></tr>`;
  return `<div class="row"><h2 style="margin:0">Ingresos y egresos</h2></div>

  <div class="grid kpis" style="margin:12px 0">
    <div class="card kpi" style="border-left:6px solid var(--rosa)"><div class="mu">Saldo real total <b>(sin provisiones)</b></div><div class="v" style="${neg(sal.total.real)}">${money(sal.total.real)}</div><div class="mu">Lo que debería haber hoy</div></div>

    <div class="card kpi" style="border-left:6px solid var(--azul)"><div class="mu">Saldo proyectado <b>(con provisiones)</b></div><div class="v" style="${neg(sal.total.proy)}">${money(sal.total.proy)}</div><div class="mu">Real + por recibir − por pagar</div></div>
  </div>
  ${vencidas.length?`<div class="banner" style="border-color:var(--cuenta)">⚠️ Hay <b>${vencidas.length}</b> provisión(es) con fecha vencida sin ejecutar por ${money(vencidas.reduce((a,x)=>a+x.valor,0))}. Revíselas en la lista con el filtro "Por ejecutar".</div>`:""}

  <div class="card" style="margin-bottom:12px"><h3 style="margin-top:0">Saldo por cuenta</h3>
    <div style="overflow-x:auto"><table style="min-width:560px"><tr><th>Cuenta</th><th class="r">Saldo real<br><span class="mu">sin provisiones</span></th><th class="r">Por recibir<br><span class="mu">ingresos provisionados</span></th><th class="r">Por pagar<br><span class="mu">gastos provisionados</span></th><th class="r">Saldo proyectado<br><span class="mu">con provisiones</span></th></tr>
    ${filaSaldo("Efectivo",sal.cta.Efectivo)}
    ${BANCOS.map(b=>filaSaldo(b,sal.cta[b])).join("")}
    ${filaSaldo("Total bancos",sal.bancos,true)}
    ${filaSaldo("TOTAL (efectivo + bancos)",sal.total,true)}</table></div>
    <p class="mu" style="margin-bottom:0">El saldo es acumulado con todos los registros desde el inicio. Para arrancar, registre un ingreso "Saldo inicial" en cada cuenta con lo que hay hoy.</p></div>

  <div class="card" style="margin-bottom:12px"><div class="row"><h3 style="margin:0">Movimiento del período</h3><span class="sp"></span>
    <label style="margin:0">Desde</label><input type="date" id="mv-d" style="width:auto" value="${m.desde}">
    <label style="margin:0">Hasta</label><input type="date" id="mv-h" style="width:auto" value="${m.hasta}">
    <button class="pri" onclick="accion.movRango()">Ver</button><button onclick="accion.movHoy()">Hoy</button><button onclick="accion.movMes()">Este mes</button></div>
    <table style="margin-top:8px"><tr><th></th><th class="r">Ingresos</th><th class="r">Egresos</th><th class="r">Saldo</th></tr>
    <tr><td><b>Real</b> (ejecutado)</td><td class="r" style="color:var(--listo)">${money(ingR)}</td><td class="r" style="color:var(--rojo)">${money(egrR)}</td><td class="r b" style="${neg(ingR-egrR)}">${money(ingR-egrR)}</td></tr>
    <tr><td><b>Provisionado</b> (por ejecutar)</td><td class="r" style="color:var(--listo)">${money(ingP)}</td><td class="r" style="color:var(--rojo)">${money(egrP)}</td><td class="r b" style="${neg(ingP-egrP)}">${money(ingP-egrP)}</td></tr>
    <tr style="background:var(--rosa3)"><td><b>Total con provisiones</b></td><td class="r b">${money(ingR+ingP)}</td><td class="r b">${money(egrR+egrP)}</td><td class="r b" style="${neg(ingR+ingP-egrR-egrP)}">${money(ingR+ingP-egrR-egrP)}</td></tr></table><p class="mu" style="margin-bottom:0">No incluye los registros de "Saldo inicial", que solo se usan para el saldo de las cuentas.</p></div>

  <div class="ped">
    <div class="card">
      <div class="row"><h3 style="margin:0">Registros del período</h3><span class="sp"></span>
        <select style="width:auto" onchange="S.mov.tipo=this.value;render()">${[["todos","Ingresos y egresos"],["ingreso","Solo ingresos"],["egreso","Solo egresos"]].map(([k,t])=>`<option value="${k}" ${m.tipo===k?"selected":""}>${t}</option>`).join("")}</select>
        <select style="width:auto" onchange="S.mov.ejec=this.value;render()">${[["todos","Ejecutados y por ejecutar"],["real","Solo ejecutados"],["prov","Solo por ejecutar"]].map(([k,t])=>`<option value="${k}" ${m.ejec===k?"selected":""}>${t}</option>`).join("")}</select>
        <select style="width:auto" onchange="S.mov.medio=this.value;render()"><option value="todos">Todas las cuentas</option>${CUENTAS.map(c=>`<option ${m.medio===c?"selected":""}>${c}</option>`).join("")}</select>
        <button class="sm" onclick="accion.movCSV()">⬇ Excel (CSV)</button></div>
      <div style="overflow-x:auto"><table style="margin-top:8px;min-width:700px"><tr><th>Fecha</th><th>Tipo</th><th>Concepto</th><th>De dónde / Responsable</th><th>Cuenta</th><th class="r">Valor</th><th></th></tr>
      ${lista.map(x=>{ const prov=esProv(x), venc=prov&&vigente(x)&&x.fecha<hoy;
        return `<tr style="${!vigente(x)?"opacity:.5":prov?"background:var(--amar)":""}">
        <td>${fechaCorta(x.fecha)}${venc?'<br><span class="dot" style="background:var(--rojo)">VENCIDA</span>':""}</td>
        <td>${x.tipo==="ingreso"?'<span class="dot">INGRESO</span>':'<span class="dot" style="background:var(--rojo)">EGRESO</span>'}
          <br>${prov?'<span class="dot" style="background:var(--cuenta)">POR EJECUTAR</span>':'<span class="mu">Ejecutado</span>'}</td>
        <td>${esc(x.concepto)}${x.soporte?`<br><span class="mu">Soporte: ${esc(x.soporte)}</span>`:""}${x.obs?`<br><span class="mu">${esc(x.obs)}</span>`:""}${x.ejecutadoPor?`<br><span class="mu">Ejecutado ${fechaCorta(x.fechaEjec||x.fecha)} por ${esc(x.ejecutadoPor)}</span>`:""}</td>
        <td>${x.tipo==="ingreso"?esc(x.origen||"—"):esc(x.responsable||"—")}<br><span class="mu">Registró: ${esc(x.registradoPor)}</span></td>
        <td>${esc(x.medio)}</td>
        <td class="r" style="white-space:nowrap;font-weight:700;color:${x.tipo==="ingreso"?"var(--listo)":"var(--rojo)"};${!vigente(x)?"text-decoration:line-through":""}${prov?";font-style:italic":""}">${x.tipo==="egreso"?"−":""}${money(x.valor)}</td>
        <td style="white-space:nowrap">${vigente(x)&&prov&&puedeEditarMov(x)?`<button class="sm ok" onclick="accion.movEjecutar('${x.id}')">✔ Ejecutar</button><br>`:""}
            ${vigente(x)&&puedeEditarMov(x)?`<button class="sm" onclick="accion.movEditar('${x.id}')">Editar</button>`:""}
            ${vigente(x)&&S.yo.rol==="admin"?`<button class="sm dan" onclick="accion.movAnular('${x.id}')">Anular</button>`:""}
            ${!vigente(x)?`<span class="dot" style="background:var(--mu)">ANULADO</span><br><span class="mu">${esc(x.anulacion?.motivo)}</span>`:""}</td></tr>`; }).join("")
        ||`<tr><td colspan="7" class="mu">No hay registros en estas fechas.</td></tr>`}</table></div>
      ${pendientes.some(x=>x.fecha<m.desde||x.fecha>m.hasta)?`<p class="mu">Hay provisiones pendientes con fechas fuera de este período: ${pendientes.filter(x=>x.fecha<m.desde||x.fecha>m.hasta).length}. Amplíe las fechas para verlas.</p>`:""}
    </div>
    <div class="card">
      <h3 style="margin-top:0">${e?"Editar registro":"Nuevo registro"}</h3>
      <div class="row">${["ingreso","egreso"].map(t=>`<button style="flex:1" class="${f.tipo===t?(t==="ingreso"?"ok":"dan"):""}" onclick="accion.movTipo('${t}')">${t==="ingreso"?"＋ Ingreso":"− Egreso"}</button>`).join("")}</div>
      <label>Estado</label>
      <div class="row">${[["ejecutado","✔ Ejecutado"],["por_ejecutar","⏳ Por ejecutar"]].map(([k,t])=>`<button style="flex:1" class="${f.ejec===k?(k==="ejecutado"?"pri":"warn"):""}" onclick="accion.movEjec('${k}')">${t}</button>`).join("")}</div>
      <div class="mu" style="margin-top:4px">${f.ejec==="ejecutado"?"El dinero ya entró o ya salió: afecta el saldo real.":"Provisión: aún no ha pasado. Solo cuenta en el saldo proyectado hasta que se ejecute."}</div>
      <label>${f.ejec==="por_ejecutar"?"Fecha esperada":"Fecha"}</label><input type="date" id="mv-fecha" value="${f.fecha}" onchange="S.mov.form.fecha=this.value;render()">
      <label>Valor (COP)</label><input id="mv-valor" oninput="S.mov.form.valor=this.value" inputmode="numeric" placeholder="Ej: 45000" value="${esc(f.valor||"")}">
      <label>Concepto</label><input id="mv-concepto" oninput="S.mov.form.concepto=this.value" list="dl-conc" placeholder="${f.tipo==="ingreso"?"Ej: Ventas del día":"Ej: Compra de plaza"}" value="${esc(f.concepto||"")}">

        :`<input id="mv-quien" oninput="S.mov.form.quien=this.value" list="dl-resp" placeholder="Quién hace o autoriza el gasto" value="${esc(f.quien||"")}"><datalist id="dl-resp">${nombres.map(n=>`<option value="${esc(n)}">`).join("")}</datalist>`}
      <label>${f.tipo==="ingreso"?"¿A qué cuenta entra?":"¿De qué cuenta sale?"}</label>
      <div class="row">${CUENTAS.map(c=>`<button class="sm ${f.medio===c?"pri":""}" onclick="accion.movMedio('${c}')">${c}</button>`).join("")}</div>
      <label>N° de factura o soporte (opcional)</label><input id="mv-sop" oninput="S.mov.form.soporte=this.value" value="${esc(f.soporte||"")}">
      <label>Observaciones (opcional)</label><input id="mv-obs" oninput="S.mov.form.obs=this.value" value="${esc(f.obs||"")}">
      <div id="mv-err" style="color:var(--rojo);font-size:13px;margin-top:6px"></div>
      <button class="${f.tipo==="ingreso"?"ok":"dan"}" style="width:100%;margin-top:12px;font-size:16px" onclick="accion.movGuardar()">${e?"Guardar cambios":(f.ejec==="por_ejecutar"?"Provisionar ":"Registrar ")+(f.tipo==="ingreso"?"ingreso":"egreso")}</button>
      ${e?`<button style="width:100%;margin-top:8px" onclick="accion.movCancelar()">Cancelar edición</button>`:""}
      <hr style="border:0;border-top:1px solid var(--ln);margin:16px 0">
      <div class="mu">Cada cobro en caja se registra solo como ingreso en su cuenta. Si alguno quedó sin registrar (por ejemplo, por falla de internet), este botón lo completa sin duplicar.</div>
      <button style="width:100%;margin-top:8px" onclick="accion.movTraerVentas()">↻ Sincronizar ventas del ${fechaCorta(f.fecha)}</button>
    </div>
  </div>`;
}
function movLimpiar(){ const f=S.mov.form; S.mov.form={tipo:f.tipo,fecha:f.fecha,medio:f.medio,ejec:f.ejec}; S.mov.edit=null; }

Object.assign(accion,{
  movRango(){ S.mov.desde=$("#mv-d").value||hoyISO(); S.mov.hasta=$("#mv-h").value||S.mov.desde; if(S.mov.hasta<S.mov.desde) S.mov.hasta=S.mov.desde; render(); },
  movHoy(){ S.mov.desde=S.mov.hasta=hoyISO(); render(); },
  movMes(){ const h=hoyISO(); S.mov.desde=h.slice(0,8)+"01"; const d=new Date(+h.slice(0,4),+h.slice(5,7),0); S.mov.hasta=h.slice(0,8)+String(d.getDate()).padStart(2,"0"); render(); },
  movTipo(t){ if(S.mov.form.tipo!==t){ S.mov.form.tipo=t; S.mov.form.concepto=""; S.mov.form.quien=""; } render(); },
  movMedio(c){ S.mov.form.medio=c; render(); },
  movEjec(k){ S.mov.form.ejec=k; render(); },
  async movGuardar(){
    const f=S.mov.form, err=$("#mv-err"); const valor=Number(String(f.valor||"").replace(/\D/g,""))||0;
    if(!valor) return err.textContent="Escriba el valor";
    if(!(f.concepto||"").trim()) return err.textContent="Escriba el concepto";
    if(!(f.quien||"").trim()) return err.textContent=f.tipo==="ingreso"?"Indique de dónde viene el ingreso":"Indique el responsable del gasto";
    const d={tipo:f.tipo,fecha:f.fecha,valor,concepto:f.concepto.trim(),medio:f.medio,soporte:(f.soporte||"").trim(),obs:(f.obs||"").trim(),ejec:f.ejec,
      origen:f.tipo==="ingreso"?f.quien.trim():"",responsable:f.tipo==="egreso"?f.quien.trim():""};
    try{
      if(S.mov.edit){ await S.db.actualizar("movimientos",S.mov.edit,{...d,editadoPor:S.yo.nombre,editado:Date.now()}); toast("Registro actualizado"); }
      else { await S.db.agregar("movimientos",{...d,estado:"activo",registradoPor:S.yo.nombre,registradoUid:S.yo.id,creado:Date.now()});
        toast(`${f.ejec==="por_ejecutar"?"Provisión":f.tipo==="ingreso"?"Ingreso":"Egreso"} de ${money(valor)} registrado`); }
      if(f.fecha<S.mov.desde||f.fecha>S.mov.hasta){ if(f.fecha<S.mov.desde) S.mov.desde=f.fecha; else S.mov.hasta=f.fecha; }
      movLimpiar(); render();
    }catch(e){ err.textContent="Error: "+e.message; }
  },
  movEditar(id){ const x=S.mov.datos.find(y=>y.id===id); S.mov.edit=id;
    S.mov.form={tipo:x.tipo,fecha:x.fecha,valor:String(x.valor),concepto:x.concepto,quien:x.tipo==="ingreso"?x.origen:x.responsable,medio:x.medio,soporte:x.soporte,obs:x.obs,ejec:x.ejec||"ejecutado"};
    render(); window.scrollTo({top:document.querySelector(".ped")?.offsetTop||0,behavior:"smooth"}); },
  movCancelar(){ movLimpiar(); render(); },
  movEjecutar(id){
    const x=S.mov.datos.find(y=>y.id===id);
    modal(`<h3 style="margin-top:0">Ejecutar ${x.tipo==="ingreso"?"ingreso":"gasto"} provisionado</h3>
      <p><b>${esc(x.concepto)}</b><br><span class="mu">Provisionado: ${money(x.valor)} · ${esc(x.medio)} · ${fechaCorta(x.fecha)}</span></p>
      <label>Fecha en que ${x.tipo==="ingreso"?"entró":"salió"} el dinero</label><input type="date" id="ej-f" value="${hoyISO()}">
      <label>Valor real (puede ser distinto al provisionado)</label><input id="ej-v" inputmode="numeric" value="${x.valor}">
      <label>Cuenta</label><select id="ej-c">${CUENTAS.map(c=>`<option ${c===x.medio?"selected":""}>${c}</option>`).join("")}</select>
      <label>N° de factura o soporte (opcional)</label><input id="ej-s" value="${esc(x.soporte||"")}">
      <div class="row" style="margin-top:14px"><span class="sp"></span><button id="ej-x">Cancelar</button><button class="ok" id="ej-ok">✔ Marcar como ejecutado</button></div>`);
    $("#ej-x").onclick=cerrarModal;
    $("#ej-ok").onclick=async()=>{ const v=Number($("#ej-v").value.replace(/\D/g,""))||0; if(!v) return toast("Escriba el valor");
      const p={ejec:"ejecutado",fecha:$("#ej-f").value||hoyISO(),fechaEjec:$("#ej-f").value||hoyISO(),valor:v,medio:$("#ej-c").value,soporte:$("#ej-s").value.trim(),
        valorProvisionado:x.valor,fechaProvisionada:x.fecha,ejecutadoPor:S.yo.nombre,editado:Date.now()};
      cerrarModal(); await S.db.actualizar("movimientos",id,p);
      if(p.fecha<S.mov.desde) S.mov.desde=p.fecha; if(p.fecha>S.mov.hasta) S.mov.hasta=p.fecha;
      toast(`Ejecutado: ${money(v)} ${x.tipo==="ingreso"?"entró a":"salió de"} ${p.medio}`); render(); };
  },
  async movAnular(id){ const x=S.mov.datos.find(y=>y.id===id);
    const mot=await pedirTexto(`Anular ${x.tipo} "${x.concepto}" por ${money(x.valor)}. Motivo:`); if(!mot) return;
    await S.db.actualizar("movimientos",id,{estado:"anulado",anulacion:{motivo:mot,por:S.yo.nombre,fecha:Date.now()}}); toast("Registro anulado"); },
  async movTraerVentas(){
    // Cada cobro ya crea su ingreso. Esto solo completa los tickets pagados ese día que no lo tengan (por ejemplo, si falló internet).
    const fe=S.mov.form.fecha; const d0=new Date(fe+"T00:00:00").getTime(), d1=d0+86400000;
    const vales=(await S.db.consultar("vales",[["pagoFecha",">=",d0],["pagoFecha","<",d1]])).filter(v=>v.estado==="pagado");
    if(!vales.length) return toast("No hay tickets pagados el "+fechaCorta(fe));
    const movs=S.mov.datos.filter(m=>vigente(m));
    const legado=new Set(movs.filter(m=>m.fecha===fe&&String(m.clave||"").startsWith("ventas-")).map(m=>m.medio)); // registros agrupados de versiones anteriores
    let n=0;
    for(const v of vales){
      if(movs.some(m=>m.clave===`vale-${v.id}`)) continue;
      const cta=CUENTAS.includes(v.pago.medio)?v.pago.medio:"Efectivo"; if(legado.has(cta)) continue;
      await S.db.agregar("movimientos",ingresoDeVale(v)); n++;
    }
    if(fe<S.mov.desde) S.mov.desde=fe; if(fe>S.mov.hasta) S.mov.hasta=fe;
    toast(n?`${n} venta(s) del ${fechaCorta(fe)} registradas como ingreso`:"Todas las ventas de ese día ya estaban registradas"); render();
  },
  movCSV(){
    const sel=S.mov.datos.filter(x=>x.fecha>=S.mov.desde&&x.fecha<=S.mov.hasta);
    const filas=[["Fecha","Tipo","Estado","Concepto","De dónde viene","Responsable","Cuenta","Valor","Soporte","Observaciones","Registro","Registró"]]
      .concat(sel.map(x=>[x.fecha,x.tipo,esProv(x)?"Por ejecutar":"Ejecutado",x.concepto,x.origen||"",x.responsable||"",x.medio,x.tipo==="egreso"?-x.valor:x.valor,x.soporte||"",x.obs||"",x.estado,x.registradoPor]));
    const csv="﻿"+filas.map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(";")).join("\r\n");
    try{ const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));
      a.download=`ingresos_egresos_${S.mov.desde}_a_${S.mov.hasta}.csv`; document.body.appendChild(a); a.click(); a.remove(); }catch(e){}
    if(S.db.demo) toast("Si no se descargó, es por el modo demo: en la versión instalada sí descarga.");
  },
});

/* ===================== MÓDULO: MENÚ DEL DÍA ===================== */
// Estructura: proteínas (cada una con su precio), acompañamientos (cada uno se puede pedir normal, sin, o cambiado por huevo)
// y sopa/postre del día (varias opciones, con fruta como reemplazo).
const sumarDias = (iso,n) => { const d=new Date(iso+"T12:00:00"); d.setDate(d.getDate()+n); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); };
const diaSemana = iso => new Date(iso+"T12:00:00").getDay(); // 0 = domingo
const lunesDe = iso => sumarDias(iso, -((diaSemana(iso)+6)%7));
const siguienteLaboral = iso => { let f=sumarDias(iso,1); if(diaSemana(f)===0) f=sumarDias(f,1); return f; };
const mananaISO = () => { const d=new Date(); d.setDate(d.getDate()+1); d.setMinutes(d.getMinutes()-d.getTimezoneOffset()); return d.toISOString().slice(0,10); };
const DIAS = ["domingo","lunes","martes","miércoles","jueves","viernes","sábado"];
const fechaLarga = iso => { const d=new Date(iso+"T12:00:00"); const t=`${DIAS[d.getDay()]} ${d.getDate()} de ${d.toLocaleString("es-CO",{month:"long"})}`; return t[0].toUpperCase()+t.slice(1); };
const menuDe = f => S.menus.find(m=>m.id===f);
const menuActivo = m => m && m.publicado!==false && !m.anulado;
const menuHoy = () => { const m=menuDe(hoyISO()); return menuActivo(m)?m:null; };
S.menus=[]; S.mdia={fecha:null, borrador:null}; S.alm=null;

const pLlevar = p => p.precioLlevar||p.precio;
const SIN_SOPA = "Sin";
const opcionesSopa = m => (m.sopas.length||m.fruta) ? m.sopas.concat(m.fruta?["Fruta"]:[]).concat([SIN_SOPA]) : [];
function resumenMenu(m){
  return `<b>${m.proteinas.map(p=>esc(p.nombre)).join(" o ")}</b>, con ${m.acompanamientos.map(esc).join(", ")}.
    ${m.sopas.length?`<br>${m.sopas.map(esc).join(" o ")}${m.fruta?" (o fruta)":""}`:m.fruta?"<br>Fruta":""}`;
}
function tarjetaMenuHoy(){
  const m=menuHoy();
  return m?`<div class="card" style="margin-bottom:12px;border-left:6px solid var(--rosa)"><div class="mu">🍽 Menú de hoy · ${fechaLarga(m.id)}</div><div style="margin-top:4px">${resumenMenu(m)}</div></div>`
          :`<div class="banner">🍽 No hay menú del día definido para hoy.${S.yo.rol==="admin"?" Créelo en Administración → Menú del día.":""}</div>`;
}
const nAlm = () => S.ped ? S.ped.nuevos.filter(i=>String(i.pid).startsWith("alm-")).reduce((s,i)=>s+i.cant,0) + ((S.ped.valeId&&buscarVale(S.ped.valeId)?.items)||[]).filter(i=>String(i.pid).startsWith("alm-")).reduce((s,i)=>s+i.cant,0) : 0;
function botonAlmuerzo(){
  const m=menuHoy();
  if(!m) return `<div class="banner" style="margin-bottom:10px">No hay menú del día definido para hoy.</div>`;
  return `<button class="pri" style="width:100%;margin-bottom:10px;padding:14px;font-size:16px;text-align:left" onclick="accion.almAbrir()">
    🍽 <b>${nAlm()?"Agregar otro almuerzo":"Almuerzo del día"}</b>${nAlm()?` <span class="dot" style="background:#fff;color:var(--rosa)">${nAlm()} en el ticket</span>`:""}<br><span style="font-size:13px;opacity:.9">${m.proteinas.map(p=>`${esc(p.nombre)} ${money(p.precio)} · llevar ${money(pLlevar(p))}`).join("<br>")}</span></button>`;
}
/* Detalle de un ítem (para ticket, cocina y caja) */
const detalleItem = (i,cls="mu") => i.detalle?`<br><span class="${cls}">${esc(i.detalle)}</span>`:"";

/* ---- Armado del almuerzo (mesero) ---- */
function modalAlmuerzo(){
  const m=menuHoy(), a=S.alm; if(!m||!a) return;
  const opsSopa=opcionesSopa(m);
  const pm=S.ped.mesaId, mesaFija=!esLlevarMesa(pm), esDomi=pm==="domicilio";
  const mesaBloque = esDomi ? "" : mesaFija
    ? `<div class="mu" style="margin-bottom:6px">Mesa: <b style="color:var(--tx)">${esc(S.ped.mesaNombre)}</b></div>`
    : (!a.llevar ? (S.ped.valeId
        ? `<div class="banner" style="margin:8px 0">Este pedido ya es de mostrador. Para servirlo en una mesa, ábralo desde la mesa en la pantalla de Mesas.</div>`
        : `<label>Número de mesa <span style="color:var(--rojo)">*</span></label><div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(64px,1fr))">${S.mesas.map(x=>`<button class="${a.mesaSel===x.id?"pri":""}" onclick="S.alm.mesaSel='${x.id}';modalAlmuerzo()">${esc(x.nombre)}</button>`).join("")}</div>`) : "");
  modal(`<h3 style="margin-top:0">🍽 Almuerzo del día</h3>
    <div class="row">${[[false,"🍽 Para la mesa"],[true,"🥡 Para llevar"]].filter(([v])=>!(esDomi&&!v)).map(([v,t])=>`<button style="flex:1" class="${a.llevar===v?(v?"az":"pri"):""}" onclick="S.alm.llevar=${v};modalAlmuerzo()">${t}</button>`).join("")}</div>
    ${mesaBloque}
    <label>Proteína</label><div class="grid" style="grid-template-columns:1fr 1fr">${m.proteinas.map((p,k)=>`<button class="${a.prot===k?"pri":""}" onclick="S.alm.prot=${k};modalAlmuerzo()">${esc(p.nombre)}<br><b>${money(a.llevar?pLlevar(p):p.precio)}</b></button>`).join("")}</div>
    ${opsSopa.length?`<label>Sopa / postre</label><div class="row">${opsSopa.map((o,k)=>`<button class="sm ${a.sopa===o?(o===SIN_SOPA?"dan":"pri"):""}" onclick="S.alm.sopa=${JSON.stringify(o).replace(/"/g,"&quot;")};modalAlmuerzo()">${esc(o)}</button>`).join("")}</div>`:""}
    <label>Acompañamientos</label>
    ${m.acompanamientos.map((ac,k)=>{ const st=a.acomp[k]||"con";
      return `<div class="row" style="justify-content:space-between;padding:5px 0;border-bottom:1px dashed var(--ln)"><span>${esc(ac)}</span><span class="row" style="gap:4px">
        ${[["con","Normal"],["sin","Sin"],["huevo","Huevo"]].map(([v,t])=>`<button class="sm ${st===v?(v==="con"?"ok":v==="sin"?"dan":"warn"):""}" onclick="S.alm.acomp[${k}]='${v}';modalAlmuerzo()">${t}</button>`).join("")}</span></div>`; }).join("")}
    <label>Cantidad</label><div class="row"><button onclick="S.alm.cant=Math.max(1,S.alm.cant-1);modalAlmuerzo()">−</button><b style="font-size:18px;min-width:30px;text-align:center">${a.cant}</b><button onclick="S.alm.cant++;modalAlmuerzo()">+</button></div>
    <label>Nota para cocina (opcional)</label><input id="alm-nota" value="${esc(a.nota)}" oninput="S.alm.nota=this.value" placeholder="Ej: término medio, sin sal">
    <div id="alm-err" style="color:var(--rojo);font-size:13px;margin-top:6px"></div>
    <div class="row" style="margin-top:12px"><span class="sp"></span><button onclick="cerrarModal();S.alm=null">Cancelar</button>
      <button onclick="accion.almAgregar(true)">＋ Agregar y armar otro</button>
      <button class="pri" onclick="accion.almAgregar()">Agregar ${a.prot!=null?money((a.llevar?pLlevar(m.proteinas[a.prot]):m.proteinas[a.prot].precio)*a.cant):""}</button></div>`);
}

/* ---- Administración: definir el menú ---- */
function admMenuDia(){
  const d=S.mdia; if(!d.fecha) d.fecha=siguienteLaboral(hoyISO()); if(!d.semana) d.semana=lunesDe(d.fecha);
  if(!d.borrador||d.borrador._fecha!==d.fecha){
    const m=menuDe(d.fecha);
    d.borrador=m?{_fecha:d.fecha,anulado:!!m.anulado||m.publicado===false,proteinas:m.proteinas.map(p=>({...p})),acompanamientos:[...m.acompanamientos],sopas:[...m.sopas],fruta:m.fruta!==false,existe:true}
               :{_fecha:d.fecha,proteinas:[{nombre:"",precio:"",precioLlevar:""},{nombre:"",precio:"",precioLlevar:""}],acompanamientos:[],sopas:["",""],fruta:true,existe:false};
  }
  const b=d.borrador, hoy=hoyISO();
  return `<div class="ped"><div class="card">
    <div class="row"><h3 style="margin:0">Menú del día</h3><span class="sp"></span>
      <input type="date" style="width:auto" value="${d.fecha}" onchange="S.mdia.fecha=this.value;S.mdia.semana=lunesDe(this.value);S.mdia.borrador=null;render()"></div>
    <div class="mu" style="margin:4px 0 8px">${fechaLarga(d.fecha)} ${b.existe?(b.anulado?'· <b style="color:var(--rojo)">ANULADO</b> (al publicar se reactiva)':"· <b>ya definido</b> (está editando)"):"· nuevo"}${diaSemana(d.fecha)===0?' · <b style="color:var(--azul)">domingo: solo eventos</b>':""}</div>
    <label>Proteínas y precios del almuerzo</label>
    <div class="row mu" style="font-size:12px;margin-bottom:2px"><span style="flex:2;min-width:140px">Plato</span><span style="flex:1;min-width:80px">Precio mesa</span><span style="flex:1;min-width:80px">Para llevar</span><span style="width:34px"></span></div>
    ${b.proteinas.map((p,k)=>`<div class="row" style="margin-bottom:6px"><input style="flex:2;min-width:140px" placeholder="Ej: Pechuga a la plancha" value="${esc(p.nombre)}" oninput="S.mdia.borrador.proteinas[${k}].nombre=this.value">
      <input style="flex:1;min-width:80px" inputmode="numeric" placeholder="Mesa" value="${esc(p.precio)}" oninput="S.mdia.borrador.proteinas[${k}].precio=this.value">
      <input style="flex:1;min-width:80px" inputmode="numeric" placeholder="Llevar" value="${esc(p.precioLlevar??"")}" oninput="S.mdia.borrador.proteinas[${k}].precioLlevar=this.value">
      <button class="sm dan" onclick="S.mdia.borrador.proteinas.splice(${k},1);render()">✕</button></div>`).join("")}
    <button class="sm" onclick="S.mdia.borrador.proteinas.push({nombre:'',precio:S.mdia.borrador.proteinas[0]?.precio||'',precioLlevar:S.mdia.borrador.proteinas[0]?.precioLlevar||''});render()">＋ Proteína</button>
    <label>Acompañamientos <span class="mu">(el cliente puede pedirlos normal, sin, o cambiarlos por huevo)</span></label>
    <div class="row">${b.acompanamientos.map((a,k)=>`<span class="dot" style="background:var(--rosa3);color:var(--tx);font-size:13px;padding:5px 10px">${esc(a)} <a href="#" onclick="S.mdia.borrador.acompanamientos.splice(${k},1);render();return false" style="color:var(--rojo);text-decoration:none">✕</a></span>`).join("")}</div>
    <form class="row" style="margin-top:6px" onsubmit="event.preventDefault();accion.mdAcomp()"><input id="md-acomp" style="flex:1" placeholder="Ej: Arroz (Enter para agregar)"><button class="sm">＋ Agregar</button></form>
    <div class="row" style="margin-top:4px">${["Arroz","Papa","Plátano","Ensalada","Frijoles","Yuca","Arepa"].filter(x=>!b.acompanamientos.includes(x)).map(x=>`<button class="sm" onclick="S.mdia.borrador.acompanamientos.push('${x}');render()">+ ${x}</button>`).join("")}</div>
    <label>Sopa / postre del día</label>
    ${b.sopas.map((s,k)=>`<div class="row" style="margin-bottom:6px"><input style="flex:1" placeholder="${k===0?"Ej: Sopa de plátano":"Ej: Arroz con leche"}" value="${esc(s)}" oninput="S.mdia.borrador.sopas[${k}]=this.value"><button class="sm dan" onclick="S.mdia.borrador.sopas.splice(${k},1);render()">✕</button></div>`).join("")}
    <button class="sm" onclick="S.mdia.borrador.sopas.push('');render()">＋ Opción</button>
    <label style="margin-top:10px"><input type="checkbox" style="width:auto" ${b.fruta?"checked":""} onchange="S.mdia.borrador.fruta=this.checked"> Ofrecer <b>fruta</b> como reemplazo de la sopa / postre</label>
    <div id="md-err" style="color:var(--rojo);font-size:13px;margin-top:6px"></div>
    <div class="row" style="margin-top:12px"><button onclick="accion.mdCopiar()">Copiar el último menú</button><span class="sp"></span>
      <button class="pri" onclick="accion.mdGuardar()">${b.existe?(b.anulado?"Reactivar y publicar":"Guardar cambios"):"Publicar menú"}</button></div>
  </div>
  ${semanaMenus()}</div>`;
}

Object.assign(accion,{
  almAbrir(){ const m=menuHoy(); if(!m) return; S.alm={prot:m.proteinas.length===1?0:null,sopa:null,acomp:{},cant:1,nota:"",llevar:esLlevarMesa(S.ped.mesaId)}; modalAlmuerzo(); },
  almAgregar(otro){
    const m=menuHoy(), a=S.alm; const err=$("#alm-err");
    if(a.prot==null) return err.textContent="Elija la proteína";
    const opsSopa=opcionesSopa(m); if(opsSopa.length&&!a.sopa) return err.textContent="Elija la sopa / postre, fruta o «Sin»";
    // Para la mesa: el número de mesa es obligatorio
    if(!a.llevar&&esLlevarMesa(S.ped.mesaId)){
      if(S.ped.valeId) return err.textContent="Este pedido es de mostrador: elija «Para llevar» o ábralo desde la mesa";
      if(!a.mesaSel) return err.textContent="Elija el número de mesa";
      const mx=S.mesas.find(x=>x.id===a.mesaSel), vx=valeDeMesa(mx.id);
      Object.assign(S.ped,{mesaId:mx.id,mesaNombre:mx.nombre,valeId:vx?.id||null});
    }
    const p=m.proteinas[a.prot];
    const cambios=m.acompanamientos.map((ac,k)=>a.acomp[k]==="sin"?`SIN ${ac.toLowerCase()}`:a.acomp[k]==="huevo"?`${ac} → HUEVO`:null).filter(Boolean);
    const detalle=[a.sopa===SIN_SOPA?"SIN sopa ni fruta":a.sopa, cambios.length?cambios.join(", "):"Acompañamientos completos"].filter(Boolean).join(" · ");
    S.ped.nuevos.push({pid:"alm-"+rid(),nombre:"Almuerzo – "+p.nombre+(a.llevar&&!esLlevarMesa(S.ped.mesaId)?" (para llevar)":""),precio:Number(a.llevar?pLlevar(p):p.precio)||0,cant:a.cant,nota:(a.nota||"").trim(),detalle,cocina:true,llevar:!!a.llevar,menu:m.id});
    const n=S.ped.nuevos.filter(i=>String(i.pid).startsWith("alm-")).reduce((s,i)=>s+i.cant,0);
    if(otro){ S.alm={prot:m.proteinas.length===1?0:null,sopa:null,acomp:{},cant:1,nota:"",llevar:a.llevar,mesaSel:a.mesaSel}; render(); modalAlmuerzo(); toast(`Almuerzo agregado (${n} en el ticket). Arme el siguiente.`); return; }
    S.alm=null; cerrarModal(); render(); toast(`Almuerzo agregado · ${n} almuerzo(s) en el ticket`);
  },
  mdAcomp(){ const i=$("#md-acomp"), v=i.value.trim(); if(!v) return; const b=S.mdia.borrador; if(!b.acompanamientos.includes(v)) b.acompanamientos.push(v); render(); setTimeout(()=>$("#md-acomp")?.focus(),0); },
  mdCopiar(){ const ult=[...S.menus].filter(m=>m.id!==S.mdia.fecha&&menuActivo(m)&&m.id<S.mdia.fecha).sort((x,y)=>y.id.localeCompare(x.id))[0]||[...S.menus].filter(m=>m.id!==S.mdia.fecha&&menuActivo(m)).sort((x,y)=>y.id.localeCompare(x.id))[0];
    if(!ult) return toast("No hay un menú anterior para copiar");
    Object.assign(S.mdia.borrador,{proteinas:ult.proteinas.map(p=>({...p})),acompanamientos:[...ult.acompanamientos],sopas:[...ult.sopas],fruta:ult.fruta!==false});
    toast("Copiado el menú del "+fechaCorta(ult.id)+". Ajústelo y publíquelo."); render(); },
  async mdGuardar(){
    const b=S.mdia.borrador, err=$("#md-err");
    const num=v=>Number(String(v??"").replace(/\D/g,""))||0;
    const proteinas=b.proteinas.map(p=>({nombre:String(p.nombre).trim(),precio:num(p.precio),precioLlevar:num(p.precioLlevar)})).filter(p=>p.nombre);
    if(!proteinas.length) return err.textContent="Agregue al menos una proteína";
    if(proteinas.some(p=>!p.precio)) return err.textContent="Escriba el precio en mesa de cada plato";
    if(proteinas.some(p=>!p.precioLlevar)) return err.textContent="Escriba el precio para llevar de cada plato";
    const d={fecha:S.mdia.fecha,proteinas,acompanamientos:b.acompanamientos.map(s=>s.trim()).filter(Boolean),sopas:b.sopas.map(s=>String(s).trim()).filter(Boolean),fruta:!!b.fruta,
      publicado:true,anulado:null,actualizadoPor:S.yo.nombre,actualizado:Date.now()};
    try{ await S.db.poner("menus",S.mdia.fecha,d); S.mdia.borrador=null; S.mdia.semana=lunesDe(S.mdia.fecha); toast(`Menú del ${fechaLarga(d.fecha)} publicado`); render(); }
    catch(e){ err.textContent="Error: "+e.message; }
  },
});


/* ---- Menú: histórico semanal (lunes a sábado; domingo solo eventos) ---- */
function semanaMenus(){
  const d=S.mdia, hoy=hoyISO(), lun=d.semana, sab=sumarDias(lun,5), dom=sumarDias(lun,6);
  const dias=[0,1,2,3,4,5].map(k=>sumarDias(lun,k)); if(menuDe(dom)) dias.push(dom);
  const mes=iso=>new Date(iso+"T12:00:00").toLocaleString("es-CO",{month:"short"}).replace(".","");
  const nPub=dias.filter(f=>menuActivo(menuDe(f))).length;
  return `<div class="card"><div class="row"><h3 style="margin:0">Semana</h3><span class="sp"></span>
      <button class="sm" onclick="S.mdia.semana=sumarDias(S.mdia.semana,-7);render()">◀</button>
      <button class="sm" onclick="S.mdia.semana=lunesDe(hoyISO());render()">Esta semana</button>
      <button class="sm" onclick="S.mdia.semana=sumarDias(S.mdia.semana,7);render()">▶</button></div>
    <div class="mu" style="margin:4px 0 8px">Lunes ${new Date(lun+"T12:00:00").getDate()} ${mes(lun)} a sábado ${new Date(sab+"T12:00:00").getDate()} ${mes(sab)} · ${nPub} de 6 días con menú</div>
    ${dias.map(f=>{ const m=menuDe(f), act=menuActivo(m), anul=m&&!act, sel=f===d.fecha;
      const chip=act?'<span class="dot">PUBLICADO</span>':anul?'<span class="dot" style="background:var(--rojo)">ANULADO</span>':'<span class="dot" style="background:var(--mu)">SIN MENÚ</span>';
      return `<div class="it" style="align-items:flex-start;${sel?"background:var(--rosa3);border-radius:8px;padding:8px;":""}${anul?"opacity:.7;":""}">
        <span class="sp"><b>${f===hoy?"Hoy · ":""}${fechaLarga(f)}</b> ${chip}${diaSemana(f)===0?' <span class="dot" style="background:var(--azul)">EVENTO</span>':""}
          ${m?`<br><span style="font-size:13px;${anul?"text-decoration:line-through":""}">${resumenMenu(m)}</span><br><span class="mu">${m.proteinas.map(p=>`${esc(p.nombre)}: mesa ${money(p.precio)} · llevar ${money(pLlevar(p))}`).join(" | ")}</span>`:""}
          ${anul&&m.anulado?`<br><span class="mu">Anulado por ${esc(m.anulado.por)}: ${esc(m.anulado.motivo)}</span>`:""}</span>
        <span class="row" style="gap:4px;justify-content:flex-end;max-width:150px">
          ${m?`<button class="sm" onclick="accion.mdEditar('${f}')">${anul?"Reactivar":"Editar"}</button><button class="sm" onclick="accion.mdCopiarA('${f}')">Copiar</button>${act?`<button class="sm dan" onclick="accion.mdAnular('${f}')">Anular</button>`:""}`
             :`<button class="sm pri" onclick="accion.mdEditar('${f}')">Crear</button>`}</span></div>`; }).join("")}
    ${menuDe(dom)?"":`<button class="sm" style="margin-top:8px" onclick="accion.mdEditar('${dom}')">＋ Menú para el domingo (evento)</button>`}
  </div>`;
}
Object.assign(accion,{
  mdEditar(f){ S.mdia.fecha=f; S.mdia.borrador=null; render(); window.scrollTo({top:0,behavior:"smooth"}); },
  mdCopiarA(origen){
    const m=menuDe(origen); const sug=(()=>{ let f=siguienteLaboral(origen); for(let k=0;k<14&&menuActivo(menuDe(f));k++) f=siguienteLaboral(f); return f; })();
    modal(`<h3 style="margin-top:0">Copiar menú</h3><p>Copiar el menú del <b>${fechaLarga(origen)}</b> a la fecha:</p>
      <input type="date" id="cp-f" value="${sug}"><div id="cp-aviso" class="mu" style="margin-top:6px"></div>
      <p class="mu">Se abre en el formulario para que lo revise y lo publique.</p>
      <div class="row"><span class="sp"></span><button id="cp-x">Cancelar</button><button class="pri" id="cp-ok">Copiar</button></div>`);
    const av=()=>{ const f=$("#cp-f").value; $("#cp-aviso").innerHTML=(diaSemana(f)===0?"Domingo: solo para eventos. ":"")+(menuActivo(menuDe(f))?"<b>Esa fecha ya tiene menú: se reemplazará al publicar.</b>":""); };
    $("#cp-f").onchange=av; av(); $("#cp-x").onclick=cerrarModal;
    $("#cp-ok").onclick=()=>{ const f=$("#cp-f").value; if(!f) return; cerrarModal();
      S.mdia.fecha=f; S.mdia.semana=lunesDe(f); S.mdia.borrador={_fecha:f,proteinas:m.proteinas.map(p=>({...p})),acompanamientos:[...m.acompanamientos],sopas:[...m.sopas],fruta:m.fruta!==false,existe:!!menuDe(f),anulado:false};
      toast("Menú copiado. Revíselo y presione Publicar."); render(); window.scrollTo({top:0,behavior:"smooth"}); };
  },
  async mdAnular(f){
    const mot=await pedirTexto(`Anular el menú del ${fechaLarga(f)}. Los meseros dejarán de verlo. Motivo:`); if(!mot) return;
    await S.db.actualizar("menus",f,{publicado:false,anulado:{motivo:mot,por:S.yo.nombre,fecha:Date.now()},actualizado:Date.now()});
    if(S.mdia.fecha===f) S.mdia.borrador=null; toast("Menú anulado"); render();
  },
});

/* ===================== MÓDULO: DOMICILIOS ===================== */
S.clientes=[];
function guardarCliente(c){
  const tel=String(c.tel||"").replace(/\D/g,""); if(!tel) return;
  S.db.poner("clientes",tel,{tel,nombre:c.nombre,dir:c.dir,ref:c.ref||"",autoriza:true,actualizado:Date.now(),actualizadoPor:S.yo.nombre}).catch(()=>{});
}
function modalCliente(titulo,c,alGuardar){
  const tels=S.clientes.map(x=>x.tel);
  modal(`<h3 style="margin-top:0">${titulo}</h3>

    <label>Dirección</label><input id="cl-dir" value="${esc(c.dir||"")}" placeholder="Ej: Cra 7 # 22-41">
    <label>Barrio / indicaciones (opcional)</label><input id="cl-ref" value="${esc(c.ref||"")}" placeholder="Ej: San Mateo, casa esquinera">
    ${c.envio!==undefined?`<label>Valor del domicilio / envío (opcional)</label><input id="cl-env" inputmode="numeric" value="${esc(c.envio||"")}" placeholder="0">`:""}
    <label style="margin-top:10px"><input type="checkbox" id="cl-aut" style="width:auto" ${c.autoriza?"checked":""}> El cliente autoriza guardar sus datos para futuros pedidos (Ley 1581 de 2012)</label>
    <div id="cl-err" style="color:var(--rojo);font-size:13px;margin-top:6px"></div>
    <div class="row" style="margin-top:12px"><span class="sp"></span><button id="cl-x">Cancelar</button><button class="pri" id="cl-ok">Continuar</button></div>`);
  const buscar=()=>{ const t=$("#cl-tel").value.replace(/\D/g,""); const x=S.clientes.find(k=>k.tel===t);
    if(x){ if(!$("#cl-nom").value) $("#cl-nom").value=x.nombre; if(!$("#cl-dir").value) $("#cl-dir").value=x.dir; if(!$("#cl-ref").value) $("#cl-ref").value=x.ref||""; $("#cl-aut").checked=true;
      $("#cl-conocido").textContent="✔ Cliente conocido: datos cargados."; } else $("#cl-conocido").textContent=""; };
  $("#cl-tel").oninput=buscar; $("#cl-tel").onchange=buscar;
  $("#cl-x").onclick=cerrarModal;
  $("#cl-ok").onclick=()=>{ const d={tel:$("#cl-tel").value.replace(/\D/g,""),nombre:$("#cl-nom").value.trim(),dir:$("#cl-dir").value.trim(),ref:$("#cl-ref").value.trim(),autoriza:$("#cl-aut").checked};

    cerrarModal(); alGuardar(d,envio); };
  setTimeout(()=>$("#cl-tel")?.focus(),50);
}

/* ===================== ATENCIÓN: despacho, servido y envío a caja ===================== */
function estadoTexto(v){
  if(pendienteCocina(v)) return (v.rondaDespachada?"🔥 Adicional en cocina":"🔥 En cocina");
  if(!esServido(v)){ const d=(v.despachos||[]).slice(-1)[0]; return d?`🍽 Despachado → <b>${esc(d.quien)}</b>`:"Sin platos de cocina"; }
  return `✓ ${verboServir(v)}${v.servidoEn?" en "+durTxt(v.servidoEn-v.creado):""}`;
}
function estadoCrono(v){
  // Corre desde que se cargó el pedido hasta que se marca servido/entregado; un adicional corre desde que se envió
  if(!v.servidoEn) return crono(v.creado);
  if(!esServido(v)) return crono(v.enviado||v.creado);
  return crono(v.creado, v.servidoEn);
}
function historialAtencion(v){
  const filas=[[v.creado,`Pedido tomado por <b>${esc(v.meseroNombre)}</b>`]];
  (v.despachos||[]).forEach(d=>filas.push([d.fecha,`Cocina despachó${d.ronda>1?" (adicional)":""} → recibió <b>${esc(d.quien)}</b>`]));
  if(v.servidoEn) filas.push([v.servidoEn,`${verboServir(v)} · espera ${durTxt(v.servidoEn-v.creado)}${v.servidoPor?" · marcó "+esc(v.servidoPor):""}`]);
  if(v.enCajaEn) filas.push([v.enCajaEn,`Enviado a caja por <b>${esc(v.enCajaPor||"")}</b>`]);
  if(v.pago?.fecha) filas.push([v.pago.fecha,`Pagado (${esc(v.pago.medio)}) · cobró ${esc(v.pago.cajero)}`]);
  filas.sort((a,b)=>a[0]-b[0]);
  return `<details style="margin:6px 0 10px" open><summary class="mu" style="cursor:pointer">Historial de atención</summary>
    <table style="margin-top:4px">${filas.map(([t,x])=>`<tr><td class="mu" style="white-space:nowrap">${hora(t)}</td><td>${x}</td></tr>`).join("")}</table></details>`;
}
function nombresEntrega(){
  const n=S.usuarios.filter(u=>u.rol==="mesero"&&u.activo!==false).map(u=>u.nombre);
  return [...new Set(n)];
}
Object.assign(accion,{
  despachar(id){
    const v=buscarVale(id);
    modal(`<h3 style="margin-top:0">Despachar · ${etiquetaVale(v)}</h3><p class="mu">¿Quién recibe el pedido para ${v.mesaId==="domicilio"?"llevarlo":"servirlo"}?</p>
      <div class="grid" style="grid-template-columns:1fr 1fr">${nombresEntrega().map(n=>`<button class="pri" style="padding:16px;font-size:17px" data-n="${esc(n)}">${esc(n)}</button>`).join("")}
      <button style="padding:16px;font-size:17px" id="dz-otro">Otro…</button></div>
      <div id="dz-campo" style="display:none;margin-top:10px"><label>Nombre de quien recibe</label><div class="row"><input id="dz-nom" style="flex:1"><button class="pri" id="dz-ok">Despachar</button></div></div>
      <button style="width:100%;margin-top:12px" id="dz-x">Cancelar</button>`);
    const hacer=async quien=>{ quien=String(quien||"").trim(); if(!quien) return;
      const d={ronda:v.ronda||1,quien,fecha:Date.now(),por:S.yo.nombre};
      cerrarModal();
      try{ await S.db.actualizar("vales",id,{despachos:(v.despachos||[]).concat([d]),rondaDespachada:v.ronda||1,cocinaEstado:"despachado",actualizado:Date.now()});
        toast(`Despachado → ${quien}`); }catch(e){ toast("Error: "+e.message); } };
    document.querySelectorAll("#modal [data-n]").forEach(b=>b.onclick=()=>hacer(b.dataset.n));
    $("#dz-otro").onclick=()=>{ $("#dz-campo").style.display="block"; $("#dz-nom").focus(); };
    $("#dz-ok").onclick=()=>hacer($("#dz-nom").value);
    $("#dz-x").onclick=cerrarModal;
  },
  async servido(){
    const v=buscarVale(S.ped.valeId); if(!v) return;
    const p={rondaServida:v.ronda||1,actualizado:Date.now()}; if(!v.servidoEn){ p.servidoEn=Date.now(); p.servidoPor=S.yo.nombre; }
    await S.db.actualizar("vales",v.id,p); toast(`✓ ${verboServir(v)}`); },
  async enviarACaja(){
    const v=buscarVale(S.ped.valeId); if(!v) return;
    if(pendienteCocina(v)&&!(await confirmar("Este pedido todavía tiene platos sin despachar en cocina. ¿Enviarlo a caja de todas formas?","Enviar a caja"))) return;
    if(!(await confirmar(`Enviar el ticket ${pad(v.numero)} (${money(v.total)}) a caja para el cobro. ${v.mesaId==="domicilio"||v.mesaId==="mostrador"?"El pedido":"La mesa"} queda libre y deja de aparecer aquí.`,"Enviar a caja"))) return;
    const ahora=Date.now(), p={enCaja:true,pidioCuenta:true,enCajaEn:ahora,enCajaPor:S.yo.nombre,actualizado:ahora};
    if(!v.servidoEn){ p.servidoEn=ahora; p.servidoPor=S.yo.nombre; } p.rondaServida=v.ronda||1;
    await S.db.actualizar("vales",v.id,p); S.ped=null; toast(`Ticket ${pad(v.numero)} enviado a caja`); render(); },
});

/* ===================== Productos de la carta (ventana "Agregar productos") ===================== */
function botonProductos(){
  const n=S.ped.nuevos.filter(i=>!String(i.pid).startsWith("alm-")&&i.pid!=="envio").reduce((s,i)=>s+i.cant,0);
  return `<button style="width:100%;padding:14px;font-size:16px;text-align:left;border:2px dashed var(--rosa)" onclick="S.prodBusca='';modalProductos()">
    ➕ <b>Agregar productos</b><br><span class="mu" style="font-size:13px">Gaseosas, agua, jugos, postres y demás productos de la carta${n?` · <b style="color:var(--rosa)">${n} agregado(s)</b>`:""}</span></button>`;
}
function modalProductos(){
  const llevar=esLlevarMesa(S.ped.mesaId), q=(S.prodBusca||"").toLowerCase().trim();
  const activos=S.productos.filter(x=>x.activo!==false);
  const cats=[...new Set(activos.map(x=>x.categoria||"Otros"))];
  if(!S.cat||!cats.includes(S.cat)) S.cat=cats[0];
  const lista=activos.filter(x=>q?x.nombre.toLowerCase().includes(q):(x.categoria||"Otros")===S.cat);
  const cantDe=id=>S.ped.nuevos.filter(i=>i.pid===id&&!i.nota).reduce((s,i)=>s+i.cant,0);
  const total=S.ped.nuevos.filter(i=>!String(i.pid).startsWith("alm-")&&i.pid!=="envio").reduce((s,i)=>s+i.cant,0);
  modal(`<div class="row"><h3 style="margin:0">➕ Agregar productos</h3><span class="sp"></span>${llevar?'<span class="dot" style="background:var(--azul)">PRECIO PARA LLEVAR</span>':""}</div>
    ${!activos.length?`<p class="mu" style="margin:14px 0">Aún no hay productos en la carta.${S.yo.rol==="admin"?" Créelos en Administración → Productos (carta).":" El administrador los carga en la app."}</p>`:`
    <input id="pr-busca" placeholder="Buscar producto…" value="${esc(S.prodBusca||"")}" style="margin:10px 0 8px" oninput="S.prodBusca=this.value;modalProductos();setTimeout(()=>{const e=document.getElementById('pr-busca');if(e){e.focus();e.setSelectionRange(e.value.length,e.value.length)}},0)">
    ${q?"":`<div class="cats" style="position:static;margin:0 0 6px;padding:0">${cats.map(c=>`<button class="${c===S.cat?"on":""}" onclick="S.cat=${JSON.stringify(c).replace(/"/g,"&quot;")};modalProductos()">${esc(c)}</button>`).join("")}</div>`}
    <div style="max-height:46vh;overflow:auto">${lista.map(x=>{ const n=cantDe(x.id);
      return `<div class="it" style="${n?"background:var(--rosa3);border-radius:8px;padding:8px":""}"><span class="sp">${esc(x.nombre)}<br><b style="color:var(--rosa)">${money(precioProducto(x,llevar))}</b></span>
        <span class="q">${n?`<button onclick="accion.prodCant('${x.id}',-1)">−</button><b style="min-width:22px;text-align:center">${n}</b>`:""}<button class="${n?"":"pri"}" onclick="accion.prodCant('${x.id}',1)">${n?"+":"Agregar"}</button></span></div>`; }).join("")||`<p class="mu">No se encontraron productos.</p>`}</div>`}
    <div class="row" style="margin-top:12px"><span class="mu">${total?`${total} producto(s) en el pedido`:""}</span><span class="sp"></span><button class="pri" onclick="cerrarModal();render()">Listo</button></div>`);
}
Object.assign(accion,{
  prodCant(pid,d){
    if(d>0) accion.agregarItem(pid);
    else { const ix=S.ped.nuevos.findIndex(i=>i.pid===pid&&!i.nota); if(ix>=0){ const i=S.ped.nuevos[ix]; i.cant--; if(i.cant<=0) S.ped.nuevos.splice(ix,1); } render(); }
    modalProductos();
  },
});

/* ===================== Aviso de versión nueva ===================== */
async function revisarVersion(){
  if(location.protocol!=="https:"||/claude/.test(location.hostname)) return;
  try{ const r=await fetch("version.json?t="+Date.now(),{cache:"no-store"}); if(!r.ok) return; const j=await r.json();
    if(j.version&&j.version!==APP_VERSION&&S.nuevaVersion!==j.version){ S.nuevaVersion=j.version; render(); } }catch(e){}
}
setInterval(revisarVersion,5*60*1000);
document.addEventListener("visibilitychange",()=>{ if(!document.hidden) revisarVersion(); });
setTimeout(revisarVersion,4000);

/* ===================== Arranque ===================== */

try{ if("serviceWorker" in navigator && location.protocol==="https:" && !/claude/.test(location.hostname)) navigator.serviceWorker.register("sw.js"); }catch(e){}
(async function(){

    S.yo=await S.db.restaurar(); if(S.yo){ S.vista=P().vistas[0]; suscribirTodo(); }
  }catch(e){ $("#app").innerHTML=`<div class="login card"><h2>No se pudo conectar</h2><p>${esc(e.message)}</p><p class="mu">Revise la conexión a internet y la configuración de Firebase.</p></div>`; return; }
  render();
  setInterval(()=>{ if(S.yo&&["mesas","cocina"].includes(S.vista)&&!S.ped&&$("#modal").style.display!=="flex") render(); },30000);
})();
