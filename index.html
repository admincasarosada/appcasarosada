<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Casa Rosada POS</title>
<meta name="theme-color" content="#e5168d">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Casa Rosada">

<style>
/* Paleta del logo oficial: fucsia, rosa hoja, negro y blanco */
:root{--rosa:#e5168d;--rosa-h:#c80f78;--rosa2:#e58fbf;--rosa3:#fbe3ef;--negro:#1d1d1b;
--bg:#fbf6f9;--card:#fff;--tx:#1d1d1b;--mu:#7a6f75;--ln:#efdce7;--hd:#ffffff;--btn:#f3e8ee;--inp:#fff;
--libre:#ffffff;--libre-b:#1d1d1b;--ocup:#f6c4de;--ocup-tx:#1d1d1b;--cuenta:#e5168d;--listo:#2e9e5b;--rojo:#d32f2f;--azul:#3d5afe;--amar:#fff4e5;--banner:#fdeef6;--banner-b:#f3bfdc}
[data-tema="oscuro"]{--rosa:#ff3fa4;--rosa-h:#ff5fb4;--rosa2:#f29ccb;--rosa3:#3a1f2e;
--bg:#141214;--card:#1f1b1e;--tx:#f3eef1;--mu:#a7999f;--ln:#3a3036;--hd:#1a1719;--btn:#2d262b;--inp:#2a2328;
--libre:#262024;--libre-b:#8a7a83;--ocup:#7a2a55;--ocup-tx:#fff;--cuenta:#ff3fa4;--listo:#3fbf73;--rojo:#ef5350;--azul:#7c8cff;--amar:#3a2f20;--banner:#2c1d26;--banner-b:#5a3049}
body,header,nav,.card,.mesa,input,select,textarea,button{transition:background-color .2s,color .2s,border-color .2s}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tx);font-size:15px}
button{font:inherit;cursor:pointer;border:0;border-radius:8px;padding:10px 14px;background:var(--btn);color:var(--tx)}
button.pri:hover{background:var(--rosa-h)}
button.pri{background:var(--rosa);color:#fff}button.ok{background:var(--listo);color:#fff}
button.warn{background:var(--cuenta);color:#fff}button.dan{background:var(--rojo);color:#fff}
button.az{background:var(--azul);color:#fff}button:disabled{opacity:.45;cursor:not-allowed}
button.sm{padding:6px 10px;font-size:13px}
input,select,textarea{font:inherit;padding:10px;border:1px solid var(--ln);border-radius:8px;width:100%;background:var(--inp);color:var(--tx)}
input:focus,select:focus{outline:2px solid var(--rosa2);border-color:var(--rosa)}
label{font-size:13px;color:var(--mu);display:block;margin:8px 0 4px}
header{background:var(--hd);color:var(--tx);display:flex;align-items:center;gap:12px;padding:8px 16px;position:sticky;top:0;z-index:5;border-bottom:3px solid var(--rosa);min-height:60px}
header .logoimg{height:44px;background:#fff;border-radius:8px;padding:2px}
header .logo{font-weight:700;font-size:17px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--rosa);display:flex;align-items:center;gap:10px}
header .who{font-size:13px;text-align:right;line-height:1.2}
header button{background:var(--btn);color:var(--tx)}
.tema{font-size:18px;padding:6px 10px;line-height:1}
nav{background:var(--card);display:flex;gap:2px;overflow-x:auto;border-bottom:1px solid var(--ln);position:sticky;top:63px;z-index:4}
nav button{background:none;border-radius:0;padding:13px 16px;font-weight:600;color:var(--mu);border-bottom:3px solid transparent;white-space:nowrap}
nav button.on{color:var(--rosa);border-bottom-color:var(--rosa)}
main{padding:16px;max-width:1200px;margin:0 auto}
.card{background:var(--card);border-radius:12px;padding:14px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sp{flex:1}.mu{color:var(--mu);font-size:13px}.b{font-weight:700}.r{text-align:right}
.grid{display:grid;gap:12px}
.mesas{grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}
.mesa{color:var(--tx);border:3px solid var(--libre-b);border-radius:12px;padding:12px;min-height:110px;cursor:pointer;display:flex;flex-direction:column;background:var(--libre);text-align:left}
.mesa .n{font-size:24px;font-weight:800}.mesa.ocup{background:var(--ocup);color:var(--ocup-tx);border-color:var(--rosa)}.mesa.cuenta{background:var(--cuenta);color:#fff;border-color:var(--rosa-h)}
.mesa .tag{font-size:12px;margin-top:auto}
.dot{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:700;background:var(--listo);color:#fff}
.leg{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;margin:6px 0 14px}
.leg i{display:inline-block;width:14px;height:14px;border:2px solid var(--libre-b);border-radius:3px;vertical-align:-2px;margin-right:4px}
.ped{display:grid;grid-template-columns:1fr 380px;gap:14px}
@media(max-width:860px){.ped{grid-template-columns:1fr}}
.cats{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px}
.cats button.on{background:var(--rosa);color:#fff}
.prods{grid-template-columns:repeat(auto-fill,minmax(130px,1fr));margin-top:10px}
.prod{background:var(--card);color:var(--tx);border:1px solid var(--ln);text-align:left;min-height:74px;display:flex;flex-direction:column}
.prod .p{color:var(--rosa);font-weight:700;margin-top:auto}
.it{display:flex;gap:8px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--ln)}
.it .q{display:flex;align-items:center;gap:4px}
.it .q button{padding:4px 10px}
.it.nuevo{background:var(--rosa3)}
.tot{font-size:22px;font-weight:800;display:flex;justify-content:space-between;margin:12px 0}
.kgrid{grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.kcard{border-top:8px solid var(--cuenta)}.kcard.preparando{border-top-color:var(--azul)}.kcard.listo{border-top-color:var(--listo)}
.kcard li{font-size:17px;margin:4px 0}.kcard li.nw{font-weight:800}.kcard .nota{color:var(--rojo);font-size:14px}
table{width:100%;border-collapse:collapse}td,th{padding:8px;border-bottom:1px solid var(--ln);text-align:left;font-size:14px}
th{color:var(--mu);font-weight:600}
.kpis{grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}
.kpi .v{font-size:22px;font-weight:800}
.sello{display:inline-block;border:3px solid var(--listo);color:var(--listo);font-weight:900;padding:4px 12px;border-radius:6px;transform:rotate(-4deg);font-size:20px}
.sello.an{border-color:var(--rojo);color:var(--rojo)}.sello.ab{border-color:var(--cuenta);color:var(--cuenta)}
.login{max-width:380px;margin:8vh auto}
.login h1{color:var(--rosa);margin:0 0 4px}
.login .logo-big{display:block;margin:0 auto 10px;max-width:240px;width:80%;background:#fff;border-radius:14px;padding:6px}
#app > .tema{position:fixed;top:14px;right:14px}
.banner{background:var(--banner);border:1px solid var(--banner-b);padding:10px 14px;border-radius:10px;font-size:13px;margin-bottom:14px}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
#modal .card{color:var(--tx);max-width:440px;width:100%;max-height:90vh;overflow:auto}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--negro);border:1px solid var(--rosa);color:#fff;padding:10px 18px;border-radius:30px;display:none;z-index:60;font-size:14px}
#print-area{display:none}
.ticket{width:72mm;font-family:"Courier New",monospace;font-size:12px;color:#000;padding:2mm}
.ticket h2{font-size:15px;text-align:center;margin:2px 0}.ticket .c{text-align:center}
.ticket hr{border:0;border-top:1px dashed #000}.ticket .big{font-size:16px;font-weight:700}
.ticket table td{border:0;padding:1px 0;font-size:12px}.ticket .qr{display:flex;justify-content:center;margin:6px 0}
@media print{body>*:not(#print-area){display:none!important}#print-area{display:block}@page{margin:0;size:80mm auto}}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal"><div class="card" id="modal-body"></div></div>
<div id="toast"></div>
<div id="print-area"></div>

}

class DemoStore{
  constructor(){ this.key="crx_pos_demo_v1"; this.ls={}; this.mem=null; this.cargar();
    window.addEventListener("storage",e=>{ if(e.key===this.key){ this.cargar(); this.emitirTodo(); } }); }
  get demo(){ return true; }
  cargar(){ let d=null; try{ d=JSON.parse(localStorage.getItem(this.key)); }catch(e){} this.db=d||this.mem||semilla(); if(!d) this.guardar(); }
  guardar(){ this.mem=this.db; try{ localStorage.setItem(this.key,JSON.stringify(this.db)); }catch(e){} }
  lista(c,f=[]){ return Object.entries(this.db[c]||{}).map(([id,v])=>({id,...v})).filter(d=>f.every(([k,op,v])=>{
      const x=k.split(".").reduce((o,p)=>o?.[p],d); return op==="=="?x===v:op===">="?x>=v:op==="<="?x<=v:op==="<"?x<v:true; })); }
  emitir(c){ (this.ls[c]||[]).forEach(l=>l.cb(this.lista(c,l.f))); }
  emitirTodo(){ Object.keys(this.ls).forEach(c=>this.emitir(c)); }
  suscribir(c,cb,f=[]){ const l={cb,f}; (this.ls[c]=this.ls[c]||[]).push(l); cb(this.lista(c,f)); return ()=>{ this.ls[c]=this.ls[c].filter(x=>x!==l); }; }
  async consultar(c,f=[]){ return this.lista(c,f); }
  async agregar(c,d){ const id=rid(); (this.db[c]=this.db[c]||{})[id]=d; this.guardar(); this.emitir(c); return id; }
  async poner(c,id,d){ (this.db[c]=this.db[c]||{})[id]=d; this.guardar(); this.emitir(c); }
  async actualizar(c,id,p){ Object.assign(this.db[c][id],p); this.guardar(); this.emitir(c); }
  async borrar(c,id){ delete this.db[c][id]; this.guardar(); this.emitir(c); }
  async siguienteNumero(){ this.db._contador=(this.db._contador||0)+1; this.guardar(); return this.db._contador; }
  async necesitaConfigurar(){ return false; }
  async ingresar(u,p){ const x=this.lista("users").find(x=>x.usuario===u.toLowerCase().trim()&&x.pass===p);
    if(!x) throw new Error("Usuario o contraseña incorrectos"); if(x.activo===false) throw new Error("Usuario desactivado");
    try{ sessionStorage.setItem("crx_uid",x.id); }catch(e){} this._uid=x.id; return x; }
  async restaurar(){ let id=this._uid; try{ id=sessionStorage.getItem("crx_uid")||id; }catch(e){} const x=id&&this.db.users[id]; return x&&x.activo!==false?{id,...x}:null; }
  async salir(){ this._uid=null; try{ sessionStorage.removeItem("crx_uid"); }catch(e){} }
  async crearUsuario({usuario,pass,nombre,rol}){ usuario=usuario.toLowerCase().trim();
    if(this.lista("users").some(x=>x.usuario===usuario)) throw new Error("Ese usuario ya existe");
    return this.agregar("users",{usuario,pass,nombre,rol,activo:true}); }
  async cambiarClave(id,pass){ return this.actualizar("users",id,{pass}); }
  async reiniciarDemo(){ this.db=semilla(); this.guardar(); this.emitirTodo(); }
}

/* ===================== Capa de datos: FIREBASE (en línea) ===================== */
function cargarScript(src){ return new Promise((ok,err)=>{ const s=document.createElement("script"); s.src=src; s.onload=ok; s.onerror=()=>err(new Error("No se pudo cargar "+src)); document.head.appendChild(s); }); }
class FireStore{
  get demo(){ return false; }
  async iniciar(){
    const v="10.12.2", b=`https://www.gstatic.com/firebasejs/${v}/`;
    await cargarScript(b+"firebase-app-compat.js"); await cargarScript(b+"firebase-auth-compat.js"); await cargarScript(b+"firebase-firestore-compat.js");
    this.app=firebase.initializeApp(FIREBASE_CONFIG); this.auth=firebase.auth(); this.fs=firebase.firestore();
    try{ await this.fs.enablePersistence({synchronizeTabs:true}); }catch(e){}
  }
  correo(u){ return u.toLowerCase().trim().replace(/[^a-z0-9._-]/g,"")+"@"+DOMINIO_USUARIOS; }
  q(c,f){ let r=this.fs.collection(c); f.forEach(([k,op,v])=>r=r.where(k,op,v)); return r; }
  suscribir(c,cb,f=[]){ return this.q(c,f).onSnapshot(s=>cb(s.docs.map(d=>({id:d.id,...d.data()}))),e=>console.error(c,e)); }
  async consultar(c,f=[]){ const s=await this.q(c,f).get(); return s.docs.map(d=>({id:d.id,...d.data()})); }
  async agregar(c,d){ const r=await this.fs.collection(c).add(d); return r.id; }
  async poner(c,id,d){ await this.fs.collection(c).doc(id).set(d); }
  async actualizar(c,id,p){ await this.fs.collection(c).doc(id).update(p); }
  async borrar(c,id){ await this.fs.collection(c).doc(id).delete(); }
  async siguienteNumero(){ const ref=this.fs.collection("config").doc("contador");
    return this.fs.runTransaction(async t=>{ const s=await t.get(ref); const n=(s.exists?s.data().n:0)+1; t.set(ref,{n}); return n; }); }
  async necesitaConfigurar(){ const s=await this.fs.collection("config").doc("setup").get(); return !s.exists; }
  async configurarPrimerAdmin({usuario,pass,nombre}){
    const cred=await this.auth.createUserWithEmailAndPassword(this.correo(usuario),pass); const uid=cred.user.uid;
    const b=this.fs.batch();
    b.set(this.fs.collection("users").doc(uid),{usuario:usuario.toLowerCase().trim(),nombre,rol:"admin",activo:true});
    b.set(this.fs.collection("config").doc("setup"),{fecha:Date.now()});
    b.set(this.fs.collection("config").doc("negocio"),{nombre:"Casa Rosada Xuacha",nit:"",direccion:"",telefono:"",pie:"Gracias por su visita"});
    await b.commit(); return {id:uid,usuario,nombre,rol:"admin",activo:true};
  }
  async perfil(uid){ const s=await this.fs.collection("users").doc(uid).get(); return s.exists?{id:uid,...s.data()}:null; }
  async ingresar(u,p){
    let cred; try{ cred=await this.auth.signInWithEmailAndPassword(this.correo(u),p); }
    catch(e){ throw new Error("Usuario o contraseña incorrectos"); }
    const x=await this.perfil(cred.user.uid); if(!x||x.activo===false){ await this.auth.signOut(); throw new Error("Usuario sin acceso o desactivado"); } return x;
  }
  restaurar(){ return new Promise(res=>{ const un=this.auth.onAuthStateChanged(async u=>{ un(); if(!u) return res(null); const x=await this.perfil(u.uid); res(x&&x.activo!==false?x:null); }); }); }
  async salir(){ await this.auth.signOut(); }
  async crearUsuario({usuario,pass,nombre,rol}){
    // Se usa una segunda instancia para no cerrar la sesión del administrador
    const sec=firebase.apps.find(a=>a.name==="sec")||firebase.initializeApp(FIREBASE_CONFIG,"sec");
    const cred=await sec.auth().createUserWithEmailAndPassword(this.correo(usuario),pass); await sec.auth().signOut();
    await this.poner("users",cred.user.uid,{usuario:usuario.toLowerCase().trim(),nombre,rol,activo:true}); return cred.user.uid;
  }
  // Solo el administrador cambia contraseñas (la pestaña Usuarios es exclusiva del administrador).
  // Firebase no deja cambiar la clave de otro usuario desde la página sin conocer la actual,
  // por eso se pide la contraseña actual de ese usuario.
  async cambiarClave(id,pass,actual){
    if(S.yo?.rol!=="admin") throw new Error("Solo el administrador puede cambiar contraseñas");
    const x=S.usuarios.find(u=>u.id===id); if(!x) throw new Error("Usuario no encontrado");
    const sec=firebase.apps.find(a=>a.name==="sec")||firebase.initializeApp(FIREBASE_CONFIG,"sec");
    try{ const cred=await sec.auth().signInWithEmailAndPassword(this.correo(x.usuario),actual); await cred.user.updatePassword(pass); }
    catch(e){ if(String(e.code).includes("wrong-password")||String(e.code).includes("invalid-credential")||String(e.code).includes("invalid-login")) throw new Error("La contraseña actual no es correcta");
      if(String(e.code).includes("weak-password")) throw new Error("La nueva contraseña debe tener mínimo 6 caracteres"); throw e; }
    finally{ try{ await sec.auth().signOut(); }catch(e){} }
  }
}

const S = { db:null, yo:null, vista:null, mesas:[], productos:[], usuarios:[], negocio:{}, valesAbiertos:[], valesHoy:[],
  salon:null, ped:null, cat:null, caja:{sel:null,medio:"Efectivo",recibido:"",busca:""}, rep:{desde:null,hasta:null,datos:null},
  adm:"menu", subs:[] };
const P = () => PERMISOS[S.yo?.rol]||{vistas:[]};
const valeDeMesa = mid => S.valesAbiertos.find(v=>v.mesaId===mid);
const buscarVale = id => S.valesAbiertos.find(v=>v.id===id)||S.valesHoy.find(v=>v.id===id);
const totalItems = its => its.reduce((s,i)=>s+i.precio*i.cant,0);

function suscribirTodo(){
  S.subs.forEach(u=>u()); S.subs=[];
  const r=()=>render();
  S.subs.push(S.db.suscribir("mesas",d=>{S.mesas=d.sort((a,b)=>(a.orden||0)-(b.orden||0)||a.nombre.localeCompare(b.nombre,"es",{numeric:true}));r();}));
  S.subs.push(S.db.suscribir("productos",d=>{S.productos=d.sort((a,b)=>(a.orden||0)-(b.orden||0));r();}));
  S.subs.push(S.db.suscribir("users",d=>{S.usuarios=d;r();}));
  S.subs.push(S.db.suscribir("config",d=>{S.negocio=d.find(x=>x.id==="negocio")||{};r();}));
  let prev=null;
  S.subs.push(S.db.suscribir("vales",d=>{
    S.valesAbiertos=d;
    // aviso sonoro en cocina cuando entra un pedido nuevo
    if(S.vista==="cocina"&&prev){ const n=d.filter(v=>v.cocinaEstado==="pendiente"&&!prev.some(p=>p.id===v.id&&p.cocinaEstado==="pendiente")); if(n.length) beep(); }
    prev=d; r();
  },[["estado","==","abierto"]]));
  S.subs.push(S.db.suscribir("vales",d=>{S.valesHoy=d;r();},[["creado",">=",inicioDia()]]));
}
function beep(){ try{ const a=new (window.AudioContext||window.webkitAudioContext)(); const o=a.createOscillator(); o.connect(a.destination); o.frequency.value=880; o.start(); setTimeout(()=>{o.stop();a.close();},250); }catch(e){} }

function pintarQR(id,valeId,size){ const el=document.getElementById(id); const v=buscarVale(valeId)||S.caja.selCache; if(!el||!v||typeof QRCode==="undefined") return;
  el.innerHTML=""; new QRCode(el,{text:"CRVALE:"+pad(v.numero),width:size,height:size,correctLevel:QRCode.CorrectLevel.M}); }
function ticketHTML(v,tipo){
  const n=S.negocio;
  if(tipo==="comanda") return `<div class="ticket"><h2>COMANDA COCINA</h2><div class="c big">${v.mesaId==="mostrador"?"MOSTRADOR":"MESA "+esc(v.mesaNombre)}</div>
    <div class="c">Vale ${pad(v.numero)} · ${esc(v.meseroNombre)} · ${hora(Date.now())}</div><hr>
    ${v.items.filter(i=>i.cocina&&i.ronda===v.ronda).map(i=>`<div class="big">${i.cant} x ${esc(i.nombre)}</div>${i.nota?`<div>  ** ${esc(i.nota)}</div>`:""}`).join("")||"<div>(sin productos de cocina en esta ronda)</div>"}
    <hr><div class="c">Ronda ${v.ronda}</div></div>`;
  const est=v.estado==="pagado"?`*** PAGADO ${fecha(v.pago.fecha)} — ${esc(v.pago.medio)} ***`:v.estado==="anulado"?"*** ANULADO ***":"PENDIENTE DE PAGO";
  return `<div class="ticket"><h2>${esc(n.nombre||"Casa Rosada")}</h2><div class="c">${n.nit?"NIT "+esc(n.nit)+"<br>":""}${esc(n.direccion||"")}${n.telefono?"<br>Tel. "+esc(n.telefono):""}</div><hr>
    <div class="c big">VALE N° ${pad(v.numero)}</div><div>${v.mesaId==="mostrador"?"Mostrador":"Mesa: "+esc(v.mesaNombre)} &nbsp; Mesero: ${esc(v.meseroNombre)}</div><div>${fecha(v.creado)}</div><hr>
    <table>${v.items.map(i=>`<tr><td>${i.cant} ${esc(i.nombre)}</td><td style="text-align:right">${money(i.precio*i.cant)}</td></tr>`).join("")}</table><hr>
    <div class="big" style="display:flex;justify-content:space-between"><span>TOTAL</span><span>${money(v.total)}</span></div><hr>
    <div class="qr" id="qr-print"></div><div class="c"><b>${est}</b></div>
    <div class="c">${v.estado==="abierto"?"Presente este vale en caja para pagar.":""}<br>${esc(n.pie||"")}</div>
    <div class="c" style="font-size:10px;margin-top:4px">Documento interno de control – no es factura</div></div>`;
}
function imprimirVale(v,tipo){
  const pa=$("#print-area"); pa.innerHTML=ticketHTML(v,tipo);
  if(tipo!=="comanda"&&typeof QRCode!=="undefined") new QRCode($("#qr-print"),{text:"CRVALE:"+pad(v.numero),width:110,height:110});
  setTimeout(()=>{ try{ window.print(); }catch(e){} if(S.db.demo) toast("Si no se abrió la impresión, es por el modo demo: en la versión instalada sí imprime."); },250);
}

/* ===================== Acciones ===================== */
const accion = {
  ir(v){ S.vista=v; S.ped=null; if(v==="reportes") S.rep.datos=null; if(v==="movimientos") movSuscribir(); render(); },
  async salir(){ S.subs.forEach(u=>u()); S.subs=[]; if(S.mov.sub){ S.mov.sub(); S.mov.sub=null; } await S.db.salir(); S.yo=null; S.ped=null; render(); },
  abrirMesa(mid){
    if(mid==="mostrador"){ S.ped={mesaId:"mostrador",mesaNombre:"Mostrador",valeId:null,nuevos:[]}; return render(); }
    const m=S.mesas.find(x=>x.id===mid), v=valeDeMesa(mid);
    S.ped={mesaId:mid,mesaNombre:m.nombre,valeId:v?.id||null,nuevos:[]}; render();
  },
  abrirVale(id){ const v=buscarVale(id); S.ped={mesaId:v.mesaId,mesaNombre:v.mesaNombre,valeId:id,nuevos:[]}; render(); },
  async cerrarPedido(){ if(S.ped.nuevos.length&&!(await confirmar("Hay productos sin enviar a cocina. ¿Salir y descartarlos?","Salir"))) return; S.ped=null; render(); },
  agregarItem(pid){ const x=S.productos.find(p=>p.id===pid); const e=S.ped.nuevos.find(i=>i.pid===pid&&!i.nota);
    if(e) e.cant++; else S.ped.nuevos.push({pid,nombre:x.nombre,precio:x.precio,cant:1,nota:"",cocina:!!x.cocina}); render(); },
  cant(ix,d){ const i=S.ped.nuevos[ix]; i.cant+=d; if(i.cant<=0) S.ped.nuevos.splice(ix,1); render(); },
  async notaItem(ix){ const t=await pedirTexto("Nota para cocina","Ej: sin cebolla, término medio"); if(t!==null){ S.ped.nuevos[ix].nota=t; render(); } },
  async enviarCocina(){
    const p=S.ped; if(!p.nuevos.length) return; const ahora=Date.now();
    try{
      if(!p.valeId){
        const numero=await S.db.siguienteNumero();
        const items=p.nuevos.map(i=>({...i,ronda:1}));
        const vale={numero,mesaId:p.mesaId,mesaNombre:p.mesaNombre,meseroUid:S.yo.id,meseroNombre:S.yo.nombre,items,total:totalItems(items),
          estado:"abierto",cocinaEstado:items.some(i=>i.cocina)?"pendiente":"entregado",ronda:1,pidioCuenta:false,creado:ahora,actualizado:ahora,enviado:ahora};
        p.valeId=await S.db.agregar("vales",vale);
        toast(`Vale ${pad(numero)} creado y enviado a cocina`);
      } else {
        const v=buscarVale(p.valeId), ronda=(v.ronda||1)+1, nuevos=p.nuevos.map(i=>({...i,ronda})), items=v.items.concat(nuevos);
        const patch={items,total:totalItems(items),ronda,actualizado:ahora}; if(nuevos.some(i=>i.cocina)){ patch.cocinaEstado="pendiente"; patch.enviado=ahora; }
        await S.db.actualizar("vales",p.valeId,patch); toast("Productos agregados al vale y enviados a cocina");
      }
      p.nuevos=[]; render();
    }catch(e){ toast("Error: "+e.message); }
  },
  async quitarEnviado(ix){ const v=buscarVale(S.ped.valeId); const i=v.items[ix];
    const mot=await pedirTexto(`¿Quitar "${i.cant} × ${i.nombre}" del vale? Escriba el motivo:`); if(!mot) return;
    const items=v.items.filter((_,k)=>k!==ix); const log=(v.cambios||[]).concat([{quien:S.yo.nombre,fecha:Date.now(),quito:`${i.cant} × ${i.nombre}`,motivo:mot}]);
    await S.db.actualizar("vales",v.id,{items,total:totalItems(items),cambios:log,actualizado:Date.now()}); },
  async pedirCuenta(){ await S.db.actualizar("vales",S.ped.valeId,{pidioCuenta:true,actualizado:Date.now()}); toast("Caja fue avisada: la mesa pidió la cuenta"); },
  irACaja(id){ S.ped=null; S.vista="caja"; accion.selVale(id); },
  imprimir(id,tipo){ const v=buscarVale(id)||S.caja.selCache; if(v) imprimirVale(v,tipo); },
  cocina(id,estado){ S.db.actualizar("vales",id,{cocinaEstado:estado,actualizado:Date.now()}); },
  selVale(id){ S.caja.sel=id; S.caja.selCache=buscarVale(id); S.caja.recibido=""; S.caja.medio="Efectivo"; render(); },
  txtCambio(total){ const r=Number(String(S.caja.recibido).replace(/\D/g,""))||0; return r?(r-total>=0?money(r-total):"Falta "+money(total-r)):"—"; },
  async buscarVale(e){ e&&e.preventDefault(); const t=String(S.caja.busca||"").trim(); const n=Number(t.replace(/\D/g,"")); if(!n) return toast("Escriba o escanee un número de vale");
    let v=S.valesAbiertos.find(x=>x.numero===n)||S.valesHoy.find(x=>x.numero===n);
    if(!v){ const r=await S.db.consultar("vales",[["numero","==",n]]); v=r[0]; }
    if(!v) return toast("No existe el vale "+pad(n));
    S.caja.busca=""; S.caja.sel=v.id; S.caja.selCache=v; S.caja.recibido=""; render(); },
  async cobrar(id){ const v=buscarVale(id); const c=S.caja; const rec=Number(String(c.recibido).replace(/\D/g,""))||0;
    if(c.medio==="Efectivo"&&rec&&rec<v.total) return toast("El valor recibido es menor al total");
    const ahora=Date.now(); const pago={medio:c.medio,fecha:ahora,cajero:S.yo.nombre,cajeroUid:S.yo.id};
    if(c.medio==="Efectivo"&&rec){ pago.recibido=rec; pago.cambio=rec-v.total; }
    const ref=$("#caja-ref")?.value?.trim(); if(ref) pago.ref=ref;
    await S.db.actualizar("vales",id,{estado:"pagado",pago,pagoFecha:ahora,actualizado:ahora,pidioCuenta:false});
    S.caja.selCache={...v,estado:"pagado",pago}; toast(`Vale ${pad(v.numero)} PAGADO`); render(); },
  async anular(id){ const v=buscarVale(id); const m=await pedirTexto(`Anular el vale ${pad(v.numero)} por ${money(v.total)}. Motivo:`); if(!m) return;
    const an={motivo:m,por:S.yo.nombre,fecha:Date.now()}; await S.db.actualizar("vales",id,{estado:"anulado",anulacion:an,actualizado:Date.now()});
    S.caja.selCache={...v,estado:"anulado",anulacion:an}; toast("Vale anulado"); render(); },
  async escanear(){
    if(!("BarcodeDetector" in window)||!navigator.mediaDevices){ toast("Este navegador no permite escanear con cámara. Escriba el número o use un lector de códigos."); return; }
    let stream; try{ stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"}}); }catch(e){ toast("No se pudo abrir la cámara"); return; }
    modal(`<h3 style="margin-top:0">Apunte al QR del vale</h3><video id="cam" playsinline style="width:100%;border-radius:8px"></video><button style="width:100%;margin-top:10px" id="cam-x">Cancelar</button>`);
    const vid=$("#cam"); vid.srcObject=stream; await vid.play(); const det=new BarcodeDetector({formats:["qr_code"]}); let vivo=true;
    const parar=()=>{ vivo=false; stream.getTracks().forEach(t=>t.stop()); cerrarModal(); }; $("#cam-x").onclick=parar;
    const loop=async()=>{ if(!vivo) return; try{ const r=await det.detect(vid); if(r[0]){ parar(); S.caja.busca=r[0].rawValue; return accion.buscarVale(); } }catch(e){} setTimeout(loop,300); }; loop();
  },
  async cargarReporte(){
    const r=S.rep; r.cargando=true; r.datos=null;
    const d0=new Date(r.desde+"T00:00:00").getTime(), d1=new Date(r.hasta+"T00:00:00").getTime()+86400000;
    try{
      const pagados=(await S.db.consultar("vales",[["pagoFecha",">=",d0],["pagoFecha","<",d1]])).filter(v=>v.estado==="pagado");
      const anulados=(await S.db.consultar("vales",[["creado",">=",d0],["creado","<",d1]])).filter(v=>v.estado==="anulado");
      const porMedio={},porMesero={},pr={}; let total=0;
      pagados.forEach(v=>{ total+=v.total; const a=(o,k)=>{o[k]=o[k]||{c:0,v:0};o[k].c++;o[k].v+=v.total;}; a(porMedio,v.pago.medio); a(porMesero,v.meseroNombre);
        v.items.forEach(i=>{ pr[i.nombre]=pr[i.nombre]||{n:i.nombre,c:0,v:0}; pr[i.nombre].c+=i.cant; pr[i.nombre].v+=i.cant*i.precio; }); });
      r.datos={pagados,anulados,total,porMedio,porMesero,prods:Object.values(pr).sort((a,b)=>b.c-a.c)};
    }catch(e){ toast("Error cargando reporte: "+e.message); r.datos={pagados:[],anulados:[],total:0,porMedio:{},porMesero:{},prods:[]}; }
    r.cargando=false; render();
  },

      <label>Categoría</label><input id="p-c" list="dl-c" value="${esc(p.categoria)}"><datalist id="dl-c">${cats.map(c=>`<option value="${esc(c)}">`).join("")}</datalist>

      <label><input type="checkbox" id="p-a" style="width:auto" ${p.activo!==false?"checked":""}> Activo (visible para los meseros)</label>
      <div class="row" style="margin-top:12px">${id?`<button class="dan" id="p-del">Eliminar</button>`:""}<span class="sp"></span><button id="p-x">Cancelar</button><button class="pri" id="p-ok">Guardar</button></div>`);

    $("#p-ok").onclick=async()=>{ const d={nombre:$("#p-n").value.trim(),categoria:$("#p-c").value.trim()||"Otros",precio:Number($("#p-p").value.replace(/\D/g,""))||0,cocina:$("#p-k").checked,activo:$("#p-a").checked,orden:p.orden??S.productos.length};
      if(!d.nombre) return toast("Escriba el nombre"); cerrarModal(); id?await S.db.actualizar("productos",id,d):await S.db.agregar("productos",d); toast("Producto guardado"); };
  },
  editarMesa(id){ const m=id?S.mesas.find(x=>x.id===id):{nombre:"",salon:S.mesas[0]?.salon||"Salón principal",orden:S.mesas.length+1};
    modal(`<h3 style="margin-top:0">${id?"Editar":"Nueva"} mesa</h3><label>Nombre o número</label><input id="m-n" value="${esc(m.nombre)}">
      <label>Salón / zona</label><input id="m-s" value="${esc(m.salon)}"><label>Orden en pantalla</label><input id="m-o" inputmode="numeric" value="${m.orden||""}">

/* ===================== MÓDULO: INGRESOS Y EGRESOS ===================== */
const hoyISO = () => { const d=new Date(); d.setMinutes(d.getMinutes()-d.getTimezoneOffset()); return d.toISOString().slice(0,10); };
const fechaCorta = iso => { const [y,m,d]=String(iso).split("-"); return `${d}/${m}/${y}`; };
const BANCOS = CUENTAS.filter(c=>c!=="Efectivo");
const CONCEPTOS = {
  ingreso:["Saldo inicial","Ventas del día","Venta de tiquetera","Abono de crédito de cliente","Evento","Arriendo espacio de la entrada","Venta de velitas","Aporte de socios","Otro ingreso"],
  egreso:["Compra de plaza (verduras y frutas)","Carnes y pollo","Abarrotes","Gas","Bebidas","Desechables","Aseo","Pago de turnos / nómina","Arriendo","Servicios públicos","Mantenimiento","Publicidad","Transporte","Otro gasto"]
};
const ORIGENES = ["Saldo inicial de la cuenta","Ventas del restaurante","Cliente","Socio / propietario","Arrendatario","Entidad / empresa","Otro"];
S.mov = { desde:null, hasta:null, datos:[], sub:null, tipo:"todos", medio:"todos", ejec:"todos", form:{tipo:"egreso", fecha:null, medio:"Efectivo", ejec:"ejecutado"}, edit:null };

// Un registro sin estado de ejecución (anteriores a este cambio) cuenta como ejecutado
const esProv = x => x.ejec==="por_ejecutar";
const vigente = x => x.estado!=="anulado";
function movSuscribir(){
  const m=S.mov; if(!m.desde){ m.desde=hoyISO(); m.hasta=hoyISO(); }
  if(m.sub) m.sub();
  // Se cargan todos los registros: el saldo de las cuentas es acumulado desde el inicio
  m.sub=S.db.suscribir("movimientos",d=>{ m.datos=d.sort((a,b)=>b.fecha.localeCompare(a.fecha)||b.creado-a.creado); if(S.vista==="movimientos") render(); });
}
function puedeEditarMov(x){ if(S.yo.rol==="admin") return true;
  return x.registradoUid===S.yo.id && (esProv(x) || new Date(x.creado).toDateString()===new Date().toDateString()); }

/* Saldos por cuenta: real (solo ejecutado) y proyectado (real + provisiones pendientes) */
function saldos(lista){
  const r={}; CUENTAS.forEach(c=>r[c]={real:0,porRecibir:0,porPagar:0});
  lista.filter(vigente).forEach(x=>{ const c=r[x.medio]; if(!c) return; const s=x.tipo==="ingreso"?1:-1;
    if(esProv(x)){ if(s>0) c.porRecibir+=x.valor; else c.porPagar+=x.valor; } else c.real+=s*x.valor; });
  CUENTAS.forEach(c=>r[c].proy=r[c].real+r[c].porRecibir-r[c].porPagar);
  const suma=(cs,k)=>cs.reduce((a,c)=>a+r[c][k],0);
  const grupo=cs=>({real:suma(cs,"real"),porRecibir:suma(cs,"porRecibir"),porPagar:suma(cs,"porPagar"),proy:suma(cs,"proy")});
  return {cta:r, bancos:grupo(BANCOS), total:grupo(CUENTAS)};
}
const neg = v => v<0?"color:var(--rojo)":"";

  const ingR=sum(vig.filter(x=>!esProv(x)),"ingreso"), egrR=sum(vig.filter(x=>!esProv(x)),"egreso");
  const ingP=sum(vig.filter(esProv),"ingreso"), egrP=sum(vig.filter(esProv),"egreso");

    ${filaSaldo("Efectivo",sal.cta.Efectivo)}
    ${BANCOS.map(b=>filaSaldo(b,sal.cta[b])).join("")}
    ${filaSaldo("Total bancos",sal.bancos,true)}
    ${filaSaldo("TOTAL (efectivo + bancos)",sal.total,true)}</table></div>
    <p class="mu" style="margin-bottom:0">El saldo es acumulado con todos los registros desde el inicio. Para arrancar, registre un ingreso "Saldo inicial" en cada cuenta con lo que hay hoy.</p></div>

  <div class="card" style="margin-bottom:12px"><div class="row"><h3 style="margin:0">Movimiento del período</h3><span class="sp"></span>

function movLimpiar(){ const f=S.mov.form; S.mov.form={tipo:f.tipo,fecha:f.fecha,medio:f.medio,ejec:f.ejec}; S.mov.edit=null; }

Object.assign(accion,{
  movRango(){ S.mov.desde=$("#mv-d").value||hoyISO(); S.mov.hasta=$("#mv-h").value||S.mov.desde; if(S.mov.hasta<S.mov.desde) S.mov.hasta=S.mov.desde; render(); },
  movHoy(){ S.mov.desde=S.mov.hasta=hoyISO(); render(); },
  movMes(){ const h=hoyISO(); S.mov.desde=h.slice(0,8)+"01"; const d=new Date(+h.slice(0,4),+h.slice(5,7),0); S.mov.hasta=h.slice(0,8)+String(d.getDate()).padStart(2,"0"); render(); },
  movTipo(t){ if(S.mov.form.tipo!==t){ S.mov.form.tipo=t; S.mov.form.concepto=""; S.mov.form.quien=""; } render(); },
  movMedio(c){ S.mov.form.medio=c; render(); },
  movEjec(k){ S.mov.form.ejec=k; render(); },
  async movGuardar(){
    const f=S.mov.form, err=$("#mv-err"); const valor=Number(String(f.valor||"").replace(/\D/g,""))||0;
    if(!valor) return err.textContent="Escriba el valor";
    if(!(f.concepto||"").trim()) return err.textContent="Escriba el concepto";
    if(!(f.quien||"").trim()) return err.textContent=f.tipo==="ingreso"?"Indique de dónde viene el ingreso":"Indique el responsable del gasto";
    const d={tipo:f.tipo,fecha:f.fecha,valor,concepto:f.concepto.trim(),medio:f.medio,soporte:(f.soporte||"").trim(),obs:(f.obs||"").trim(),ejec:f.ejec,
      origen:f.tipo==="ingreso"?f.quien.trim():"",responsable:f.tipo==="egreso"?f.quien.trim():""};
    try{
      if(S.mov.edit){ await S.db.actualizar("movimientos",S.mov.edit,{...d,editadoPor:S.yo.nombre,editado:Date.now()}); toast("Registro actualizado"); }
      else { await S.db.agregar("movimientos",{...d,estado:"activo",registradoPor:S.yo.nombre,registradoUid:S.yo.id,creado:Date.now()});
        toast(`${f.ejec==="por_ejecutar"?"Provisión":f.tipo==="ingreso"?"Ingreso":"Egreso"} de ${money(valor)} registrado`); }
      if(f.fecha<S.mov.desde||f.fecha>S.mov.hasta){ if(f.fecha<S.mov.desde) S.mov.desde=f.fecha; else S.mov.hasta=f.fecha; }
      movLimpiar(); render();
    }catch(e){ err.textContent="Error: "+e.message; }
  },
  movEditar(id){ const x=S.mov.datos.find(y=>y.id===id); S.mov.edit=id;
    S.mov.form={tipo:x.tipo,fecha:x.fecha,valor:String(x.valor),concepto:x.concepto,quien:x.tipo==="ingreso"?x.origen:x.responsable,medio:x.medio,soporte:x.soporte,obs:x.obs,ejec:x.ejec||"ejecutado"};
    render(); window.scrollTo({top:document.querySelector(".ped")?.offsetTop||0,behavior:"smooth"}); },
  movCancelar(){ movLimpiar(); render(); },
  movEjecutar(id){
    const x=S.mov.datos.find(y=>y.id===id);
    modal(`<h3 style="margin-top:0">Ejecutar ${x.tipo==="ingreso"?"ingreso":"gasto"} provisionado</h3>
      <p><b>${esc(x.concepto)}</b><br><span class="mu">Provisionado: ${money(x.valor)} · ${esc(x.medio)} · ${fechaCorta(x.fecha)}</span></p>
      <label>Fecha en que ${x.tipo==="ingreso"?"entró":"salió"} el dinero</label><input type="date" id="ej-f" value="${hoyISO()}">
      <label>Valor real (puede ser distinto al provisionado)</label><input id="ej-v" inputmode="numeric" value="${x.valor}">
      <label>Cuenta</label><select id="ej-c">${CUENTAS.map(c=>`<option ${c===x.medio?"selected":""}>${c}</option>`).join("")}</select>
      <label>N° de factura o soporte (opcional)</label><input id="ej-s" value="${esc(x.soporte||"")}">
      <div class="row" style="margin-top:14px"><span class="sp"></span><button id="ej-x">Cancelar</button><button class="ok" id="ej-ok">✔ Marcar como ejecutado</button></div>`);
    $("#ej-x").onclick=cerrarModal;
    $("#ej-ok").onclick=async()=>{ const v=Number($("#ej-v").value.replace(/\D/g,""))||0; if(!v) return toast("Escriba el valor");
      const p={ejec:"ejecutado",fecha:$("#ej-f").value||hoyISO(),fechaEjec:$("#ej-f").value||hoyISO(),valor:v,medio:$("#ej-c").value,soporte:$("#ej-s").value.trim(),
        valorProvisionado:x.valor,fechaProvisionada:x.fecha,ejecutadoPor:S.yo.nombre,editado:Date.now()};
      cerrarModal(); await S.db.actualizar("movimientos",id,p);
      if(p.fecha<S.mov.desde) S.mov.desde=p.fecha; if(p.fecha>S.mov.hasta) S.mov.hasta=p.fecha;
      toast(`Ejecutado: ${money(v)} ${x.tipo==="ingreso"?"entró a":"salió de"} ${p.medio}`); render(); };
  },
  async movAnular(id){ const x=S.mov.datos.find(y=>y.id===id);
    const mot=await pedirTexto(`Anular ${x.tipo} "${x.concepto}" por ${money(x.valor)}. Motivo:`); if(!mot) return;
    await S.db.actualizar("movimientos",id,{estado:"anulado",anulacion:{motivo:mot,por:S.yo.nombre,fecha:Date.now()}}); toast("Registro anulado"); },
  async movTraerVentas(){
    const fe=S.mov.form.fecha; const d0=new Date(fe+"T00:00:00").getTime(), d1=d0+86400000;
    const vales=(await S.db.consultar("vales",[["pagoFecha",">=",d0],["pagoFecha","<",d1]])).filter(v=>v.estado==="pagado");
    if(!vales.length) return toast("No hay vales pagados el "+fechaCorta(fe));
    const ya=S.mov.datos.filter(m=>m.fecha===fe);
    const porCta={}; vales.forEach(v=>{ const c=CUENTAS.includes(v.pago.medio)?v.pago.medio:"Efectivo"; (porCta[c]=porCta[c]||{v:0,n:0}); porCta[c].v+=v.total; porCta[c].n++; });
    let n=0;
    for(const [c,x] of Object.entries(porCta)){
      const clave=`ventas-${fe}-${c}`, prev=ya.find(m=>m.clave===clave&&vigente(m));
      const datos={tipo:"ingreso",fecha:fe,valor:x.v,concepto:"Ventas del día",origen:"Ventas del restaurante (vales de caja)",responsable:"",medio:c,soporte:`${x.n} vales`,obs:"Generado desde caja",clave,ejec:"ejecutado"};
      if(prev){ if(prev.valor!==x.v){ await S.db.actualizar("movimientos",prev.id,{valor:x.v,soporte:datos.soporte,editado:Date.now(),editadoPor:S.yo.nombre}); n++; } }
      else { await S.db.agregar("movimientos",{...datos,estado:"activo",registradoPor:S.yo.nombre,registradoUid:S.yo.id,creado:Date.now()}); n++; }
    }
    if(fe<S.mov.desde) S.mov.desde=fe; if(fe>S.mov.hasta) S.mov.hasta=fe;
    toast(n?`Ventas del ${fechaCorta(fe)} registradas por cuenta`:"Las ventas de ese día ya estaban registradas"); render();
  },
  movCSV(){
    const sel=S.mov.datos.filter(x=>x.fecha>=S.mov.desde&&x.fecha<=S.mov.hasta);
    const filas=[["Fecha","Tipo","Estado","Concepto","De dónde viene","Responsable","Cuenta","Valor","Soporte","Observaciones","Registro","Registró"]]
      .concat(sel.map(x=>[x.fecha,x.tipo,esProv(x)?"Por ejecutar":"Ejecutado",x.concepto,x.origen||"",x.responsable||"",x.medio,x.tipo==="egreso"?-x.valor:x.valor,x.soporte||"",x.obs||"",x.estado,x.registradoPor]));
    const csv="﻿"+filas.map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(";")).join("\r\n");
    try{ const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));
      a.download=`ingresos_egresos_${S.mov.desde}_a_${S.mov.hasta}.csv`; document.body.appendChild(a); a.click(); a.remove(); }catch(e){}
    if(S.db.demo) toast("Si no se descargó, es por el modo demo: en la versión instalada sí descarga.");
  },
});

/* ===================== Arranque ===================== */
// Instalar como app (solo en la versión publicada en internet)
try{ if("serviceWorker" in navigator && location.protocol==="https:" && !/claude/.test(location.hostname)) navigator.serviceWorker.register("sw.js"); }catch(e){}
(async function(){
  $("#modal").onclick=e=>{ if(e.target.id==="modal") cerrarModal(); };
  try{
    if(FIREBASE_CONFIG){ S.db=new FireStore(); await S.db.iniciar(); S.setup=await S.db.necesitaConfigurar(); }
    else S.db=new DemoStore();
    S.yo=await S.db.restaurar(); if(S.yo){ S.vista=P().vistas[0]; suscribirTodo(); }
  }catch(e){ $("#app").innerHTML=`<div class="login card"><h2>No se pudo conectar</h2><p>${esc(e.message)}</p><p class="mu">Revise la conexión a internet y la configuración de Firebase.</p></div>`; return; }
  render();
  setInterval(()=>{ if(S.yo&&["mesas","cocina"].includes(S.vista)&&!S.ped&&$("#modal").style.display!=="flex") render(); },30000);
})();
</script>
