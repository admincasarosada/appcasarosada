      <div class="pr-lista">${lista.map(x=>{ const n=cantDe(x.id);
        return `<div class="pr-fila ${n?"con":""}"><span class="pr-nom">${esc(x.nombre)}<br><b style="color:var(--rosa)">${money(precioProducto(x,llevar))}</b>${q?`<span class="mu" style="font-size:11px"> · ${esc(x.categoria||"Otros")}</span>`:""}</span>
          <span class="pr-ctl">${n?`<span class="pr-step"><button onclick="accion.prodCant('${x.id}',-1)" aria-label="Quitar uno">−1</button><b>${n}</b><button onclick="accion.prodCant('${x.id}',1)" aria-label="Agregar uno">+1</button></span>`:`<button class="pri" onclick="accion.prodCant('${x.id}',1)">Agregar</button>`}</span></div>`; }).join("")||`<p class="mu" style="padding:8px">No se encontraron productos.</p>`}</div>
    </div>`}
    <div class="row" style="margin-top:12px"><span class="mu">${total?`${total} producto(s) en el pedido`:""}</span><span class="sp"></span><button class="pri" onclick="cerrarModal();render()">Listo</button></div>`,true);
}

function planoSalon(salon,ms,soloVer){
  const pl=PLANOS[salon]; if(!pl) return "";
  const pct=(v,t)=>(v/t*100).toFixed(3)+"%";
  // Los botones se agrandan un poco alrededor del recuadro del croquis para que sea fácil tocarlos
  const box=([x,y,w,h])=>{ const ex=Math.max(4,w*.06), ey=Math.max(5,h*.18); return `left:${pct(x-ex,pl.w)};top:${pct(y-ey,pl.h)};width:${pct(w+2*ex,pl.w)};height:${pct(h+2*ey,pl.h)}`; };
  return `<div style="margin:4px 0 12px"><div class="plano" style="aspect-ratio:${pl.w}/${pl.h};max-width:${pl.w>pl.h?900:620}px">
    <img class="fondo" src="${pl.img}" alt="Plano ${esc(salon)}">
    ${ms.map(m=>{ const pos=pl.mesas[String(m.nombre).trim()]; if(!pos) return ""; const v=valeDeMesa(m.id), vp=!v&&valePagoMesa(m.id);
      if(vp) return `<button class="pmesa st-pago ${pos[4]?"vert":""}" style="${box(pos)}" onclick="${soloVer?`resumenTicket('${vp.id}')`:`accion.abrirMesa('${m.id}')`}" title="Mesa ${esc(m.nombre)}">
        <span class="pin"><span class="pn">Mesa ${esc(m.nombre)}</span><span class="pw">💵 Pendiente pago</span><span class="pc"><span class="crono fijo">👤 ${esc(String(responsable(vp)).split(" ")[0])}</span></span></span></button>`;
      const est="";
      return `<button class="pmesa ${claseEstado(v)} ${pos[4]?"vert":""}" style="${box(pos)}" onclick="${soloVer?(v?`resumenTicket('${v.id}')`:""):`accion.abrirMesa('${m.id}')`}" title="Mesa ${esc(m.nombre)}">
        <span class="pin"><span class="pn">Mesa ${esc(m.nombre)}</span>${v?`<span class="pw">👤 ${esc(String(responsable(v)).split(" ")[0])}</span><span class="pc">${estadoCrono(v)}</span>`:""}</span></button>`; }).join("")}
  </div></div>`;
}
// Cambio de numeración de mesas (23 nov 2026). Solo se aplica si las mesas siguen con la numeración vieja.
const RENUMERAR_MESAS={"Primer piso":{"14":"12","13":"17","12":"18","23":"19","24":"20"},"Segundo piso":{"17":"21","18":"22","19":"23","20":"24","21":"25","22":"26"}};
const numeracionVieja = () => S.mesas.some(m=>m.salon==="Primer piso"&&String(m.nombre).trim()==="23")&&S.mesas.some(m=>m.salon==="Segundo piso"&&String(m.nombre).trim()==="17");
Object.assign(accion,{
  async renumerarMesas(){ if(S.yo.rol!=="admin") return; if(!numeracionVieja()) return toast("Las mesas ya tienen la numeración nueva");
    if(!(await confirmar("Aplicar la numeración nueva: se crean las mesas 13 y 14 del primer piso y se renumeran 12→18, 13→17, 14→12, 23→19, 24→20 (primer piso) y 17→21 … 22→26 (segundo piso). Los tickets abiertos conservan su mesa.","Aplicar"))) return;
    try{ const cambios=S.mesas.map(m=>({m,n:RENUMERAR_MESAS[m.salon]?.[String(m.nombre).trim()]})).filter(x=>x.n);
      for(const {m,n} of cambios){ await S.db.actualizar("mesas",m.id,{nombre:n,orden:Number(n)});
        for(const v of S.valesAbiertos.filter(v=>v.mesaId===m.id)) await S.db.actualizar("vales",v.id,{mesaNombre:n,actualizado:Date.now()}); }
      for(const n of ["13","14"]) await S.db.poner("mesas","p1-mesa-"+n,{nombre:n,salon:"Primer piso",orden:Number(n)});
      toast(`✅ Numeración aplicada: ${cambios.length} mesas renumeradas y 2 nuevas`); render(); }
    catch(e){ toast("Error: "+e.message); } },
  async cargarPlano(salon){
    const pl=PLANOS[salon]; if(!pl) return;
    const nums=Object.keys(pl.mesas);
    const existentes=S.mesas.filter(m=>nums.includes(String(m.nombre).trim()));
    if(!(await confirmar(`Se ubicarán ${nums.length} mesas (${nums.sort((a,b)=>a-b).join(", ")}) en el plano de «${salon}». ${existentes.length} ya existen y solo se reubicarán; las demás se crean. Las otras mesas no se tocan.`,"Cargar plano"))) return;
    let creadas=0, movidas=0;
    for(const n of nums){ const [x,y,w,h]=pl.mesas[n], d={salon,x,y,w,h,orden:Number(n)};
      const m=S.mesas.find(k=>String(k.nombre).trim()===n);
      if(m){ await S.db.actualizar("mesas",m.id,d); movidas++; } else { await S.db.agregar("mesas",{nombre:n,...d}); creadas++; } }
    S.salon=salon; S.vistaMesas="plano"; toast(`Plano cargado: ${creadas} mesas creadas, ${movidas} reubicadas`); render();
  },
});

// Reduce una foto de la cámara a JPEG liviano (para guardarla como soporte)
function comprimirFoto(file,max=1100,cal=.6){ return new Promise((ok,mal)=>{ const fr=new FileReader(); fr.onerror=mal;
  fr.onload=()=>{ const im=new Image(); im.onerror=mal; im.onload=()=>{ const k=Math.min(1,max/Math.max(im.width,im.height)), c=document.createElement("canvas");
    c.width=Math.round(im.width*k); c.height=Math.round(im.height*k); c.getContext("2d").drawImage(im,0,0,c.width,c.height); ok(c.toDataURL("image/jpeg",cal)); }; im.src=fr.result; };
  fr.readAsDataURL(file); }); }

/* ===================== NOTIFICACIONES PUSH (llegan aunque la app esté cerrada) =====================
   Cada celular con notificaciones permitidas se suscribe (Web Push) y queda en la colección pushSubs.
   Quien hace un cambio en un ticket calcula a quién le toca enterarse (las mismas reglas de los avisos en pantalla)
   y le pide al servidor de notificaciones (Cloudflare Worker, ver push/) que se los envíe. */
const PUSH={url:"",clave:null,listo:false};
async function pushIniciar(){ if(PUSH.listo) return PUSH.url; PUSH.listo=true;
  try{ const r=await fetch("push-config.json?t="+Date.now(),{cache:"no-store"}); if(r.ok) PUSH.url=((await r.json()).url||"").replace(/\/$/,""); }catch(e){}
  return PUSH.url; }
const idSub = ep => { let h=0; for(const ch of ep){ h=(h*31+ch.charCodeAt(0))|0; } return "s"+(h>>>0).toString(36)+ep.length.toString(36)+ep.slice(-24).replace(/[^a-zA-Z0-9]/g,""); };
async function pushSuscribir(){
  try{ if(!S.yo||S.db.demo||S.modoPruebas||!("serviceWorker" in navigator)||!("PushManager" in window)||Notification.permission!=="granted") return;
    if(!(await pushIniciar())) return;
    if(!PUSH.clave){ const r=await fetch(PUSH.url+"/vapid"); PUSH.clave=(await r.json()).publicKey; } if(!PUSH.clave) return;
    const reg=await navigator.serviceWorker.ready; let sub=await reg.pushManager.getSubscription();
    if(!sub) sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:Uint8Array.from(atob(PUSH.clave.replace(/-/g,"+").replace(/_/g,"/")),c=>c.charCodeAt(0))});
    const j=sub.toJSON(); PUSH.miSub=idSub(j.endpoint);
    await S.db.fs.collection("pushSubs").doc(PUSH.miSub).set({uid:S.yo.id,nombre:S.yo.nombre,rol:S.yo.rol,endpoint:j.endpoint,keys:j.keys,ua:navigator.userAgent.slice(0,120),actualizado:Date.now()});
  }catch(e){ console.warn("push",e); } }
async function pushQuitar(){ try{ if(PUSH.miSub&&S.db?.fs) await S.db.fs.collection("pushSubs").doc(PUSH.miSub).delete(); }catch(e){} }
async function pushCambio(antes,despues){
  try{ if(!S.yo||S.db.demo||S.modoPruebas||!(await pushIniciar())) return;
    const destino={};
    for(const u of (S.usuarios||[]).filter(u=>u.activo!==false&&u.id!==S.yo.id)){ const out=[]; revisarAvisosDe(antes?[antes]:[],[despues],u,out); if(out.length) destino[u.id]=out; }
    const uids=Object.keys(destino); if(!uids.length) return;
    const subs=(await S.db.fs.collection("pushSubs").where("uid","in",uids.slice(0,30)).get()).docs.map(d=>({id:d.id,...d.data()}));
    const msgs=[]; for(const uid of uids){ const ss=subs.filter(x=>x.uid===uid).map(x=>({id:x.id,endpoint:x.endpoint,keys:x.keys})); if(!ss.length) continue;
      for(const a of destino[uid]) msgs.push({subs:ss,payload:{t:a.t,d:String(a.d||"").replace(/<[^>]+>/g,""),k:a.k}}); }
    if(!msgs.length) return;
    const token=await S.db.auth.currentUser.getIdToken();
    const r=await fetch(PUSH.url+"/notify",{method:"POST",headers:{"Content-Type":"application/json",Authorization:"Bearer "+token},body:JSON.stringify({msgs})});
    const j=await r.json().catch(()=>({})); for(const id of (j.gone||[])) S.db.fs.collection("pushSubs").doc(id).delete().catch(()=>{});
  }catch(e){ console.warn("push",e); } }

function semillaPruebas(){
  const db={users:{},mesas:{},productos:{},vales:{},movimientos:{},menus:{},clientes:{},config:{negocio:{...S.negocio}},_contador:0};
  [[(S.realYo?.nombre||S.yo?.nombre||"Admin")+" (pruebas)","admin"],["Andrés","mesero"],["Tania","mesero"],["Mateo","mesero"],["Cocina","cocina"],["Caja","cajero"]]
    .forEach(([n,r],k)=>db.users["p"+k]={usuario:n.toLowerCase().split(" ")[0],pass:"",nombre:n,rol:r,activo:true});
  Object.entries(PLANOS).forEach(([salon,pl])=>Object.keys(pl.mesas).forEach(n=>db.mesas[rid()]={nombre:n,salon,orden:Number(n)}));
  [["Gaseosa","Bebidas",3500,false],["Agua","Bebidas",2500,false],["Jugo natural","Bebidas",5000,true],["Limonada de coco","Bebidas",7000,true],
   ["Arroz con leche","Postres",4000,false],["Helado sencillo","Postres",4000,false],["Kit velita para pintar","Velitas",8000,false]]
    .forEach(([n,c,p,k],i)=>db.productos[rid()]={nombre:n,categoria:c,precio:p,cocina:k,activo:true,orden:i});
  const menu=menuEstandar;
  const hoy=hoyISO(); db.menus[hoy]=menu(hoy); const sig=siguienteLaboral(hoy); db.menus[sig]=menu(sig);
  return db;

/* ===================== Aviso de versión nueva ===================== */
async function revisarVersion(){
  if(location.protocol!=="https:"||/claude/.test(location.hostname)) return;
  try{ const r=await fetch("version.json?t="+Date.now(),{cache:"no-store"}); if(!r.ok) return; const j=await r.json();
    if(j.version&&j.version!==APP_VERSION){ if(S.nuevaVersion!==j.version){ S.nuevaVersion=j.version; render(); } actualizarSiSePuede(); } }catch(e){} }
// Se actualiza sola en cuanto no haya nada a medio hacer: sin pedido abierto, sin ventana abierta y sin estar escribiendo
function libreParaActualizar(){ const ae=document.activeElement, escribiendo=ae&&/^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName);
  return !S.ped&&$("#modal")?.style.display!=="flex"&&!escribiendo; }
let esperandoAct=null;
function actualizarSiSePuede(){
  if(libreParaActualizar()){ try{ sessionStorage.setItem("crx_actualizada",S.nuevaVersion||""); }catch(e){} toast("🔄 Actualizando la app…");
    // Evita recargar en bucle si el servidor aún entrega la versión anterior (espera 1 minuto entre intentos)
    try{ const ult=JSON.parse(sessionStorage.getItem("crx_intento")||"{}"); if(ult.v===S.nuevaVersion&&Date.now()-ult.t<60000) return; sessionStorage.setItem("crx_intento",JSON.stringify({v:S.nuevaVersion,t:Date.now()})); }catch(e){}
    setTimeout(async()=>{ try{ const rs=await navigator.serviceWorker?.getRegistrations(); for(const r of rs||[]) await r.update(); }catch(e){}
      const u=new URL(location.href); u.searchParams.set("v",S.nuevaVersion||Date.now()); location.replace(u.toString()); },800); return; }
  if(!esperandoAct) esperandoAct=setInterval(()=>{ if(libreParaActualizar()){ clearInterval(esperandoAct); esperandoAct=null; actualizarSiSePuede(); } },5000); }
setInterval(revisarVersion,60*1000);
document.addEventListener("visibilitychange",()=>{ if(!document.hidden) revisarVersion(); });
setTimeout(revisarVersion,4000);
setTimeout(()=>{ try{ const v=sessionStorage.getItem("crx_actualizada"); if(v){ sessionStorage.removeItem("crx_actualizada"); toast("✅ App actualizada a la versión "+APP_VERSION); } }catch(e){} },1500);

/* ===================== Hora común para todos los equipos =====================
   Cada celular o computador puede tener el reloj corrido unos minutos. Para que los tiempos de espera
   (cocina, en curso) y las horas registradas coincidan en todos, la app se sincroniza con la hora del servidor. */
const _ahoraLocal=Date.now.bind(Date); let DESFASE=0;
Date.now=()=>_ahoraLocal()+DESFASE;
async function sincronizarHora(){ try{ await pushIniciar(); const base=PUSH.url||"https://casarosada-push.admin-casarosada.workers.dev";
  const t0=_ahoraLocal(); const r=await fetch(base+"/time",{cache:"no-store"}); const j=await r.json(); const t1=_ahoraLocal();
  if(j.t&&t1-t0<5000){ DESFASE=Math.round(j.t+(t1-t0)/2-t1); } }catch(e){} }
sincronizarHora(); setInterval(sincronizarHora,10*60*1000);

  render();
  setInterval(()=>{ if(S.yo&&["mesas","cocina","estado","solicitudes","domicilios"].includes(S.vista)&&!S.ped&&$("#modal").style.display!=="flex") render(); },30000);
})();
