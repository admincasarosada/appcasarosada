<style>
/* Paleta del logo oficial: fucsia, rosa hoja, negro y blanco */
:root{--st-pago:#e53935;--st-ocup:#ff6b6b;--st-cocina:#ffb74d;--st-listo:#fff176;--st-camino:#64b5f6;--st-serv:#c9efcf;--rosa:#e5168d;--rosa-h:#c80f78;--rosa2:#e58fbf;--rosa3:#fbe3ef;--negro:#1d1d1b;

--libre:#ffffff;--libre-b:#1d1d1b;--ocup:#f6c4de;--ocup-tx:#1d1d1b;--cuenta:#e5168d;--listo:#2e9e5b;--rojo:#d32f2f;--azul:#3d5afe;--amar:#fff4e5;--banner:#fdeef6;--banner-b:#f3bfdc}

--bg:#141214;--card:#1f1b1e;--tx:#f3eef1;--mu:#a7999f;--ln:#3a3036;--hd:#1a1719;--btn:#2d262b;--inp:#2a2328;

body,header,nav,.card,.mesa,input,select,textarea,button{transition:background-color .2s,color .2s,border-color .2s}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tx);font-size:15px}
/* Modo claro: fondo blanco en Cocina y En curso para que resalten las tarjetas rosadas */
:root:not([data-tema="oscuro"]) body.fondo-blanco{background:#fff}
:root:not([data-tema="oscuro"]) body.fondo-blanco .card:not(.pz){border:1px solid #f1d3e0;box-shadow:none}
button{font:inherit;cursor:pointer;border:0;border-radius:8px;padding:10px 14px;background:var(--btn);color:var(--tx)}
button.pri:hover{background:var(--rosa-h)}
button.pri{background:var(--rosa);color:#fff}button.ok{background:var(--listo);color:#fff}
button.warn{background:var(--cuenta);color:#fff}button.dan{background:var(--rojo);color:#fff}
button.az{background:var(--azul);color:#fff}button:disabled{opacity:.45;cursor:not-allowed}
button.sm{padding:6px 10px;font-size:13px}
input,select,textarea{font:inherit;padding:10px;border:1px solid var(--ln);border-radius:8px;width:100%;background:var(--inp);color:var(--tx)}
input:focus,select:focus{outline:2px solid var(--rosa2);border-color:var(--rosa)}
label{font-size:13px;color:var(--mu);display:block;margin:8px 0 4px}
.top{position:sticky;top:0;z-index:5;box-shadow:0 2px 6px rgba(0,0,0,.06)}

header .logoimg{height:46px;width:auto;display:block;flex-shrink:0}

header button{background:var(--btn);color:var(--tx)}
.tema{font-size:18px;padding:6px 10px;line-height:1}

nav::-webkit-scrollbar{display:none}
nav button{background:var(--btn);border:1px solid var(--ln);border-bottom:none;border-radius:12px 12px 0 0;padding:10px 16px;font-weight:600;color:var(--tx);white-space:nowrap;flex-shrink:0;transition:background .15s,color .15s}
nav button:hover:not(.on){background:var(--rosa3);color:var(--rosa)}

nav .nav-sep{position:relative;flex:0 0 4px;width:4px;height:36px;align-self:center;margin:0 8px 6px;border-radius:4px;background:linear-gradient(180deg,var(--rosa),#b07cd8 50%,var(--azul));box-shadow:0 0 6px rgba(229,22,141,.25)}
nav.tabs-libres button[data-v]:not([data-v=mesas]):not([data-v=domicilios]):not([data-v=editar]),nav.tabs-libres .nav-sep{cursor:grab;outline:1.5px dashed var(--rosa);outline-offset:-3px}
nav.tabs-libres .nav-sep{width:10px;flex-basis:10px;margin:0 6px 6px}
nav .sep-x{position:absolute;top:-8px;left:50%;transform:translateX(-50%);background:#d32f2f;color:#fff;border-radius:50%;width:18px;height:18px;line-height:17px;text-align:center;font-size:13px;cursor:pointer}
nav .tab-mov{opacity:1}nav .tab-mov.abierto{background:#fff3cd;border-color:#f9a825}
nav button.tab-drag{opacity:.85;transform:scale(1.06);box-shadow:0 6px 18px rgba(0,0,0,.25);cursor:grabbing;z-index:2;outline:2px dashed var(--rosa)}
/* Computador: pestañas compactas y, si no caben, pasan a una segunda fila (en celular siguen igual, con desplazamiento) */
@media(min-width:641px){ nav{gap:3px;padding:5px 6px 0;flex-wrap:wrap;row-gap:3px;overflow-x:visible} nav button{padding:6px 8px;font-size:12.5px;border-radius:9px 9px 0 0;line-height:1.2}
  nav .badge{min-width:18px;padding:0 5px;font-size:11px} nav .nav-sep{height:26px;margin:0 4px 3px} }
nav button.on .badge.cero{background:rgba(255,255,255,.3);color:#fff}

.card{background:var(--card);border-radius:12px;padding:14px;box-shadow:0 1px 3px rgba(0,0,0,.08)}

.mesa .n{font-size:24px;font-weight:800}.mesa.ocup{background:var(--ocup);color:var(--ocup-tx);border-color:var(--rosa)}.mesa.cuenta{background:var(--cuenta);color:#fff;border-color:var(--rosa-h)}
.mesa .tag{font-size:12px;margin-top:auto}

@media(max-width:860px){.ped{grid-template-columns:1fr}}
.cats{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px}

.tot{font-size:22px;font-weight:800;display:flex;justify-content:space-between;margin:12px 0}
.kgrid{grid-template-columns:repeat(auto-fill,minmax(min(var(--kw,300px),100%),1fr));align-items:start;gap:var(--kg,10px)}
.kgrid>.kcard{zoom:var(--kz,1);padding:10px}
.k-split{display:grid;grid-template-columns:1fr 1fr;gap:22px;margin-top:6px}
.k-panel.k-llevar{position:relative}
.k-panel.k-llevar::before{content:"";position:absolute;left:-13px;top:4px;bottom:4px;width:4px;border-radius:4px;background:linear-gradient(180deg,var(--rosa),#b07cd8 50%,var(--azul));box-shadow:0 0 6px rgba(229,22,141,.25)}
.k-panel{min-width:0;background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:6px}
.k-panel.k-mesas{border-top:5px solid var(--rosa)}.k-panel.k-llevar{border-top:5px solid var(--azul)}
.k-ptit{font-weight:900;font-size:17px;padding:2px 6px 6px}.k-pn{display:inline-block;min-width:24px;text-align:center;border-radius:12px;padding:0 8px;background:var(--rosa3);font-size:14px}
.k-scroll{overflow-y:auto;overscroll-behavior:contain;padding:2px}
/* En celular los paneles no se deslizan por dentro: se desliza la página completa (antes «contain» bloqueaba el deslizamiento) */
@media (max-width:699px){ .k-scroll{overflow:visible;overscroll-behavior:auto;height:auto!important} .k-split{grid-template-columns:1fr} .k-panel.k-llevar::before{left:6px;right:6px;top:-13px;bottom:auto;width:auto;height:4px;background:linear-gradient(90deg,var(--rosa),#b07cd8 50%,var(--azul))} }
@media (min-width:700px) and (max-width:1100px){ .k-mesas .kgrid{grid-template-columns:repeat(2,minmax(0,1fr))!important}.k-mesas .kgrid>.kcard,.k-llevar .kgrid>.kcard{zoom:.8} }
.kcard .k-desp{border:0;font-weight:800;transition:background .4s}
.kcard.k-verde .k-desp{background:#2e9e5b;color:#fff}.kcard.k-amarillo .k-desp{background:#f9c400;color:#222}.kcard.k-rojo .k-desp{background:#e53935;color:#fff}
/* Cocina: pantalla completa, casi sin márgenes; las tarjetas se compactan según cuántos pedidos haya */
body.cocina-full main{max-width:none;padding:6px 8px}
body.vista-ancha main{max-width:none}

.kgrid.d0{--kw:330px;--kz:1}.kgrid.d1{--kw:280px;--kz:.93}.kgrid.d2{--kw:240px;--kz:.86;--kg:8px}.kgrid.d3{--kw:205px;--kz:.78;--kg:6px}
@media (max-width:700px){ .kgrid.d0{--kw:100%}.kgrid.d0>.kcard{zoom:1}
  .kgrid.d1,.kgrid.d2,.kgrid.d3{grid-template-columns:repeat(2,minmax(0,1fr));--kg:6px}.kgrid.d1>.kcard,.kgrid.d2>.kcard,.kgrid.d3>.kcard{zoom:.7;padding:8px}
  .kgrid .kcard .k-grid{grid-template-columns:auto 1fr}}
@media (min-width:701px) and (max-width:1100px){ .kgrid.d2{--kw:220px;--kz:.82}.kgrid.d3{--kw:190px;--kz:.74} }
/* Cocina en 4 columnas: 2 de mesas y 2 de domicilios/para llevar; se adapta al ancho del equipo */
.k-split .kgrid{grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:10px}.k-split .kgrid>.kcard{zoom:1}
@media (min-width:1100px) and (max-width:1450px){ .k-split .kgrid>.kcard{zoom:.86} }
@media (min-width:1600px){ .k-split .kgrid{grid-template-columns:repeat(3,minmax(0,1fr))!important}.k-split .kgrid>.kcard{zoom:.92} }
@media (min-width:2200px){ .k-split .kgrid>.kcard{zoom:1} }
@media (min-width:700px) and (max-width:1099px){ .k-split .kgrid{grid-template-columns:1fr!important}.k-split .kgrid>.kcard{zoom:.9} }
@media (max-width:699px){ .k-split .kgrid{grid-template-columns:1fr!important}.k-split .kgrid>.kcard{zoom:1} }
.k-pos{background:var(--negro);color:#fff;border-radius:8px;padding:2px 8px;font-weight:900;font-size:15px;margin-right:6px}

.kcard{border-top:8px solid var(--cuenta)}
.kcard.k-verde{outline:4px solid #2e9e5b;outline-offset:-2px}.kcard.k-amarillo{outline:4px solid #f9c400;outline-offset:-2px}

.k-leyenda{display:flex;gap:12px;flex-wrap:wrap;font-size:13px;margin-top:4px}.k-leyenda i{display:inline-block;width:14px;height:14px;border-radius:3px;vertical-align:-2px;margin-right:4px}.kcard.preparando{border-top-color:var(--azul)}.kcard.listo{border-top-color:var(--listo)}
.kcard li{font-size:17px;margin:4px 0}.kcard li.nw{font-weight:800}.kcard .nota{color:var(--rojo);font-size:14px}

.sello.an{border-color:var(--rojo);color:var(--rojo)}.sello.ab{border-color:var(--cuenta);color:var(--cuenta)}
.login{max-width:380px;margin:8vh auto}
.login h1{color:var(--rosa);margin:0 0 4px}
.login .logo-big{display:block;margin:0 auto 10px;max-width:260px;width:80%}
#app > .tema{position:fixed;top:14px;right:14px}

.lt-p.act .lt-c{background:#ef6c00;border-color:#ef6c00;color:#fff;animation:ltp 1.4s infinite}.lt-p.act{color:#ef6c00;font-weight:700}.lt-p.act .lt-t{color:#ef6c00}

function toast(m){ const t=$("#toast"); t.textContent=m; t.style.display="block"; clearTimeout(t._h); t._h=setTimeout(()=>t.style.display="none",2600); }
function modal(html,ancho=false){ $("#modal-body").classList.toggle("ancho",!!ancho); $("#modal-body").innerHTML=html; $("#modal").style.display="flex"; montarAyudas($("#modal-body")); }
/* Textos explicativos (.expl): quedan ocultos y se ven con el ícono ⓘ arriba a la derecha de su tarjeta, sin salir de la pantalla */
function montarAyudas(raiz=document){ const grupos=new Map(); S.ayudaAb=S.ayudaAb||new Set();
  raiz.querySelectorAll(".expl:not(.expl-ok)").forEach(el=>{ const c=el.closest(".md-bloque,.card,.kcard,#modal-body")||el.parentElement; if(!c) return;
    if(!grupos.has(c)) grupos.set(c,[]); grupos.get(c).push(el); });
  grupos.forEach((els,c)=>{ els.forEach(e=>e.classList.add("expl-ok"));
    const clave=els.map(e=>e.textContent.trim()).join("|").slice(0,120);
    let b=c.querySelector(":scope > .ayuda-b"); if(b) return; // ya tiene ícono
    if(getComputedStyle(c).position==="static") c.style.position="relative";
    const pop=document.createElement("div"); pop.className="ayuda-pop"; pop.innerHTML=els.map(e=>`<div>${e.innerHTML}</div>`).join("");
    b=document.createElement("button"); b.type="button"; b.className="ayuda-b"; b.title="Instrucciones"; b.setAttribute("aria-label","Ver instrucciones"); b.textContent="i";
    const abrir=on=>{ pop.classList.toggle("on",on); b.classList.toggle("on",on); if(on) S.ayudaAb.add(clave); else S.ayudaAb.delete(clave); };
    b.onclick=ev=>{ ev.stopPropagation(); abrir(!pop.classList.contains("on")); };
    pop.onclick=ev=>{ if(ev.target.tagName!=="A") abrir(false); };
    const h=[...c.children].find(x=>!x.classList.contains("expl")); if(h&&h.offsetHeight<90) h.style.paddingRight="30px"; else if(h&&c.id!=="modal-body") c.style.paddingTop="38px"; // que el ícono no tape lo de la derecha del encabezado
    c.prepend(pop); c.prepend(b); if(S.ayudaAb.has(clave)) abrir(true); }); }
function cerrarModal(){ $("#modal").style.display="none"; $("#modal-body").innerHTML=""; }
function confirmar(msg, okTxt="Aceptar"){
  return new Promise(res=>{
    modal(`<p>${esc(msg)}</p><div class="row"><span class="sp"></span><button id="m-no">Cancelar</button><button class="pri" id="m-si">${esc(okTxt)}</button></div>`);
    $("#m-no").onclick=()=>{cerrarModal();res(false)}; $("#m-si").onclick=()=>{cerrarModal();res(true)};
  });
}
function pedirTexto(msg, ph=""){
  return new Promise(res=>{
    modal(`<p>${esc(msg)}</p><input id="m-tx" placeholder="${esc(ph)}"><div class="row" style="margin-top:12px"><span class="sp"></span><button id="m-no">Cancelar</button><button class="pri" id="m-si">Aceptar</button></div>`);
    $("#m-tx").focus();
    $("#m-no").onclick=()=>{cerrarModal();res(null)}; $("#m-si").onclick=()=>{const v=$("#m-tx").value.trim();cerrarModal();res(v||null)};
  });
}

/* ===================== Modo claro / oscuro ===================== */
function temaActual(){ let t=null; try{ t=localStorage.getItem("crx_tema"); }catch(e){}
  return t||(window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches?"oscuro":"claro"); }
function aplicarTema(t){ document.documentElement.setAttribute("data-tema",t);
  const m=document.querySelector('meta[name="theme-color"]'); if(m) m.content=t==="oscuro"?"#1a1719":"#e5168d"; }
function cambiarTema(){ const t=temaActual()==="oscuro"?"claro":"oscuro"; try{ localStorage.setItem("crx_tema",t); }catch(e){} aplicarTema(t); render(); }
function botonTema(){ const o=temaActual()==="oscuro"; return `<button class="tema" onclick="cambiarTema()" title="${o?"Cambiar a modo claro":"Cambiar a modo oscuro"}" aria-label="${o?"Modo claro":"Modo oscuro"}">${o?"☀️":"🌙"}</button>`; }
aplicarTema(temaActual());

/* ===================== Capa de datos: MODO DEMO ===================== */
class DemoStore{
  constructor(key="crx_pos_demo_v1",sem=semilla){ this.key=key; this.sem=sem; this.ls={}; this.mem=null; this.cargar();
    window.addEventListener("storage",e=>{ if(e.key===this.key){ this.cargar(); this.emitirTodo(); } }); }
  get demo(){ return true; }
  cargar(){ let d=null; try{ d=JSON.parse(localStorage.getItem(this.key)); }catch(e){} this.db=d||this.mem||this.sem(); if(!d) this.guardar(); }
  guardar(){ this.mem=this.db; try{ localStorage.setItem(this.key,JSON.stringify(this.db)); }catch(e){} }
  lista(c,f=[]){ return Object.entries(this.db[c]||{}).map(([id,v])=>({id,...v})).filter(d=>f.every(([k,op,v])=>{
      const x=k.split(".").reduce((o,p)=>o?.[p],d); return op==="=="?x===v:op==="array-contains"?Array.isArray(x)&&x.includes(v):op===">="?x>=v:op==="<="?x<=v:op==="<"?x<v:true; })); }
  emitir(c){ (this.ls[c]||[]).forEach(l=>l.cb(this.lista(c,l.f))); }
  emitirTodo(){ Object.keys(this.ls).forEach(c=>this.emitir(c)); }
  suscribir(c,cb,f=[]){ const l={cb,f}; (this.ls[c]=this.ls[c]||[]).push(l); cb(this.lista(c,f)); return ()=>{ this.ls[c]=this.ls[c].filter(x=>x!==l); }; }
  suscribirDoc(c,id,cb){ return this.suscribir(c,d=>cb(d.find(x=>x.id===id)||null)); }
  async consultar(c,f=[]){ return this.lista(c,f); }
  async agregar(c,d){ const id=rid(); (this.db[c]=this.db[c]||{})[id]=d; this.guardar(); this.emitir(c); return id; }
  async poner(c,id,d){ (this.db[c]=this.db[c]||{})[id]=d; this.guardar(); this.emitir(c); }
  async actualizar(c,id,p){ Object.assign(this.db[c][id],p); this.guardar(); this.emitir(c); }
  async borrar(c,id){ delete this.db[c][id]; this.guardar(); this.emitir(c); }
  async siguienteNumero(){ this.db._contador=(this.db._contador||0)+1; this.guardar(); return this.db._contador; }

/* ===================== Capa de datos: FIREBASE (en línea) ===================== */
function cargarScript(src){ return new Promise((ok,err)=>{ const s=document.createElement("script"); s.src=src; s.onload=ok; s.onerror=()=>err(new Error("No se pudo cargar "+src)); document.head.appendChild(s); }); }
const ENSAYO_COLS = ["vales","movimientos","soportes","creditoMovs","clientes","menus","cierres","soportesMov","arqueos"];
class FireStore{
  get demo(){ return false; }
  async iniciar(){
    const v="10.12.2", b=`https://www.gstatic.com/firebasejs/${v}/`;
    await cargarScript(b+"firebase-app-compat.js"); await cargarScript(b+"firebase-auth-compat.js"); await cargarScript(b+"firebase-firestore-compat.js");
    this.app=firebase.initializeApp(FIREBASE_CONFIG); this.auth=firebase.auth(); this.fs=firebase.firestore();
    try{ await Promise.race([this.fs.enablePersistence({synchronizeTabs:true}),new Promise(r=>setTimeout(r,3000))]); }catch(e){}
  }
  // Firebase exige mínimo 6 caracteres: las claves cortas (3 a 5) se completan internamente con un sufijo fijo.
  // Las claves de 6 o más se usan tal cual (así siguen funcionando los usuarios ya creados).
  clave(p){ p=String(p||""); return p.length<6 ? p+"·CR-pos" : p; }
  correo(u){ return u.toLowerCase().trim().replace(/[^a-z0-9._-]/g,"")+"@"+DOMINIO_USUARIOS; }
  // Modo «Simular operación real»: la operación del día va a colecciones de ensayo, separadas de los registros reales
  col(c){ return this.ensayo&&ENSAYO_COLS.includes(c)?"ensayo_"+c:c; }
  q(c,f){ let r=this.fs.collection(this.col(c)); f.forEach(([k,op,v])=>r=r.where(k,op,v)); return r; }
  suscribir(c,cb,f=[]){ return this.q(c,f).onSnapshot(s=>cb(s.docs.map(d=>({id:d.id,...d.data()}))),e=>console.error(c,e)); }
  suscribirDoc(c,id,cb,onErr){ return this.fs.collection(this.col(c)).doc(id).onSnapshot({includeMetadataChanges:true},d=>cb(d.exists?{id:d.id,...d.data()}:null,d.metadata.hasPendingWrites),e=>{ console.error(c+"/"+id,e); if(onErr) onErr(e); }); }
  async consultar(c,f=[]){ const s=await this.q(c,f).get(); return s.docs.map(d=>({id:d.id,...d.data()})); }
  async agregar(c,d){ const r=await this.fs.collection(this.col(c)).add(d); if(c==="vales") pushCambio(null,{id:r.id,...d}); return r.id; }
  async poner(c,id,d){ await this.fs.collection(this.col(c)).doc(id).set(d); }
  async actualizar(c,id,p){ const antes=c==="vales"?buscarVale(id):null; await this.fs.collection(this.col(c)).doc(id).update(p); if(antes) pushCambio({...antes},{...antes,...p}); }
  async borrar(c,id){ await this.fs.collection(this.col(c)).doc(id).delete(); }
  async siguienteNumero(){ const ref=this.ensayo?this.fs.collection("ensayo_config").doc("contador"):this.fs.collection("config").doc("contador");
    return this.fs.runTransaction(async t=>{ const s=await t.get(ref); const n=(s.exists?s.data().n:0)+1; t.set(ref,{n}); return n; }); }
  async necesitaConfigurar(){ const s=await this.fs.collection("config").doc("setup").get(); return !s.exists; }
  async configurarPrimerAdmin({usuario,pass,nombre}){
    const cred=await this.auth.createUserWithEmailAndPassword(this.correo(usuario),this.clave(pass)); const uid=cred.user.uid;
    const b=this.fs.batch();
    b.set(this.fs.collection("users").doc(uid),{usuario:usuario.toLowerCase().trim(),nombre,rol:"admin",activo:true});
    b.set(this.fs.collection("config").doc("setup"),{fecha:Date.now()});
    b.set(this.fs.collection("config").doc("negocio"),{nombre:"Casa Rosada Xuacha",nit:"",direccion:"",telefono:"",pie:"Gracias por su visita"});
    await b.commit(); return {id:uid,usuario,nombre,rol:"admin",activo:true};
  }
  async perfil(uid){ const s=await this.fs.collection("users").doc(uid).get(); return s.exists?{id:uid,...s.data()}:null; }
  /* Cada usuario tiene una "cuenta de acceso" en Firebase. Para que el administrador pueda cambiar claves y eliminar
     usuarios sin conocer la clave anterior, al cambiar la clave se crea una cuenta de acceso nueva y la anterior queda
     sin perfil (no puede hacer nada). La colección logins guarda qué cuenta usa cada nombre de usuario. */
  base(u){ return String(u).toLowerCase().trim().replace(/[^a-z0-9._-]/g,""); }
  async emailDe(u){ try{ const s=await this.fs.collection("logins").doc(this.base(u)).get(); if(s.exists&&s.data().email) return s.data().email; }catch(e){} return this.correo(u); }
  async nuevaCuenta(usuario,pass){
    const sec=firebase.apps.find(a=>a.name==="sec")||firebase.initializeApp(FIREBASE_CONFIG,"sec");
    let email=this.correo(usuario), cred;
    try{ cred=await sec.auth().createUserWithEmailAndPassword(email,this.clave(pass)); }
    catch(e){ if(!String(e.code).includes("email-already-in-use")) throw e;
      email=this.base(usuario)+"."+Date.now().toString(36)+"@"+DOMINIO_USUARIOS; cred=await sec.auth().createUserWithEmailAndPassword(email,this.clave(pass)); }
    await sec.auth().signOut(); return {uid:cred.user.uid,email};
  }
  async ingresar(u,p){
    let cred; try{ cred=await this.auth.signInWithEmailAndPassword(await this.emailDe(u),this.clave(p)); }
    catch(e){ throw new Error("Usuario o contraseña incorrectos"); }
    const x=await this.perfil(cred.user.uid); if(!x||x.activo===false){ await this.auth.signOut(); throw new Error("Usuario sin acceso o desactivado"); } return x;
  }
  restaurar(){ return new Promise(res=>{ const un=this.auth.onAuthStateChanged(async u=>{ un(); if(!u) return res(null); const x=await this.perfil(u.uid).catch(()=>null); res(x&&x.activo!==false?x:null); }); }); }
  async salir(){ await this.auth.signOut(); }
  async crearUsuario({usuario,pass,nombre,rol}){
    const b=this.base(usuario);
    if(S.usuarios.some(x=>x.usuario===b)) throw new Error("Ese usuario ya existe");
    const {uid,email}=await this.nuevaCuenta(usuario,pass);
    const w=this.fs.batch();
    w.set(this.fs.collection("users").doc(uid),{usuario:b,nombre,rol,activo:true});
    w.set(this.fs.collection("logins").doc(b),{email,uid});
    await w.commit(); return uid;
  }
  // El administrador cambia la clave de cualquier usuario sin conocer la anterior
  async cambiarClave(id,pass){
    if(S.yo?.rol!=="admin") throw new Error("Solo el administrador puede cambiar contraseñas");
    const x=S.usuarios.find(u=>u.id===id); if(!x) throw new Error("Usuario no encontrado");
    if(id===this.auth.currentUser?.uid){
      try{ await this.auth.currentUser.updatePassword(this.clave(pass)); return; }
      catch(e){ if(String(e.code).includes("recent-login")) throw new Error("Por seguridad, salga y vuelva a ingresar, y cambie su contraseña enseguida."); throw e; }
    }
    const {uid,email}=await this.nuevaCuenta(x.usuario,pass);
    const {id:_viejo,...datos}=x;
    const w=this.fs.batch();
    w.set(this.fs.collection("users").doc(uid),{...datos,claveCambiada:Date.now(),claveCambiadaPor:S.yo.nombre});
    w.set(this.fs.collection("logins").doc(this.base(x.usuario)),{email,uid});
    w.delete(this.fs.collection("users").doc(id));
    await w.commit();
  }
  async eliminarUsuario(id){
    const x=S.usuarios.find(u=>u.id===id); if(!x) return;
    const w=this.fs.batch();
    w.delete(this.fs.collection("users").doc(id));
    w.delete(this.fs.collection("logins").doc(this.base(x.usuario)));
    await w.commit();
  }
}

/* Cronómetro: <span class="crono" data-desde=…> se actualiza cada segundo; con data-hasta queda fijo */

  const U=unidadesVale(v); if(d.asig.length!==U.length) d.asig=U.map(()=>null);

/* ===================== Avisos (notificaciones) =====================
   Quedan en pantalla hasta que la persona toca ✅ (así queda claro que alguien lo leyó).
   · Mesero (o quien recibe): cuando cocina le despacha un pedido a su nombre.
   · Cocina: pedido nuevo, editado o con productos agregados.
   · Caja y administración: ticket nuevo para cobrar.
   Además suena, vibra y, si el celular lo permite, sale como notificación del sistema. */
const claveAvisos = () => "crx_avisos_"+(S.modoPruebas?"p_":"")+(S.yo?.id||"");
function cargarAvisos(){ try{ S.avisos=JSON.parse(localStorage.getItem(claveAvisos())||"[]"); }catch(e){ S.avisos=[]; } pintarAvisos(); }
function guardarAvisos(){ try{ localStorage.setItem(claveAvisos(),JSON.stringify(S.avisos.slice(0,40))); }catch(e){} }
const mismoNombre=(a,b)=>!!a&&!!b&&String(a).replace(/ \(pruebas\)$/,"").trim().toLowerCase()===String(b).replace(/ \(pruebas\)$/,"").trim().toLowerCase();
const lugarDe = v => servicioDe(v)==="mesa"?"Mesa "+v.mesaNombre:etiquetaVale(v).replace(/<[^>]+>/g,"").trim();
function avisar(a,u=S.yo){
  // En la operación real los avisos llegan como notificación push del celular (aunque la app esté cerrada),
  // así que no se repiten dentro de la app. En el modo de pruebas (sin servidor) se siguen mostrando aquí.
  const esCocinaYo=S.yo&&(S.yo.rol==="cocina"||S.vista==="cocina")&&(!u||u.id===S.yo.id);
  const real=!S.modoPruebas&&!S.db?.demo;
  // Cocina sí los ve dentro de la app (además de la push), pero se quitan solos a los 5 segundos
  if(real&&!(esCocinaYo&&["nuevo","cambio"].includes(a.tipo))) return;
  if(real){ S.avisos=S.avisos||[]; if(S.avisos.some(x=>x.k===a.k)) return; S.avisos.unshift({...a,ts:Date.now(),fugaz:true}); pintarAvisos(); beep(); setTimeout(()=>hablar(a.t),900);
    setTimeout(()=>{ S.avisos=(S.avisos||[]).filter(x=>x.k!==a.k); pintarAvisos(); },5000); return; }
  if(u&&S.yo&&u.id!==S.yo.id){ // otro perfil del modo de pruebas: queda guardado para cuando entre como ese usuario
    const key="crx_avisos_p_"+u.id; let xs=[]; try{ xs=JSON.parse(localStorage.getItem(key)||"[]"); }catch(e){}
    if(!xs.some(x=>x.k===a.k)){ xs.unshift({...a,ts:Date.now()}); try{ localStorage.setItem(key,JSON.stringify(xs.slice(0,40))); }catch(e){} } return; }
  S.avisos=S.avisos||[]; if(S.avisos.some(x=>x.k===a.k)) return;
  S.avisos.unshift({...a,ts:Date.now()}); guardarAvisos(); pintarAvisos();
  beep(); setTimeout(beep,320); try{ navigator.vibrate&&navigator.vibrate([300,120,300]); }catch(e){}
  try{ if("Notification" in window&&Notification.permission==="granted"&&navigator.serviceWorker)
    navigator.serviceWorker.ready.then(r=>r.showNotification("Casa Rosada · "+a.t.replace(/^\S+\s/,""),{body:a.d||"",icon:"icon-192.png",badge:"icon-192.png",tag:a.k,renotify:true,requireInteraction:true,vibrate:[300,120,300]})); }catch(e){}
}
function pintarAvisos(){ const c=$("#avisos"); if(!c) return; const xs=(S.yo&&(S.modoPruebas||S.db?.demo||S.yo.rol==="cocina"||S.vista==="cocina")&&S.avisos)||[];
  c.innerHTML=xs.length?`${xs.slice(0,4).map(a=>`<div class="aviso ${a.tipo}"><div class="av-txt"><b>${a.t}</b>${a.d?`<div>${a.d}</div>`:""}<span class="mu">${hora(a.ts)}</span></div>
    <button class="av-ok" title="Leído" onclick="accion.avisoLeido('${a.k}')">✅</button></div>`).join("")}
    ${xs.length>1?`<button class="av-todos" onclick="accion.avisosLeidos()">✅ Marcar ${xs.length} como leídos</button>`:""}`:""; }
function revisarAvisos(prev,d){
  if(!S.yo) return;
  // Los avisos de cobro desaparecen solos cuando el ticket ya se cobró, se anuló o volvió a estar en curso
  if(S.avisos?.length){ const pend=new Set(d.filter(v=>!enCurso(v)).map(v=>v.id)), n=S.avisos.length;
    S.avisos=S.avisos.filter(a=>!/^caja-/.test(a.k)||(a.vid&&pend.has(a.vid))); if(S.avisos.length!==n){ guardarAvisos(); pintarAvisos(); } }
  // En modo de pruebas todos los perfiles están en este mismo celular: se calcula el aviso de cada uno
  const perfiles=S.modoPruebas?S.db.lista("users").filter(u=>u.activo!==false):[S.yo];
  for(const u of perfiles) revisarAvisosDe(prev,d,u);
}
// Cómo se nombra cada pedido en los avisos de cocina
function etiquetaCocinaAviso(v){ const sv=servicioDe(v);
  return sv==="mesa"?`MESA ${String(v.mesaNombre||"").toUpperCase()}`:sv==="domicilio"?"DOMICILIO":sv==="llevar"?"PARA LLEVAR EN ICOPOR":sv==="plato"?"PARA LLEVAR EN PLATO":sv==="bebidas"?"BEBIDAS ESPECIALES":sv==="postres"?"POSTRES":"PRODUCTOS VARIOS"; }
function revisarAvisosDe(prev,d,u,out){
  const avisar_=a=>out?out.push(a):avisar(a,u);
  const yo=u.nombre, rol=u.rol, esCocina=rol==="cocina"||(u.id===S.yo.id&&S.vista==="cocina");
  for(const v of d){ const p=prev.find(x=>x.id===v.id);
    // 1) Cocina despachó: avisa a quien recibe (si no es un usuario, a quien tomó el pedido)
    const nd=(v.despachos||[]).length, pd=(p?.despachos||[]).length;
    if(p&&nd>pd){ const des=v.despachos[nd-1]; const dest=S.usuarios.some(u=>mismoNombre(u.nombre,des.quien))?des.quien:nombreMesero(v);
      if(!des.directo&&mismoNombre(dest,yo)&&rol!=="cocina") avisar_({k:`desp-${v.id}-${nd}`,tipo:"listo",t:`🍽 ${lugarDe(v)}: listo para entregar`,d:`Cocina te lo entregó · ticket ${pad(v.numero)}`}); }
    // 2) Cocina: pedido nuevo, editado o con productos agregados (no se avisa a quien lo hizo)
    if(esCocina&&pendienteCocina(v)){
      const pend=v.items.filter(i=>i.cocina&&i.ronda>rondaDesp(v)), autor=(pend.slice(-1)[0]?.por)||nombreMesero(v);
      if(!mismoNombre(autor,yo)){
        const lab=etiquetaCocinaAviso(v);
        if(!p) avisar_({k:`coc-${v.id}-${v.enviado||v.creado}`,tipo:"nuevo",t:`🆕 NUEVO PEDIDO ${lab}`,d:`Ticket No. ${pad(v.numero)} · ${pend.reduce((t,i)=>t+i.cant,0)} plato(s) · tomó ${esc(nombreMesero(v))}`});
        else if(v.enviado&&v.enviado!==p.enviado){ const ed=pend.some(i=>i.editado), lab2=servicioDe(v)==="mesa"?`PEDIDO ${lab}`:lab;
          avisar_({k:`coc-${v.id}-${v.enviado}`,tipo:ed?"cambio":"nuevo",t:ed?`✏️ CAMBIOS EN ${lab2} · No. ${pad(v.numero)}`:`➕ ADICIONES EN ${lab2} · No. ${pad(v.numero)}`,d:`Por ${esc(autor)}`}); } } }
    // 3) Caja y administración: ticket nuevo para cobrar
    // Solo cuando el ticket realmente pasa a cobro (enviado a caja por el mesero/domiciliario o entregado por cocina)
    if(perm("cobrar",rol)&&!enCurso(v)&&(v.enCaja||v.pidioCuenta)&&(!p||enCurso(p))&&!mismoNombre(v.enCajaPor,yo))
      avisar_({k:`caja-${v.id}-${v.enCajaEn||v.actualizado||""}`,vid:v.id,tipo:"cobro",t:`💵 Ticket para cobrar · ${lugarDe(v)}`,d:`Ticket ${pad(v.numero)} · ${money(v.total)}${v.pagoReportado?` · reportó ${esc(v.pagoReportado.medio)}`:""}`});
  }
}

function arrastrePestanas(){ const nav=document.querySelector("nav"); if(!nav) return; const fijas=FIJAS_TAB;
  nav.querySelectorAll("[data-v]").forEach(b=>{ if(fijas.includes(b.dataset.v)) return;

      const soltar=()=>{ fin(); if(!activo) return; b.classList.remove("tab-drag"); nav.style.overflowX="";

const tipoItem = i => String(i.pid).startsWith("alm-")?"alm":String(i.pid).startsWith("cesp-")?"cesp":String(i.pid).startsWith("beb-")?"bebidas":String(i.pid).startsWith("pos-")?"postres":i.pid==="envio"?"envio":"prod";
function elegirEditar(tipo,titulo,abrirNuevo){

        tipo==="cesp"?`<button class="sm pri" onclick="accion.cespEditar('${x.src}',${x.ix})">✏️ Editar</button>`:
        x.src==="nuevo"?`<button class="sm" onclick="accion.cant(${x.ix},-1);cerrarModal()">➖ Quitar uno</button>`:
        `<button class="sm" onclick="accion.quitarUno(${x.ix})">➖ Quitar uno</button>`}</div>`; }).join("")}
    <button style="width:100%;margin-top:10px" onclick="cerrarModal()">Cancelar</button>`);
  $("#ed-nuevo").onclick=()=>{ cerrarModal(); abrirNuevo(); };
}

    ["bebidasInc","🥤 Bebidas del día",bebidasInc(m)],["bebidas","🍹 Bebidas especiales",(m.bebidas||[]).map(x=>x.nombre)],["postres","🍰 Postres",(m.postres||[]).map(x=>x.nombre)]].filter(g=>g[2].length);

/* ---------- COCINA ---------- */
// Desglose completo del plato: proteína, sopa, acompañamientos (SIN en rojo, cambios y adicionales en azul) y precio
// Bebidas especiales, postres y demás productos de cocina: en el mismo formato de dos columnas, sin precio (el total va abajo)
function extrasCocina(xs){ if(!xs.length) return "";
  const chip=i=>i.editado?' <span class="k-chip cambio">✏️ CAMBIO</span>':(i.ronda||1)>1?' <span class="k-chip adic">➕ NUEVO</span>':"";
  const lin=i=>`<div><b>${i.cant} × ${esc(i.nombre)}</b>${chip(i)}${i.nota?`<div class="k-cambio" style="font-weight:800">📝 ${esc(i.nota)}</div>`:""}</div>`;
  const grupos=[["🍹","Bebidas esp.",xs.filter(i=>String(i.pid).startsWith("beb-"))],["🍰","Postres",xs.filter(i=>String(i.pid).startsWith("pos-"))],["🍽","Otros",xs.filter(i=>!/^(beb|pos)-/.test(String(i.pid)))]].filter(g=>g[2].length);
  return `<div class="it-k"><div class="k-grid">${grupos.map(([ic,t,g])=>`<div class="kg-l">${ic} ${t}</div><div class="kg-v">${g.map(lin).join("")}</div>`).join("")}</div></div>`; }
function platoCocina(i,v,adicional,n){
  const rojo=t=>`<b class="k-sin">${t}</b>`, azul=t=>`<b class="k-cambio">${t}</b>`;
  const precio=`<div class="k-precio"><span>${i.cant>1?`${i.cant} × ${money(i.precio)}`:"Precio"}${i.modo?` · ${esc(NOMBRE_MODO[i.modo]||i.modo)}`:""}</span><b>${money(i.precio*i.cant)}</b></div>`;
  const nota=i.nota?`<div class="k-linea">${azul("📝 "+esc(i.nota))}</div>`:"";
  const ad=i.editado?` <span class="k-chip cambio">✏️ CAMBIO</span>`:(i.ronda||1)>1?` <span class="k-chip adic">➕ NUEVO</span>`:"";
  if(esCesp(i)) return `<div class="it-k" style="border-left:4px solid #c29b4a"><div class="k-tit"><b>${i.cant} × ⭐ CLIENTE ESPECIAL</b>${i.cliente?` · <b>${esc(i.cliente)}</b>`:""}${ad}${i.llevar&&!esLlevarMesa(v.mesaId)?' <span class="dot" style="background:var(--azul)"><i class=ic-caja></i> PARA LLEVAR</span>':""}</div>
    <div class="k-grid">${i.sel?gruposCesp(S.menus.find(x=>x.id===i.menu)||menuHoy()).filter(([g])=>i.sel[g]).map(([g,ic,t])=>`<div class="kg-l">${ic} ${t}</div><div class="kg-v">${i.sel[g].map(x=>`<div><b>${g==="ent"&&x==="Cambio por huevo"?azul("Cambio por HUEVO"):esc(x)}</b></div>`).join("")}</div>`).join("")
      :`<div class="kg-l">📋 Armado</div><div class="kg-v">${String(i.detalle||"").split(/,\s*/).map(x=>`<div><b>${esc(x)}</b></div>`).join("")}</div>`}${i.nota?`<div class="kg-l">📝 Nota</div><div class="kg-v">${azul(esc(i.nota))}</div>`:""}</div>${precio}</div>`;
  if(!String(i.pid).startsWith("alm-")) return `<div class="it-k"><b>${i.cant} ×</b> ${esc(i.nombre)}${ad}${i.detalle?`<div class="det">${esc(i.detalle)}</div>`:""}${nota}${precio}</div>`;
  const m=S.menus.find(x=>x.id===i.menu), partes=String(i.detalle||"").split(" · ");
  const prot=i.proteina||String(i.nombre).replace(/^Almuerzo – /,"").replace(/ \(para llevar\)$/,"");
  let sopa=i.sopa; if(sopa==null&&m&&opcionesSopa(m).length) sopa=/^SIN (sopa|entrada)/.test(partes[0])?"SIN":partes[0];
  let acomp=i.acomp; if(!acomp&&m) acomp=m.acompanamientos.map(ac=>({n:ac,e:i.detalle.includes("SIN "+ac.toLowerCase())?"sin":i.detalle.includes(ac+" → HUEVO")?"huevo":"ok"}));
  // Dos columnas: a la izquierda qué es, a la derecha lo que lleva (un acompañamiento por línea)
  const lAc=(acomp||[]).map(a=>`<div>${a.e==="sin"?rojo("SIN "+esc(a.n.toLowerCase())):a.e==="huevo"?azul(esc(a.n)+" → HUEVO"):a.e==="add"?azul("+ "+esc(a.n)+" (cambio)"):a.e==="doble"?azul(esc(a.n)+" ×2 (porción doble)"):esc(a.n)}</div>`).join("");
  const ps=(i.proteinas&&i.proteinas.length?i.proteinas:String(prot).split(" + "));
  const beb=i.bebida?(i.bebida==="SIN"?rojo("SIN bebida"):`<b>${esc(i.bebida)}</b>`):(m?.bebidaIncluida&&i.bebida!==""?`<b>${esc(m.bebidaIncluida)}</b>`:"");
  const fila=(ic,t,val)=>`<div class="kg-l">${ic} ${t}</div><div class="kg-v">${val}</div>`;
  return `<div class="it-k"><div class="k-tit"><b>${i.cant} × ${i.especial?"⭐ ESPECIAL":"Almuerzo"}${n?` ${n}`:""}</b>${ad}${i.llevar&&!esLlevarMesa(v.mesaId)?' <span class="dot" style="background:var(--azul)"><i class=ic-caja></i> PARA LLEVAR</span>':""}</div>
    <div class="k-grid">
      ${sopa?fila("🥣","Entrada",sopa==="SIN"?rojo("SIN entrada"):sopa==="HUEVO"?azul("Cambio por HUEVO"):`<b>${esc(sopa)}</b>`):""}
      ${(i.sopaAdic||[]).length?fila("➕","Entrada adic.",i.sopaAdic.map(x=>`<div><b>${esc(x)}</b> <span class="kc-adic">ADICIONAL</span></div>`).join("")):""}
      ${fila(i.especial?"⭐":"🍗",ps.length>1?"Proteínas":i.especial?"Especial":"Proteína",[...new Set(ps)].map(x=>{ const c=ps.filter(y=>y===x).length; return `<div><b>${esc(x)}</b>${c>1?` <b class="k-cambio">×${c} DOBLE</b>`:""}</div>`; }).join(""))}
      ${acomp?fila("🍚","Acomp.",lAc||"—"):fila("📋","Detalle",esc(i.detalle||""))}
      ${beb?fila("🥤","Bebida",beb):""}
      ${i.nota?fila("📝","Nota",azul(esc(i.nota))):""}
    </div>${precio}</div>`;
}
// Cocina: vista compacta. Cada plato tal como debe salir (sin marcas de cambios, quitados ni precios por plato)
function servidoPlato(i){ const A=String(i.pid).startsWith("alm-");
  if(esCesp(i)){ const sl=i.sel||{}, prot=[...(sl.prot||[]),...(sl.esp||[])], l=[];
    if(sl.ent) l.push("Entrada: "+sl.ent.map(x=>x==="Cambio por huevo"?"huevo":x).join(" + ")); if(sl.acomp) l.push(sl.acomp.join(", ")); if(sl.beb) l.push("Bebida: "+sl.beb.join(" + "));

const isoLocal = t => { const x=new Date(t); return `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,"0")}-${String(x.getDate()).padStart(2,"0")}`; };

function repVentasDia(d,r){ const dias=[]; for(let t=new Date(r.desde+"T12:00:00");isoLocal(t)<=r.hasta&&dias.length<400;t.setDate(t.getDate()+1)) dias.push(isoLocal(t));
  const max=Math.max(1,...dias.map(k=>d.porDia[k]?.v||0));
  return `<div class="card" style="grid-column:1/-1"><h3 style="margin-top:0">📅 Ventas por día</h3><div style="overflow-x:auto"><table style="min-width:520px"><tr><th>Día</th><th class="r">Tickets</th><th class="r">Ventas</th><th style="width:40%"></th></tr>
    ${dias.map(k=>{ const x=d.porDia[k]||{c:0,v:0}; return `<tr><td>${DIAS_SEM[new Date(k+"T12:00:00").getDay()]} ${fechaCorta(k)}</td><td class="r">${x.c}</td><td class="r">${money(x.v)}</td><td><div style="height:10px;border-radius:5px;background:var(--rosa);width:${Math.round(x.v*100/max)}%"></div></td></tr>`; }).join("")}
    <tr style="background:var(--rosa3)"><td><b>Total</b> <span class="mu">· promedio diario ${money(d.total/dias.length)}</span></td><td class="r"><b>${d.pagados.length}</b></td><td class="r"><b>${money(d.total)}</b></td><td></td></tr></table></div></div>`; }
function repMovimientos(r){ const m=S.mov; if(!m.sub) movSuscribir();
  const en=(m.datos||[]).filter(x=>x.fecha>=r.desde&&x.fecha<=r.hasta&&vigente(x)&&x.concepto!=="Saldo inicial");
  const sum=(arr,f)=>arr.filter(f).reduce((a,x)=>a+x.valor,0), re=en.filter(x=>!esProv(x)), pv=en.filter(esProv);
  const ing=sum(re,x=>x.tipo==="ingreso"), gas=sum(re,x=>x.tipo==="egreso"&&!esNomina(x)), nom=sum(re,esNomina), prov=sum(pv,x=>x.tipo==="egreso");
  const porConc={}; re.filter(x=>x.tipo==="egreso").forEach(x=>{ const k=esNomina(x)?"Nómina":x.concepto; porConc[k]=porConc[k]||{c:0,v:0}; porConc[k].c++; porConc[k].v+=x.valor; });
  const cier=(m.cierres||[]).filter(c=>c.id>=r.desde&&c.id<=r.hasta&&c.cierre).sort((a,b)=>a.id.localeCompare(b.id));
  return `<div class="card" style="grid-column:1/-1"><h3 style="margin-top:0">💵 Ingresos y egresos del período</h3>
    <div class="grid kpis"><div class="card kpi"><div class="mu">Ingresos (ventas + otros)</div><div class="v" style="color:var(--listo)">${money(ing)}</div></div>
      <div class="card kpi"><div class="mu">Gastos</div><div class="v" style="color:var(--rojo)">${money(gas)}</div></div>
      <div class="card kpi"><div class="mu">Nómina</div><div class="v" style="color:var(--rojo)">${money(nom)}</div></div>
      <div class="card kpi"><div class="mu">Resultado</div><div class="v" style="${neg(ing-gas-nom)}">${money(ing-gas-nom)}</div></div>
      <div class="card kpi"><div class="mu">Por pagar (provisionado)</div><div class="v" style="color:var(--cuenta)">${money(prov)}</div></div></div>
    <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(300px,1fr));margin-top:10px">
      <div><b>Egresos por concepto</b>${tabla(porConc,"Concepto")}</div>
      <div><b>Cierres de caja</b><table><tr><th>Día</th><th class="r">Calculado</th><th class="r">Contado</th><th class="r">Diferencia</th></tr>
        ${cier.map(c=>{ const calc=CUENTAS.reduce((a,k)=>a+Number(c.cierre.calculado?.[k]||0),0), cont=CUENTAS.reduce((a,k)=>a+Number(c.cierre.contado?.[k]||0),0), df=cont-calc;
          return `<tr><td>${fechaCorta(c.id)}<br><span class="mu">${esc(c.cierre.por||"")}</span></td><td class="r">${money(calc)}</td><td class="r">${money(cont)}</td><td class="r" style="font-weight:700;color:${df?"var(--rojo)":"var(--listo)"}">${df>0?"+":""}${money(df)}</td></tr>`; }).join("")||`<tr><td colspan="4" class="mu">Sin cierres en el período</td></tr>`}</table></div></div></div>`; }
function tabla(obj,t){ const e=Object.entries(obj).sort((a,b)=>b[1].v-a[1].v);
  return `<table><tr><th>${t}</th><th class="r">Tickets</th><th class="r">Total</th></tr>${e.map(([k,x])=>`<tr><td>${esc(k)}</td><td class="r">${x.c}</td><td class="r">${money(x.v)}</td></tr>`).join("")||`<tr><td colspan="3" class="mu">Sin datos</td></tr>`}</table>`; }

/* ===================== Impresión de tickets ===================== */
function pintarQR(id,valeId,size){ const el=document.getElementById(id); const v=buscarVale(valeId)||S.caja.selCache; if(!el||!v||typeof QRCode==="undefined") return;
  el.innerHTML=""; new QRCode(el,{text:"CRVALE:"+pad(v.numero),width:size,height:size,correctLevel:QRCode.CorrectLevel.M}); }
function ticketHTML(v,tipo){
  const n=S.negocio;
  if(tipo==="comanda") return `<div class="ticket"><h2>COMANDA COCINA</h2><div class="c big">${etiquetaVale(v).replace("🛵 ","").replace(/<i [^>]+><\/i> ?/g,"").toUpperCase()}</div>${v.cliente?`<div>${v.cliente.nombre?esc(v.cliente.nombre)+"<br>":""}Dir: ${esc(v.cliente.dir)}</div>`:""}
    <div class="c">Ticket ${pad(v.numero)} · ${esc(nombreMesero(v))} · ${hora(Date.now())}</div><hr>
    ${v.items.filter(i=>i.cocina&&i.ronda===v.ronda).map(i=>`<div class="big">${i.cant} x ${esc(i.nombre)}${i.llevar&&!esLlevarMesa(v.mesaId)?" [LLEVAR]":""}</div>${i.detalle?`<div><b>${esc(i.detalle)}</b></div>`:""}${i.nota?`<div>  ** ${esc(i.nota)}</div>`:""}`).join("")||"<div>(sin productos de cocina en esta ronda)</div>"}
    <hr><div class="c">Ronda ${v.ronda}</div></div>`;
  const est=v.estado==="pagado"?`*** PAGADO ${fecha(v.pago.fecha)} — ${esc(textoPago(v.pago))} ***`:v.estado==="anulado"?"*** ANULADO ***":"PENDIENTE DE PAGO";
  return `<div class="ticket"><h2>${esc(n.nombre||"Casa Rosada")}</h2><div class="c">${n.nit?"NIT "+esc(n.nit)+"<br>":""}${esc(n.direccion||"")}${n.telefono?"<br>Tel. "+esc(n.telefono):""}</div><hr>
    <div class="c big">TICKET N° ${pad(v.numero)}</div><div>${etiquetaVale(v).replace("🛵 ","").replace(/<i [^>]+><\/i> ?/g,"")} &nbsp; Mesero: ${esc(nombreMesero(v))}</div>${v.cliente?`<div>${[v.cliente.nombre?"Cliente: "+esc(v.cliente.nombre):"",v.cliente.tel?"Tel. "+esc(v.cliente.tel):""].filter(Boolean).join(" · ")}${v.cliente.nombre||v.cliente.tel?"<br>":""}Dir: ${esc(v.cliente.dir)}${v.cliente.ref?" ("+esc(v.cliente.ref)+")":""}</div>`:""}<div>${fecha(v.creado)}</div><hr>
    <table>${v.items.map(i=>`<tr><td>${i.cant} ${esc(i.nombre)}${i.detalle?`<br><small>${esc(i.detalle)}</small>`:""}</td><td style="text-align:right">${money(i.precio*i.cant)}</td></tr>`).join("")}</table><hr>
    <div class="big" style="display:flex;justify-content:space-between"><span>TOTAL</span><span>${money(v.total)}</span></div><hr>
    <div class="qr" id="qr-print"></div><div class="c"><b>${est}</b></div>
    <div class="c">${v.estado==="abierto"?"Presente este ticket en caja para pagar.":""}<br>${esc(n.pie||"")}</div>
    <div class="c" style="font-size:10px;margin-top:4px">Documento interno de control – no es factura</div></div>`;
}
function imprimirVale(v,tipo){
  const pa=$("#print-area"); pa.innerHTML=ticketHTML(v,tipo);
  if(tipo!=="comanda"&&typeof QRCode!=="undefined") new QRCode($("#qr-print"),{text:"CRVALE:"+pad(v.numero),width:110,height:110});
  setTimeout(()=>{ try{ window.print(); }catch(e){} if(S.db.demo) toast("Si no se abrió la impresión, es por el modo demo: en la versión instalada sí imprime."); },250);
}

/* ===================== Acciones ===================== */
const accion = {
  avisoLeido(k){ S.avisos=(S.avisos||[]).filter(a=>a.k!==k); guardarAvisos(); pintarAvisos(); },
  avisosLeidos(){ S.avisos=[]; guardarAvisos(); pintarAvisos(); },
  modoMesero(){ const on=!modoMesero(); try{ localStorage.setItem(claveModoMesero(),on?"1":"0"); }catch(e){ S.modoMeseroMem=on; }
    S.ped=null; S.paso=null; S.vista=on?"mesas":P().vistas[0]; toast(on?"Modo mesero activado: puede tomar pedidos":"Modo mesero desactivado"); render(); },
  ir(v){ S.vista=v; S.miniCaja=null; S.ped=null; S.paso=null; S.extraPend=null; if(v==="reportes") S.rep.datos=null; if(VISTAS_MOV.includes(v)) movSuscribir(); render(); },
  async salir(){ if(S.yoAdmin){ S.yo=S.yoAdmin; S.yoAdmin=null; } await pushQuitar(); S.subs.forEach(u=>u()); S.subs=[]; if(S.mov.sub){ S.mov.sub(); S.mov.sub=null; } await S.db.salir(); S.yo=null; S.ped=null; S.avisos=[]; pintarAvisos(); render(); },
  abrirMesa(mid){
    if(mid==="mostrador"){ S.ped={mesaId:"mostrador",mesaNombre:"Para llevar",valeId:null,nuevos:[]}; return render(); }
    if(mid==="plato"){ S.ped={mesaId:"plato",mesaNombre:"Para llevar en plato",valeId:null,nuevos:[]}; return render(); }
    if(mid==="varios"){ S.ped={mesaId:"varios",mesaNombre:"Productos varios",valeId:null,nuevos:[]}; return render(); }

/* Saldos por cuenta: real (solo ejecutado) y proyectado (real + provisiones pendientes) */
function saldos(lista){
  const r={}; CUENTAS.forEach(c=>r[c]={real:0,porRecibir:0,porPagar:0});
  lista.filter(vigente).forEach(x=>{ const c=r[x.medio]; if(!c) return; const s=x.tipo==="ingreso"?1:-1;
    if(esProv(x)){ if(s>0) c.porRecibir+=x.valor; else c.porPagar+=x.valor; } else c.real+=s*x.valor; });
  CUENTAS.forEach(c=>r[c].proy=r[c].real+r[c].porRecibir-r[c].porPagar);
  const suma=(cs,k)=>cs.reduce((a,c)=>a+r[c][k],0);
  const grupo=cs=>({real:suma(cs,"real"),porRecibir:suma(cs,"porRecibir"),porPagar:suma(cs,"porPagar"),proy:suma(cs,"proy")});
  return {cta:r, bancos:grupo(BANCOS), total:grupo(CUENTAS)};
}

/* ---- Cierre del día: saldo inicial, ventas, gastos, nómina y saldo final por cuenta (Efectivo y Davivienda) ---- */
const esNomina = x => x.tipo==="egreso"&&(x.nomina||/n[oó]mina|turnos/i.test(x.concepto||""));
const esVenta = x => x.tipo==="ingreso"&&(String(x.clave||"").startsWith("vale-")||String(x.clave||"").startsWith("ventas-")||x.concepto==="Ventas del día");
const realMov = x => vigente(x)&&!esProv(x);
const cierreDe = f => (S.mov.cierres||[]).find(c=>c.id===f);
// Saldo con que inicia el día: el que se registró al abrir; si no, el cierre contado anterior más lo que pasó después; si no, el acumulado
function saldoInicioDia(d,c){ const ap=cierreDe(d)?.apertura; if(ap&&ap[c]!=null) return Number(ap[c])||0;
  const prev=(S.mov.cierres||[]).filter(x=>x.id<d&&x.cierre?.contado?.[c]!=null).sort((a,b)=>b.id.localeCompare(a.id))[0];
  const movs=S.mov.datos.filter(realMov).filter(x=>x.medio===c);
  if(prev) return Number(prev.cierre.contado[c])+movs.filter(x=>x.fecha>prev.id&&x.fecha<d).reduce((a,x)=>a+(x.tipo==="ingreso"?x.valor:-x.valor),0);
  return movs.filter(x=>x.fecha<d||(x.fecha===d&&x.concepto==="Saldo inicial")).reduce((a,x)=>a+(x.tipo==="ingreso"?x.valor:-x.valor),0); }
function resumenDia(d){ const movs=S.mov.datos.filter(realMov).filter(x=>x.fecha===d&&x.concepto!=="Saldo inicial"), r={};
  CUENTAS.forEach(c=>{ const mc=movs.filter(x=>x.medio===c), sum=f=>mc.filter(f).reduce((a,x)=>a+x.valor,0);
    const o={inicio:saldoInicioDia(d,c),ventas:sum(esVenta),otrosIng:sum(x=>x.tipo==="ingreso"&&!esVenta(x)),gastos:sum(x=>x.tipo==="egreso"&&!esNomina(x)&&!esCxP(x)),nomina:sum(esNomina),cxp:sum(esCxP)};
    o.ingresos=o.ventas+o.otrosIng; o.final=o.inicio+o.ingresos-o.gastos-o.nomina-o.cxp; r[c]=o; });
  const T={}; ["inicio","ventas","otrosIng","ingresos","gastos","nomina","cxp","final"].forEach(k=>T[k]=CUENTAS.reduce((a,c)=>a+r[c][k],0)); r.Total=T;
  r.pagosNomina=movs.filter(esNomina); return r; }
/* ---- Arqueo de caja: conteo de monedas y billetes ---- */
const MONEDAS=[50,100,200,500,1000], BILLETES=[2000,5000,10000,20000,50000,100000];
function arqueoHTML(pref,prev={}){ const celda=v=>`<div class="aq-c"><span>${money(v)}</span><button type="button" class="aq-b" aria-label="Quitar uno" onclick="arqPaso('${pref}',${v},-1)">−</button><input id="${pref}-q${v}" inputmode="numeric" placeholder="0" value="${prev[v]||""}"><button type="button" class="aq-b" aria-label="Sumar uno" onclick="arqPaso('${pref}',${v},1)">+</button><b id="${pref}-s${v}">$ 0</b></div>`;
  return `<div class="aq"><div class="aq-t">🧮 Arqueo de caja <span class="mu">· escriba cuántas hay de cada una</span></div>
    <div class="aq-g"><div><div class="aq-h">🪙 Monedas</div>${MONEDAS.map(celda).join("")}</div><div><div class="aq-h">💵 Billetes</div>${BILLETES.map(celda).join("")}</div></div>
    <div class="aq-tot"><span>Monedas <b id="${pref}-tm">$ 0</b></span><span>Billetes <b id="${pref}-tb">$ 0</b></span><span class="aq-gran">Total efectivo <b id="${pref}-tt">$ 0</b></span></div></div>`; }
// Arqueo libre: solo para contar billetes y monedas; no se guarda ni se enlaza con nada
function vistaArqueo(){ if(!S.arqHist&&!S.arqCargando) accion.arqCargar();
  const H=S.arqHist||[], tot=q=>MONEDAS.concat(BILLETES).reduce((a,d)=>a+(q?.[d]||0)*d,0);
  return `<div class="row"><h2 style="margin:0">Arqueo</h2><span class="sp"></span><span class="mu">Para hacer cuentas · no afecta la caja ni el cierre</span></div>
  <div class="card" style="margin-top:12px;max-width:760px">${arqueoHTML("aqs",S.arq||{})}<input type="hidden" id="aqs-dest">
    <div class="row" style="margin-top:10px;gap:6px"><input id="aqs-nota" style="flex:1;min-width:140px" placeholder="Nota (opcional): ej. cambio de turno" value="${esc(S.arqNota||"")}" oninput="S.arqNota=this.value"><button onclick="accion.arqGuardar()">💾 Guardar</button><button onclick="S.arq={};S.arqNota='';render()">🧹 Limpiar</button></div>
    <details style="margin-top:10px" ${S.arqAb?"open":""} ontoggle="S.arqAb=this.open"><summary class="mu" style="cursor:pointer;font-size:13px">🕒 Arqueos guardados (${H.length})</summary>
      ${H.map(a=>`<div class="row" style="font-size:13px;padding:4px 0;border-bottom:1px dashed var(--ln);gap:6px"><span class="sp">${fecha(a.fecha)} · ${esc(String(a.por||"").split(" (")[0])}${a.nota?` · <span class="mu">${esc(a.nota)}</span>`:""}</span><b>${money(a.total)}</b><button class="sm" title="Cargar este conteo" onclick='S.arq=${JSON.stringify(a.conteo||{})};render()'>↺</button></div>`).join("")||'<div class="mu" style="font-size:13px;padding:4px 0">Aún no hay arqueos guardados.</div>'}
      <div class="mu" style="font-size:11px;margin-top:4px">Últimos 30 días · ↺ vuelve a cargar ese conteo para revisarlo</div></details></div>`; }
Object.assign(accion,{
  async arqCargar(){ S.arqCargando=true; try{ const d0=Date.now()-30*86400000; S.arqHist=(await S.db.consultar("arqueos",[["fecha",">=",d0]])).sort((a,b)=>b.fecha-a.fecha); }catch(e){ S.arqHist=[]; } S.arqCargando=false; if(S.vista==="arqueo") render(); },
  async arqGuardar(){ const q=arqueoLeer("aqs"), total=MONEDAS.concat(BILLETES).reduce((a,d)=>a+(q[d]||0)*d,0);
    if(!total) return toast("El arqueo está en cero");
    try{ await S.db.agregar("arqueos",{fecha:Date.now(),conteo:q,total,monedas:MONEDAS.reduce((a,d)=>a+(q[d]||0)*d,0),billetes:BILLETES.reduce((a,d)=>a+(q[d]||0)*d,0),nota:String(S.arqNota||"").trim(),por:S.yo.nombre,porUid:S.yo.id});
      S.arqNota=""; toast("💾 Arqueo guardado · "+money(total)); accion.arqCargar(); }catch(e){ toast("No se pudo guardar: "+e.message); } },
});
// − / + al lado de cada cantidad del arqueo
function arqPaso(pref,v,d){ const el=$(`#${pref}-q${v}`); if(!el) return; const n=Math.max(0,(Number(String(el.value).replace(/\D/g,""))||0)+d); el.value=n||""; el.dispatchEvent(new Event("input",{bubbles:true})); }
function arqueoLeer(pref){ const q={}; MONEDAS.concat(BILLETES).forEach(v=>{ const n=Number(String($(`#${pref}-q${v}`)?.value||"").replace(/\D/g,""))||0; if(n) q[v]=n; }); return q; }
function arqueoActivar(pref,destino){ const calc=()=>{ const q=arqueoLeer(pref); let tm=0,tb=0;
    MONEDAS.concat(BILLETES).forEach(v=>{ const st=(q[v]||0)*v; $(`#${pref}-s${v}`).textContent=money(st); if(MONEDAS.includes(v)) tm+=st; else tb+=st; });
    $(`#${pref}-tm`).textContent=money(tm); $(`#${pref}-tb`).textContent=money(tb); $(`#${pref}-tt`).textContent=money(tm+tb);
    if(Object.keys(q).length) $(destino).value=tm+tb; };
  MONEDAS.concat(BILLETES).forEach(v=>$(`#${pref}-q${v}`).oninput=calc); calc(); }
// Cuentas por pagar: egresos provisionados (por ejecutar) con fecha hasta el día; y las que se pagaron ese día
const esCxP = x => x.tipo==="egreso"&&!esNomina(x)&&x.valorProvisionado!=null;
// Clasificación del día: ingresos por efectivo, bancos y crédito, pendientes de cobro y egresos por concepto
function clasificacionDia(d,r){ const hoy=d===hoyISO(), m=S.mov;
  const vend=new Map(); [...(S.valesCobHoy||[]),...(S.valesHoy||[])].forEach(v=>{ if(v.estado==="pagado"&&isoLocal(v.pagoFecha)===d) vend.set(v.id,v); });
  let cred=0, nCred=0; vend.forEach(v=>{ const c=v.pago?.medio==="Crédito"?v.total:v.pago?.medio==="Dividido"?(v.pago.partes||[]).filter(x=>x.medio==="Crédito").reduce((a,x)=>a+x.valor,0):0; if(c){ cred+=c; nCred++; } });
  const pend=hoy?S.valesAbiertos:[], pT=pend.reduce((a,v)=>a+v.total,0);
  const pGrupo=[["Efectivo reportado",pend.filter(v=>v.pagoReportado?.medio==="Efectivo")],["QR reportado",pend.filter(v=>v.pagoReportado?.medio==="QR")],["Paga más tarde",pend.filter(v=>v.pagoReportado?.medio==="Tarde")],["Crédito reportado",pend.filter(v=>v.pagoReportado?.medio==="Crédito")],["En caja sin medio",pend.filter(v=>!v.pagoReportado&&!enCurso(v))],["En proceso (cocina / mesa)",pend.filter(v=>!v.pagoReportado&&enCurso(v))]].filter(g=>g[1].length);
  const egr=(m.datos||[]).filter(x=>realMov(x)&&x.fecha===d&&x.tipo==="egreso"&&x.concepto!=="Saldo inicial"), G={};
  egr.forEach(x=>{ const k=esNomina(x)?"👥 Nómina":esCxP(x)?"🧾 Cuentas por pagar · "+x.concepto:x.concepto||"Otros gastos"; G[k]=G[k]||{n:0}; G[k][x.medio]=(G[k][x.medio]||0)+x.valor; G[k].n++; });
  const ks=Object.keys(G).sort(), totE=c=>ks.reduce((a,k)=>a+(G[k][c]||0),0);
  const lin=(ic,t,v,col,nota="")=>`<div class="row" style="padding:5px 0;border-bottom:1px dashed var(--ln)"><span class="sp">${ic} ${t}${nota?` <span class="mu" style="font-size:12px">${nota}</span>`:""}</span><b style="color:${col}">${money(v)}</b></div>`;
  return `<div class="ac-cols" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px;margin-top:12px">
    <div class="ac-sub" style="margin:0"><b>📥 Ingresos clasificados</b>
      ${lin("💵","Ingresos en efectivo",r.Efectivo.ingresos,"var(--listo)",`ventas ${money(r.Efectivo.ventas)} · otros ${money(r.Efectivo.otrosIng)}`)}
      ${CUENTAS.filter(c=>c!=="Efectivo").map(c=>lin("🏦",`Ingresos por bancos (${c})`,r[c].ingresos,"var(--listo)",`ventas ${money(r[c].ventas)} · otros ${money(r[c].otrosIng)}`)).join("")}
      ${lin("💳","Ventas a crédito",cred,"#6a1b9a",`${nCred} ticket(s) · no entra a caja hasta que abonen`)}
      ${lin("⏳","Pendientes de cobro",pT,"#ef6c00",hoy?`${pend.length} ticket(s) abiertos`:"solo se calcula para hoy")}
      ${pGrupo.map(([t,xs])=>`<div class="row mu" style="font-size:13px;padding:2px 0 2px 22px"><span class="sp">· ${t} (${xs.length})</span><span>${money(xs.reduce((a,v)=>a+v.total,0))}</span></div>`).join("")}
      <div class="row" style="padding-top:6px"><span class="sp"><b>Total vendido</b> <span class="mu" style="font-size:12px">efectivo + bancos + crédito</span></span><b>${money(r.Total.ventas+cred)}</b></div></div>
    <div class="ac-sub" style="margin:0"><b>📤 Egresos clasificados</b>
      ${ks.length?`<table style="margin-top:4px"><tr><th>Concepto</th>${CUENTAS.map(c=>`<th class="r">${c==="Efectivo"?"💵 Efectivo":"🏦 "+c}</th>`).join("")}</tr>
        ${ks.map(k=>`<tr><td>${esc(k)}${G[k].n>1?` <span class="mu">(${G[k].n})</span>`:""}</td>${CUENTAS.map(c=>`<td class="r">${G[k][c]?money(G[k][c]):"—"}</td>`).join("")}</tr>`).join("")}
        <tr style="background:var(--rosa3)"><td><b>Total egresos</b></td>${CUENTAS.map(c=>`<td class="r"><b style="color:var(--rojo)">${money(totE(c))}</b></td>`).join("")}</tr></table>`:'<div class="mu" style="margin-top:4px">Sin egresos este día.</div>'}</div></div>`; }
function vistaCierre(){ const m=S.mov, d=m.diaC||(m.diaC=hoyISO()), r=resumenDia(d), ci=cierreDe(d), cont=ci?.cierre?.contado, ap=ci?.apertura;
  const cerrado=!!ci?.cierre, sal0=saldos(m.datos), rh=resumenDia(hoyISO()), sal={cta:{},total:{real:0,porRecibir:0,porPagar:0,proy:0}};
  // Saldo real a hoy: parte de la apertura (o cierre anterior) y suma lo ejecutado hoy; las provisiones se suman aparte
  CUENTAS.forEach(c=>{ const x=sal0.cta[c], o={real:rh[c].final,porRecibir:x.porRecibir,porPagar:x.porPagar}; o.proy=o.real+o.porRecibir-o.porPagar; sal.cta[c]=o; ["real","porRecibir","porPagar","proy"].forEach(k=>sal.total[k]+=o[k]); });
  const pend=m.datos.filter(x=>vigente(x)&&esProv(x)&&x.tipo==="egreso"&&x.fecha<=d).sort((a,b)=>a.fecha.localeCompare(b.fecha));
  const pagadasHoy=m.datos.filter(x=>realMov(x)&&x.fecha===d&&esCxP(x));
  const movsDia=m.datos.filter(x=>realMov(x)&&x.fecha===d&&x.concepto!=="Saldo inicial"&&!esNomina(x)&&!esCxP(x));
  const ventasN=movsDia.filter(esVenta).length, otros=movsDia.filter(x=>!esVenta(x));
  const cols=CUENTAS.concat(["Total"]), cab=`<tr><th></th>${CUENTAS.map(c=>`<th class="r">${c==="Efectivo"?"💵 Caja (efectivo)":"🏦 "+c}</th>`).join("")}<th class="r">Total</th></tr>`;
  const fila=(t,k,signo="",estilo="")=>`<tr style="${estilo}"><td>${t}</td>${cols.map(c=>`<td class="r">${signo}${money(r[c][k])}</td>`).join("")}</tr>`;
  const paso=(n,t,ok,cuerpo,color)=>`<div class="card ac-paso" style="border-left:6px solid ${color}"><div class="row" style="margin-bottom:6px"><span class="ac-n" style="background:${color}">${n}</span><h3 style="margin:0">${t}</h3><span class="sp"></span>${ok}</div>${cuerpo}</div>`;
  const listaMov=xs=>xs.length?xs.map(x=>`<div class="row" style="padding:5px 0;border-bottom:1px solid var(--ln)"><span class="sp">${esc(x.concepto)}<br><span class="mu" style="font-size:12px">${x.tipo==="ingreso"?esc(x.origen||""):esc(x.responsable||"")} · ${esc(x.medio)}</span></span>${x.tieneFoto?`<button class="sm" onclick="accion.movVerFoto('${x.id}')">📷</button>`:""}<b style="color:${x.tipo==="ingreso"?"var(--listo)":"var(--rojo)"}">${x.tipo==="egreso"?"−":"+"}${money(x.valor)}</b></div>`).join(""):`<div class="mu">Sin registros.</div>`;
  return `<div class="row"><h2 style="margin:0">Apertura y cierre</h2><span class="sp"></span>
    <input type="date" style="width:auto" value="${d}" onchange="S.mov.diaC=this.value;render()">
    ${cerrado?`<span class="dot" style="background:var(--listo)">CERRADO · ${esc(ci.cierre.por)}</span>`:`<span class="dot" style="background:var(--cuenta)">ABIERTO</span>`}</div>
  <div class="ac-flujo">
  ${paso(1,"🌅 Apertura del día",ap?`<span class="dot" style="background:var(--listo)">REGISTRADA · ${esc(ci.aperturaPor||"")}</span>`:`<span class="dot" style="background:var(--cuenta)">PENDIENTE</span>`,
    `<p class="mu expl" style="margin:0 0 8px">Registre con cuánto inicia el día la caja (efectivo) y el banco.${ap?"":" Mientras no se registre, se usa el saldo calculado del cierre anterior."}</p>
    <div class="ac-saldos">${CUENTAS.map(c=>`<div class="ac-s"><div class="mu">${c==="Efectivo"?"💵 Caja (efectivo)":"🏦 "+c}</div><b>${money(r[c].inicio)}</b></div>`).join("")}<div class="ac-s"><div class="mu">Total</div><b>${money(r.Total.inicio)}</b></div></div>
    <button class="pri" style="width:100%;margin-top:10px" onclick="accion.cierreApertura()">🌅 ${ap?"Corregir saldo inicial":"Registrar saldo inicial"}</button>`,"var(--azul)")}

  ${paso(2,"📥 Movimiento del día",`<span class="mu">Se alimenta solo</span>`,
    `<p class="mu expl" style="margin:0 0 8px">Ventas cobradas en caja y lo que se registre en «Ingresos y egresos» con fecha de este día. Los ajustes se hacen solo en «Ingresos y egresos».</p>
    <div style="overflow-x:auto"><table style="min-width:480px">${cab}
      ${fila(`<span style="color:var(--listo)">+ Ventas del día</span> <span class="mu">(${ventasN} ticket${ventasN===1?"":"s"})</span>`,"ventas","+")}
      ${fila('<span style="color:var(--listo)">+ Otros ingresos</span>',"otrosIng","+")}
      ${fila('<span style="color:var(--rojo)">− Gastos del día</span>',"gastos","−")}</table></div>
    ${clasificacionDia(d,r)}`,"var(--listo)")}

  ${paso(3,"🔒 Cierre del día",cerrado?`<span class="dot" style="background:var(--listo)">CERRADO</span>`:"",
    `${d===hoyISO()?avisoPendSoporte():""}<div class="ac-sub"><div class="row"><b>👥 Nómina</b><span class="sp"></span><b style="color:var(--rojo)">−${money(r.Total.nomina)}</b></div>
      ${r.pagosNomina.map(x=>`<div class="row" style="padding:4px 0;border-bottom:1px solid var(--ln)"><span class="sp">${esc(x.responsable||"—")}${x.adicional?`<br><span class="mu" style="font-size:12px">básico ${money(x.basico||0)} + adicional ${money(x.adicional)}</span>`:""}</span><span class="mu">${esc(x.medio)}</span>${x.tieneFoto?`<button class="sm" onclick="accion.movVerFoto('${x.id}')">📷</button>`:""}<b>${money(x.valor)}</b></div>`).join("")||`<div class="mu">Aún no se ha pagado nómina este día.</div>`}
      <button class="warn" style="width:100%;margin-top:8px" onclick="accion.cierreNomina()">👥 Pagar nómina</button></div>

    <div class="ac-sub"><div class="row"><b>🧾 Cuentas por pagar del día</b><span class="sp"></span><b style="color:var(--rojo)">−${money(r.Total.cxp)}</b></div>
      ${pend.map(x=>`<div class="row" style="padding:5px 0;border-bottom:1px solid var(--ln)"><span class="sp">${esc(x.concepto)}<br><span class="mu" style="font-size:12px">${x.responsable?esc(x.responsable)+" · ":""}${esc(x.medio)} · ${x.fecha<d?`<b style="color:var(--rojo)">vencida ${fechaCorta(x.fecha)}</b>`:"vence hoy"}</span></span><b>${money(x.valor)}</b>${puedeEditarMov(x)?`<button class="sm ok" onclick="accion.movEjecutar('${x.id}')">✔ Pagar</button>`:""}</div>`).join("")}
      ${pagadasHoy.map(x=>`<div class="row" style="padding:5px 0;border-bottom:1px solid var(--ln);opacity:.8"><span class="sp">✅ ${esc(x.concepto)}<br><span class="mu" style="font-size:12px">Pagada · ${esc(x.medio)}</span></span>${x.tieneFoto?`<button class="sm" onclick="accion.movVerFoto('${x.id}')">📷</button>`:""}<b>${money(x.valor)}</b></div>`).join("")}
      ${!pend.length&&!pagadasHoy.length?`<div class="mu">No hay cuentas por pagar para este día. Se crean en «Ingresos y egresos» como egreso ⏳ Por ejecutar, con la fecha en que se deben pagar.</div>`:""}</div>

    <div class="ac-sub"><b>💰 Saldo final</b>
    <div style="overflow-x:auto"><table style="margin-top:6px;min-width:480px">${cab}
      ${fila("Saldo inicial","inicio")}
      ${fila('<span style="color:var(--listo)">+ Ventas y otros ingresos</span>',"ingresos","+")}
      ${fila('<span style="color:var(--rojo)">− Gastos del día</span>',"gastos","−")}
      ${fila('<span style="color:var(--rojo)">− Nómina</span>',"nomina","−")}
      ${fila('<span style="color:var(--rojo)">− Cuentas por pagar pagadas</span>',"cxp","−")}
      ${fila("<b>= Saldo final calculado</b>","final","","background:var(--rosa3);font-weight:800")}
      ${cont?`<tr><td><b>Saldo contado al cierre</b></td>${CUENTAS.map(c=>`<td class="r b">${money(cont[c])}</td>`).join("")}<td class="r b">${money(CUENTAS.reduce((a,c)=>a+Number(cont[c]||0),0))}</td></tr>
        <tr><td>Diferencia</td>${CUENTAS.map(c=>{ const df=Number(cont[c]||0)-r[c].final; return `<td class="r" style="font-weight:700;color:${df?"var(--rojo)":"var(--listo)"}">${df>0?"+":""}${money(df)}</td>`; }).join("")}<td></td></tr>`:""}
    </table></div></div>
    <button class="pri" style="width:100%;margin-top:10px;font-size:16px" onclick="accion.cierreCerrar()">🔒 ${cerrado?"Corregir cierre":"Cerrar el día (contar caja y banco)"}</button>`,"var(--rosa)")}
  </div>

  <div class="card" style="margin-top:12px"><h3 style="margin-top:0">🏦 Saldos acumulados de las cuentas</h3>
    <div style="overflow-x:auto"><table style="min-width:560px"><tr><th>Cuenta</th><th class="r">Saldo real<br><span class="mu">sin provisiones</span></th><th class="r">Por recibir</th><th class="r">Por pagar</th><th class="r">Saldo proyectado<br><span class="mu">con provisiones</span></th></tr>
    ${CUENTAS.map(c=>[c,sal.cta[c]]).concat([["<b>TOTAL</b>",sal.total]]).map(([n,x])=>`<tr><td>${n}</td><td class="r b" style="${neg(x.real)}">${money(x.real)}</td><td class="r" style="color:var(--listo)">${x.porRecibir?"+"+money(x.porRecibir):"—"}</td><td class="r" style="color:var(--rojo)">${x.porPagar?"−"+money(x.porPagar):"—"}</td><td class="r b" style="${neg(x.proy)}">${money(x.proy)}</td></tr>`).join("")}</table></div>
    <p class="mu expl" style="margin-bottom:0">Saldo real a hoy: parte del saldo inicial del día (o del último cierre) más lo ejecutado hoy. Proyectado: suma lo provisionado por recibir y resta lo que está por pagar.</p></div>`; }
Object.assign(accion,{
  cxpNueva(){ const d=S.mov.diaC||hoyISO();
    modal(`<h3 style="margin-top:0">🧾 Nueva cuenta por pagar</h3><p class="mu expl" style="margin-top:0">Queda como egreso ⏳ por ejecutar. Al pagarla («✔ Pagar») sale de la cuenta elegida.</p>
      <label>Concepto</label><input id="cx-c" placeholder="Ej: Proveedor de carnes">
      <label>A quién se le paga</label><input id="cx-r" placeholder="Proveedor o persona">
      <label>Valor (COP)</label><input id="cx-v" inputmode="numeric">
      <label>Fecha de pago</label><input type="date" id="cx-f" value="${d}">
      <label>¿De qué cuenta sale?</label><select id="cx-m">${CUENTAS.map(c=>`<option>${c}</option>`).join("")}</select>
      <div class="row" style="margin-top:12px"><span class="sp"></span><button onclick="cerrarModal()">Cancelar</button><button class="pri" id="cx-ok">Guardar</button></div>`);
    $("#cx-ok").onclick=async()=>{ const valor=Number($("#cx-v").value.replace(/\D/g,""))||0, concepto=$("#cx-c").value.trim();
      if(!concepto) return toast("Escriba el concepto"); if(!valor) return toast("Escriba el valor");
      try{ await S.db.agregar("movimientos",{tipo:"egreso",fecha:$("#cx-f").value||d,valor,concepto,medio:$("#cx-m").value,responsable:$("#cx-r").value.trim(),origen:"",soporte:"",obs:"",ejec:"por_ejecutar",tieneFoto:false,estado:"activo",registradoPor:S.yo.nombre,registradoUid:S.yo.id,creado:Date.now()});
        cerrarModal(); toast("Cuenta por pagar agregada"); }catch(e){ toast("Error: "+e.message); } }; },
});
Object.assign(accion,{
  cierreApertura(){ const d=S.mov.diaC, r=resumenDia(d), ap=cierreDe(d)?.apertura||{};

/* ===================== MÓDULO: MENÚ DEL DÍA ===================== */
// Estructura: proteínas (cada una con su precio), acompañamientos (cada uno se puede pedir normal, sin, o cambiado por huevo)
// y sopa/postre del día (varias opciones, con fruta como reemplazo).
const sumarDias = (iso,n) => { const d=new Date(iso+"T12:00:00"); d.setDate(d.getDate()+n); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); };
const diaSemana = iso => new Date(iso+"T12:00:00").getDay(); // 0 = domingo
const lunesDe = iso => sumarDias(iso, -((diaSemana(iso)+6)%7));
const siguienteLaboral = iso => { let f=sumarDias(iso,1); if(diaSemana(f)===0) f=sumarDias(f,1); return f; };
const mananaISO = () => { const d=new Date(); d.setDate(d.getDate()+1); d.setMinutes(d.getMinutes()-d.getTimezoneOffset()); return d.toISOString().slice(0,10); };
const DIAS = ["domingo","lunes","martes","miércoles","jueves","viernes","sábado"];
const fechaLarga = iso => { const d=new Date(iso+"T12:00:00"); const t=`${DIAS[d.getDay()]} ${d.getDate()} de ${d.toLocaleString("es-CO",{month:"long"})}`; return t[0].toUpperCase()+t.slice(1); };
const menuDe = f => S.menus.find(m=>m.id===f);
const menuActivo = m => m && m.publicado!==false && !m.anulado;
const menuHoy = () => { const m=menuDe(hoyISO()); return menuActivo(m)?m:null; };
S.menus=[]; S.mdia={fecha:null, borrador:null}; S.alm=null;

const pLlevar = p => precioAlmuerzo(p,"icopor");
const SIN_SOPA = "Sin";
// Acompañamientos organizados por proteína: m.acompDe[k] = opción de proteína (0, 1) a la que pertenece el acompañamiento k
const acompDe = m => (m?.acompanamientos||[]).map((x,k)=>Array.isArray(m?.acompDe)&&m.acompDe[k]!=null?m.acompDe[k]:-1);
const nombreProts = ns => [...new Set(ns)].map(n=>{ const c=ns.filter(x=>x===n).length; return c>1?`${n} (doble)`:n; }).join(" + ");
const MAX_PROT = 2; // porciones de proteína por almuerzo (distintas o la misma doble)
const AMBAS = 9; // acompañamiento común a las dos proteínas (ej: ensalada)
const acompDeProt = (m,pi) => m.acompanamientos.filter((x,k)=>acompDe(m)[k]===pi||acompDe(m)[k]===AMBAS);
const ACOMP_POR_PROT = 4; // en el editor: por proteína 3 acompañamientos + 1 ensalada propia; y 2 comunes a ambas (opcional)
// Ensaladas: cada proteína tiene la suya (m.acompEns marca cuáles acompañamientos son ensalada)
const esEns = (m,k) => !!m?.acompEns?.[k];
// Algunos acompañamientos no se sirven dobles (ej. torta): se marca en la carga del menú (m.acompNoDoble). Si el cliente quiere más, va como adicional.
const permiteDoble = (m,k) => !m?.acompNoDoble?.[k];
const ensaladasIdx = m => (m?.acompanamientos||[]).map((x,k)=>k).filter(k=>esEns(m,k)&&!agotado(m,"acompanamientos",m.acompanamientos[k]));

/* ===================== ATENCIÓN: despacho, servido y envío a caja ===================== */
function estadoTexto(v){
  const ps=pasosSv(servicioDe(v));
  if(v.enCaja&&v.estado==="abierto"&&!pendienteCocina(v)) return "💵 En caja por cobrar";
  if(pendienteCocina(v)) return (v.rondaDespachada?"🔥 Adicional en cocina · preparación":"🔥 En cocina · preparación");
  if(!esServido(v)){ const d=(v.despachos||[]).slice(-1)[0];
    if(v.mesaId==="domicilio") return v.salidaEn?`🛵 En camino con <b>${esc(v.salidaPor||d?.quien||"")}</b> · pendiente envío a caja`:d?`🍳 Despachado · pendiente salida a ruta · lo lleva <b>${esc(d.quien)}</b>`:"Sin platos de cocina";
    return d?`🍳 Despachado · ${ps.desp.toLowerCase()} · lo lleva <b>${esc(d.quien)}</b>`:ps.desp; }
  return `✓ ${ps.fin}${v.servidoEn?" en "+durTxt(v.servidoEn-v.creado):""} · pendiente envío a caja`;
}
function estadoCrono(v){
  // Corre desde que se cargó el pedido hasta que se marca servido/entregado; un adicional corre desde que se envió
  if(!v.servidoEn) return crono(v.creado);
  if(!esServido(v)) return crono(v.enviado||v.creado);
  return crono(v.creado, v.servidoEn);
}
// Trazabilidad completa de un ticket: quién lo pidió, qué se agregó, cocina, entrega, caja y pago
function trazaTicket(v){
  const rolTxt=r=>r==="admin"?"Administrador":r==="cajero"?"Caja":r?ROLES[r]||r:"";
  const rolDe=n=>{ const u=S.usuarios.find(x=>x.nombre===n||x.nombre+" (pruebas)"===n||n===x.nombre.replace(/ \(pruebas\)$/,"")); return u?rolTxt(u.rol):""; };
  const its=a=>a.map(i=>`${i.cant}× ${esc(i.nombre)}`).join(", ");
  // [hora, ícono, qué se hizo, quién, rol, detalle]
  const pasos=[[v.creado,"📝","Pedido tomado",nombreMesero(v),rolDe(nombreMesero(v)),`${etiquetaVale(v)} · ${its((v.items||[]).filter(i=>(i.ronda||1)===1))}`]];
  const rondas={}; (v.items||[]).filter(i=>(i.ronda||1)>1&&!i.editado).forEach(i=>{ (rondas[i.ronda]=rondas[i.ronda]||[]).push(i); });
  Object.values(rondas).forEach(a=>pasos.push([a[0].en||v.creado,"➕","Agregó al pedido",a[0].por||"—",rolDe(a[0].por),its(a)]));
  // Cada despacho cubre las rondas desde el despacho anterior hasta la suya: se muestra qué salió realmente
  let rPrev=0; [...(v.despachos||[])].sort((a,b)=>a.fecha-b.fecha).forEach(d=>{
    const sal=(v.items||[]).filter(i=>i.cocina&&(i.ronda||1)>rPrev&&(i.ronda||1)<=d.ronda);
    const titulo=rPrev===0?(sal.some(i=>(i.ronda||1)>1)?"Cocina despachó el pedido completo (con lo agregado)":"Cocina despachó el pedido")
      :sal.length&&sal.every(i=>i.editado)?"Cocina despachó el cambio":"Cocina despachó lo agregado";
    pasos.push([d.fecha,"🍳",(d.directo?titulo+" y lo entregó directamente":`${titulo} → entregó a ${esc(d.quien)}`)+(["Administrador","Caja"].includes(rolDe(d.por))?" (marcado por "+rolDe(d.por).toLowerCase()+")":""),d.por||"Cocina",rolDe(d.por)||"Cocina",`${sal.length?its(sal)+"<br>":""}${d.directo?"Pasó solo a caja para el cobro":`Responsable de servir o entregar: <b>${esc(d.quien)}</b>`}`]);
    rPrev=Math.max(rPrev,d.ronda||1); });
  (v.cambios||[]).forEach(c=>pasos.push(c.edito?[c.fecha,"✏️","Cambió un plato",c.quien,rolDe(c.quien),`Antes: ${esc(c.edito)}<br>Ahora: <b>${esc(c.ahora)}</b>`]:[c.fecha,"✂️","Quitó un producto",c.quien,rolDe(c.quien),`${esc(c.quito)} · motivo: ${esc(c.motivo)}`]));
  if(v.salidaEn) pasos.push([v.salidaEn,"🛵","Aceptó el domicilio y salió",v.salidaPor||"—",rolDe(v.salidaPor),`Hora de salida: ${hora(v.salidaEn)}${v.servidoEn?` · tiempo en camino: ${durTxt(v.servidoEn-v.salidaEn)}`:""}`]);
  if(v.servidoEn) pasos.push([v.servidoEn,"🍽",`Marcó como ${verboServir(v).toLowerCase()}`,v.servidoPor||"—",rolDe(v.servidoPor),`Espera desde que se pidió: ${durTxt(v.servidoEn-v.creado)}`]);
  if(v.pagoReportado) pasos.push([v.pagoReportado.fecha||v.enCajaEn,servicioDe(v)==="domicilio"?"🛵":"🙋",servicioDe(v)==="domicilio"?"Reportó el pago del domicilio":"Entregó y reportó el pago",v.pagoReportado.por,rolDe(v.pagoReportado.por),`Medio: ${esc(medioTxt(v.pagoReportado.medio))}${v.pagoReportado.credito?" · "+esc(v.pagoReportado.credito.nombre):""}${v.pagoReportado.recibido?` · recibió ${money(v.pagoReportado.recibido)}`:""}${v.soporte?" · tomó foto del soporte":""}`]);
  if(v.enCajaEn) pasos.push([v.enCajaEn,"💵","Envió el ticket a caja",v.enCajaPor||"—",rolDe(v.enCajaPor),`Total a cobrar: ${money(v.total)}`]);
  if(v.pago?.fecha) pasos.push([v.pago.fecha,"✅","Confirmó el pago",v.pago.cajero,v.pago.cajeroRol?rolTxt(v.pago.cajeroRol):rolDe(v.pago.cajero),
    `${esc(textoPago(v.pago))} · ${money(v.total)}${v.pago.recibido?` · recibió ${money(v.pago.recibido)}, cambio ${money(v.pago.cambio)}`:""}${v.pago.ref?` · ref. ${esc(v.pago.ref)}`:""}${v.pago.efectivoDe?` · efectivo recibido de ${esc(v.pago.efectivoDe)}`:""}${v.pago.verificoSoporte?" · verificó el soporte del QR":""}${v.soporte||v.pago.soporte?` <button class="sm" onclick="accion.verSoporte('${v.id}')">📎 Ver soporte</button>`:""}`]);
  if(cajaOAdmin()) (v.observaciones||[]).forEach(o=>pasos.push([o.fecha,"📝","Observación"+(o.tipo?" · "+o.tipo.toLowerCase():""),o.por,rolTxt(o.rol)||rolDe(o.por),esc(o.texto)]));
  if(v.anulacion) pasos.push([v.anulacion.fecha,"❌","Anuló el ticket",v.anulacion.por,rolDe(v.anulacion.por),`Motivo: ${esc(v.anulacion.motivo)}`]);
  pasos.sort((a,b)=>(a[0]||0)-(b[0]||0));
  return `<div class="traza">${pasos.map(([t,ic,que,quien,rol,det])=>`<div class="tz-paso">
    <div class="tz-hora">${t?hora(t):""}</div>
    <div class="tz-cuerpo"><div class="tz-que">${ic} ${que}</div>
      <div class="tz-quien">👤 <b>${esc(quien||"—")}</b>${rol?` <span class="tz-rol">${esc(rol)}</span>`:""}</div>
      ${det?`<div class="tz-det">${det}</div>`:""}</div></div>`).join("")}</div>`;
}

const DOMICILIARIOS=["Andrés","Mateo"];
const sinTilde=x=>String(x||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"");
const mismoDom=(a,b)=>mismoNombre(sinTilde(a),sinTilde(b))||mismoNombre(sinTilde(a).split(" ")[0],sinTilde(b).split(" ")[0]);
function nombresDomicilio(){ return DOMICILIARIOS.map(d=>S.usuarios.find(u=>u.activo!==false&&mismoDom(u.nombre,d))?.nombre||d); }
function nombresEntrega(v){
  // Para llevar en plato lo puede entregar cualquiera: meseros, administración o caja (o cocina directamente)
  const roles=v&&servicioDe(v)==="plato"?["mesero","admin","cajero"]:["mesero"];
  const n=S.usuarios.filter(u=>roles.includes(u.rol)&&u.activo!==false).map(u=>u.nombre);
  if(v?.meseroNombre) n.push(nombreMesero(v));
  return [...new Set(n)];
}
Object.assign(accion,{
  despachar(id){
    const v=buscarVale(id);
    modal(`<h3 style="margin-top:0">Despachar · ${etiquetaVale(v)}</h3><p class="mu">¿Quién recibe el pedido para ${v.mesaId==="domicilio"?"llevarlo":servicioDe(v)==="plato"?"entregarlo y cobrarlo":"servirlo"}?</p>
      ${(()=>{ const resp=responsable(v);
        // Domicilios: solo los domiciliarios (Andrés y Mateo). Si lo cargó uno de ellos, ese va en verde y el otro como apoyo; si no, ambos en verde
        if(v.mesaId==="domicilio"){ const dom=nombresDomicilio(), suyo=dom.find(n=>mismoDom(n,resp));
          if(!suyo) return `<div class="mu dz-tit">Domiciliarios</div><div class="dz-cols">${dom.map(n=>`<button class="ok dz-resp" data-n="${esc(n)}">${esc(n)}<br><span>domiciliario</span></button>`).join("")}</div>`;
          const otros=dom.filter(n=>n!==suyo);
          return `<div class="dz-cols"><div><div class="mu dz-tit">Responsable</div><button class="ok dz-resp" data-n="${esc(suyo)}">${esc(suyo)}<br><span>${mismoNombre(suyo,nombreMesero(v))?"cargó el domicilio":"lo tiene a cargo"}</span></button></div>
            <div><div class="mu dz-tit">Apoyo</div><div class="dz-otros">${otros.map(n=>`<button data-n="${esc(n)}">${esc(n)}</button>`).join("")||'<span class="mu">—</span>'}</div></div></div>`; }
        const todos=nombresEntrega(v), suyo=todos.find(n=>mismoNombre(n,resp))||resp, otros=todos.filter(n=>!mismoNombre(n,suyo));
        // Izquierda: quien cargó el pedido (responsable de entregarlo). Derecha: los demás, por si hay que cubrir o apoyar
        return `<div class="dz-cols"><div><div class="mu dz-tit">Responsable</div>
          <button class="ok dz-resp" data-n="${esc(suyo)}">${esc(suyo)}<br><span>${mismoNombre(suyo,nombreMesero(v))?"cargó el pedido":"lo tiene a cargo"}</span></button></div>
          <div><div class="mu dz-tit">Cubrir o apoyar</div><div class="dz-otros">${otros.map(n=>`<button data-n="${esc(n)}">${esc(n)}</button>`).join("")||'<span class="mu">—</span>'}</div></div></div>`; })()}${v.mesaId!=="domicilio"?`<button style="width:100%;padding:14px;font-size:16px;margin-top:10px;border:2px solid #ef6c00" id="dz-directo">🍳 Entregado por cocina directamente<br><span class="mu" style="font-size:12px">el ticket pasa solo a caja para el cobro</span></button>`:""}
      <button style="width:100%;margin-top:12px" id="dz-x">Cancelar</button>`);
    const hacer=async (quien,directo)=>{ quien=String(quien||"").trim(); if(!quien) return;
      const ahora=Date.now(), d={ronda:v.ronda||1,quien,fecha:ahora,por:S.yo.nombre,...(directo?{directo:true}:{})};
      const p={despachos:(v.despachos||[]).concat([d]),rondaDespachada:v.ronda||1,cocinaEstado:"despachado",actualizado:ahora};
      // Entregado por cocina: queda servido y se envía solo a caja
      if(directo) Object.assign(p,{servidoEn:v.servidoEn||ahora,servidoPor:v.servidoPor||S.yo.nombre,rondaServida:v.ronda||1,enCaja:true,pidioCuenta:true,enCajaEn:ahora,enCajaPor:S.yo.nombre});
      cerrarModal();
      try{ await S.db.actualizar("vales",id,p); toast(directo?"🍳 Entregado por cocina · enviado a caja":`Despachado → ${quien}`); }catch(e){ toast("Error: "+e.message); } };
    document.querySelectorAll("#modal [data-n]").forEach(b=>b.onclick=()=>hacer(b.dataset.n));
    if($("#dz-directo")) $("#dz-directo").onclick=()=>hacer("Cocina (entrega directa)",true);
    $("#dz-x").onclick=cerrarModal;
  },
  async estadoServido(id){ const v=buscarVale(id); if(!v) return;
    if(!(await confirmar(`¿Marcar el ticket ${pad(v.numero)} como ${verboServir(v).toLowerCase()}? Queda registrado a su nombre.`,"Marcar"))) return;
    try{ await accion.servido(id); }catch(e){ toast("Error: "+e.message); } },
  async servido(id){
    const v=buscarVale(id||S.ped?.valeId); if(!v) return;
    const p={rondaServida:v.ronda||1,actualizado:Date.now()}; if(!v.servidoEn){ p.servidoEn=Date.now(); p.servidoPor=S.yo.nombre; }
    await S.db.actualizar("vales",v.id,p); toast(`✓ ${verboServir(v)}`); },
  async enviarACaja(id){
    const v=buscarVale(id||S.ped?.valeId); if(!v) return;
    if(pendienteCocina(v)&&!(await confirmar("Este pedido todavía tiene platos sin despachar en cocina. ¿Enviarlo a caja de todas formas?","Enviar a caja"))) return;
    const op=await new Promise(ok=>{ modal(`<p>Enviar el ticket ${pad(v.numero)} (<b>${money(v.total)}</b>) a caja para el cobro. ${esLlevarMesa(v.mesaId)?"El pedido deja de aparecer aquí.":"La mesa queda en rojo, pendiente de pago, hasta que caja confirme el pago."}</p>
      <button style="width:100%;padding:12px;border:2px solid #2e7d32" id="ec-cr">💳 Clientes con crédito<br><span class="mu" style="font-size:12px">si el cliente paga con su crédito autorizado</span></button>
      <div class="row" style="margin-top:12px"><span class="sp"></span><button id="ec-x">Cancelar</button><button class="pri" id="ec-ok">Enviar a caja</button></div>`);
      $("#ec-x").onclick=()=>{ cerrarModal(); ok(null); }; $("#ec-ok").onclick=()=>{ cerrarModal(); ok("normal"); }; $("#ec-cr").onclick=()=>{ cerrarModal(); ok("credito"); }; });
    if(!op) return; let cr=null; if(op==="credito"){ cr=await elegirCredito(v.total); if(!cr) return; }
    const ahora=Date.now(), p={enCaja:true,pidioCuenta:true,enCajaEn:ahora,enCajaPor:S.yo.nombre,actualizado:ahora,
      ...(cr?{credito:cr,pagoReportado:{medio:"Crédito",por:S.yo.nombre,fecha:ahora,credito:cr}}:{})};
    if(!v.servidoEn){ p.servidoEn=ahora; p.servidoPor=S.yo.nombre; } p.rondaServida=v.ronda||1;
    await S.db.actualizar("vales",v.id,p); S.ped=null; toast(cr?`Ticket ${pad(v.numero)} enviado a caja · crédito de ${cr.nombre}`:`Ticket ${pad(v.numero)} enviado a caja`); render(); },
});

function modalProductos(){

    <div class="pr-3col">
